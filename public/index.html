    '<input id="buscar-estudiante-cursos" type="text" placeholder="Escribí un nombre..." /></div>' +
    tarjetasHtml +
    formularioAlta;
}

function renderLineaTiempoEvaluacion(evaluaciones) {
  if (evaluaciones.length === 0) return '<p style="font-size:13px; color:var(--muted);">Todavía no hay evaluaciones registradas para armar la línea de tiempo.</p>';
  var ordenadas = evaluaciones.slice().sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
  var tiempos = ordenadas.map(function (e) { return new Date(e.fecha).getTime(); });
  var minT = Math.min.apply(null, tiempos), maxT = Math.max.apply(null, tiempos);
  var rango = maxT - minT || 1;
  var W = 680, H = 210, PAD = 40;

  var puntos = ordenadas.map(function (e) {
    var x = PAD + ((new Date(e.fecha).getTime() - minT) / rango) * (W - 2 * PAD);
    var prom = promedioEvaluacion(e);
    var y = (H - PAD - 20) - ((prom - 1) / 2) * (H - 2 * PAD - 20);
    return { x: x, y: y, prom: prom, fecha: e.fecha };
  });

  var lineaPts = puntos.map(function (p) { return p.x + ',' + p.y; }).join(' ');

  var circulos = puntos.map(function (p) {
    var color = p.prom >= 2.5 ? '#39ff88' : (p.prom >= 1.5 ? '#ffb347' : '#ff4d6d');
    return '<circle cx="' + p.x + '" cy="' + p.y + '" r="7" fill="' + color + '" filter="url(#neonGlow)"><title>' + p.fecha + ' — ' + p.prom.toFixed(1) + '/3</title></circle>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#fff"></circle>';
  }).join('');

  var etiquetasFecha = puntos.map(function (p) {
    return '<text x="' + p.x + '" y="' + (H - 12) + '" font-size="9.5" fill="#9fb3d1" text-anchor="middle" transform="rotate(-30 ' + p.x + ' ' + (H - 12) + ')">' + p.fecha + '</text>';
  }).join('');

  var ultimo = puntos[puntos.length - 1];
  var etiquetaUltimo = ultimo.prom >= 2.5 ? 'Consolidado' : (ultimo.prom >= 1.5 ? 'En desarrollo' : 'Iniciando');
  var colorUltimoTexto = ultimo.prom >= 2.5 ? '#39ff88' : (ultimo.prom >= 1.5 ? '#ffb347' : '#ff4d6d');

  return '' +
    '<div style="display:flex; align-items:baseline; gap:10px; margin-bottom:10px;">' +
    '<span style="font-size:13px; color:var(--muted);">Nivel actual:</span>' +
    '<span style="font-size:16px; font-weight:700; color:' + colorUltimoTexto + '; text-shadow:0 0 8px ' + colorUltimoTexto + ';">' + etiquetaUltimo + '</span>' +
    '<span style="font-size:11px; color:var(--muted);">(' + puntos.length + ' evaluación' + (puntos.length === 1 ? '' : 'es') + ' registrada' + (puntos.length === 1 ? '' : 's') + ')</span>' +
    '</div>' +
    '<div style="background:var(--azul-noche); border-radius:12px; padding:8px 4px;">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:210px;">' +
    '<defs><filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">' +
    '<feGaussianBlur stdDeviation="4.5" result="blur"/>' +
    '<feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
    '</filter></defs>' +
    '<line x1="' + PAD + '" y1="' + (H - PAD - 20) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD - 20) + '" stroke="#2a3f5f" stroke-width="1"/>' +
    '<polyline points="' + lineaPts + '" fill="none" stroke="#5ee7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>' +
    '<polyline points="' + lineaPts + '" fill="none" stroke="#eafcff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    circulos +
    etiquetasFecha +
    '</svg>' +
    '</div>';
}

function renderEvaluacion(sesion) {
  var alumnos = cargarAlumnos();
  var esProfesor = sesion.rol === 'PROFESOR';
  var alumnosVisibles = esProfesor ? alumnos.map(function (a, i) { return { a: a, i: i }; }).filter(function (o) { return o.a.profesor === sesion.email; }) : alumnos.map(function (a, i) { return { a: a, i: i }; });
  var evaluaciones = cargarEvaluaciones();

  if (alumnosVisibles.length === 0) {
    return '<div class="panel"><h2>Evaluación académica</h2><p style="font-size:13px; color:var(--muted);">' + (esProfesor ? 'No tenés estudiantes asignados todavía.' : 'Todavía no hay estudiantes registrados.') + '</p></div>';
  }

  var alumnoSeleccionadoIdx = alumnosVisibles[0].i;
  var evaluacionesAlumno = evaluaciones.filter(function (e) { return e.alumnoIdx === alumnoSeleccionadoIdx; });

  var historialFilas = evaluacionesAlumno.slice().sort(function (a, b) { return new Date(b.fecha) - new Date(a.fecha); }).map(function (e) {
    return '<tr><td>' + e.fecha + '</td><td>' + promedioEvaluacion(e).toFixed(1) + '/3</td><td>' + (e.observaciones || '—') + '</td></tr>';
  }).join('');

  return '' +
    '<div class="panel"><h2>Evaluación académica</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Método propio de Jacquin — cualitativo, por observación del profesor. No es examen ni nota numérica.</p>' +
    '<div class="campo"><label>Estudiante</label><select id="ev-alumno-ver">' +
    alumnosVisibles.map(function (o) { return '<option value="' + o.i + '">' + o.a.nombres + ' ' + o.a.apellidos + '</option>'; }).join('') +
    '</select></div>' +
    '</div>' +

    '<div class="panel" id="panel-linea-tiempo"><h2>Línea de tiempo de avance</h2>' +
    renderLineaTiempoEvaluacion(evaluacionesAlumno) +
    '</div>' +

    '<div class="panel"><h2>Nueva evaluación</h2>' +
    '<div class="grilla-2col">' +
    '<div class="campo"><label>Fecha</label><input id="ev-fecha" type="date" value="' + new Date().toISOString().slice(0, 10) + '" /></div>' +
    INDICADORES_EVALUACION.map(function (ind) {
      return '<div class="campo"><label>' + ETIQUETA_INDICADOR[ind] + '</label><select id="ev-' + ind + '">' +
        Object.keys(ETIQUETA_ESCALA).map(function (k) { return '<option value="' + k + '"' + (k === 'en_desarrollo' ? ' selected' : '') + '>' + ETIQUETA_ESCALA[k] + '</option>'; }).join('') +
        '</select></div>';
    }).join('') +
    '<div class="campo"><label>Observaciones</label><input id="ev-observaciones" type="text" placeholder="Notas del profesor sobre esta evaluación..." /></div>' +
    '</div>' +
    '<button class="btn-primario" id="btn-guardar-evaluacion" style="max-width:280px;">Guardar evaluación</button>' +
    '<p id="msj-evaluacion-ok" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Evaluación registrada — la línea de tiempo ya se actualizó.</p>' +
    '</div>' +

    '<div class="panel"><h2>Historial</h2>' +
    (historialFilas ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Fecha</th><th>Promedio</th><th>Observaciones</th></tr></thead><tbody>' + historialFilas + '</tbody></table></div>' : '<p style="font-size:13px; color:var(--muted);">Sin evaluaciones todavía.</p>') +
    '</div>' +

    (esProfesor ? '' :
    '<div class="panel"><h2>Enviar informe al acudiente</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Genera el PDF del informe y te ayuda a mandarlo por WhatsApp.</p>' +
    '<button class="btn-primario" id="btn-informe-pdf">Generar informe PDF</button>' +
    '</div>') +

    '<div id="comprobante-imprimir" style="display:none;"></div>';
}

function generarHtmlInformeEvaluacion(alumno, evaluaciones) {
  var ordenadas = evaluaciones.slice().sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
  var filas = ordenadas.map(function (e) {
    return '<tr><td style="padding:4px 0;">' + e.fecha + '</td><td style="padding:4px 0; text-align:right;">' + promedioEvaluacion(e).toFixed(1) + '/3</td><td style="padding:4px 0; font-size:11px;">' + (e.observaciones || '—') + '</td></tr>';
  }).join('');
  var ultimo = ordenadas.length ? promedioEvaluacion(ordenadas[ordenadas.length - 1]) : null;
  var nivelTxt = ultimo === null ? '—' : (ultimo >= 2.5 ? 'Consolidado' : (ultimo >= 1.5 ? 'En desarrollo' : 'Iniciando'));

  return '' +
    '<div style="font-family:Arial,sans-serif; max-width:420px; margin:0 auto; padding:24px; border:1px solid #ccc;">' +
    '<div style="text-align:center; border-bottom:2px solid #223F61; padding-bottom:12px; margin-bottom:16px;">' +
    '<div style="font-size:20px; font-weight:bold; color:#223F61;">Jacquin</div>' +
    '<div style="font-size:11px; letter-spacing:2px; color:#666;">ACADEMIA MUSICAL</div>' +
    '</div>' +
    '<h3 style="text-align:center; margin:0 0 6px;">Informe de evaluación académica</h3>' +
    '<p style="text-align:center; font-size:13px; color:#666; margin:0 0 16px;">' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '') + ' — ' + (alumno ? alumno.programa : '') + '</p>' +
    '<p style="text-align:center; font-size:14px; margin:0 0 16px;">Nivel actual: <strong>' + nivelTxt + '</strong></p>' +
    '<table style="width:100%; font-size:12px; border-collapse:collapse;"><thead><tr><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666;">Fecha</td><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666; text-align:right;">Promedio</td><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666;">Observaciones</td></tr></thead><tbody>' + filas + '</tbody></table>' +
    '<p style="text-align:center; font-size:11px; color:#999; margin-top:20px;">Academia Musical Jacquin — evaluación cualitativa por observación del profesor</p>' +
    '</div>';
}

function activarLogicaEvaluacion() {
  var selectVer = document.getElementById('ev-alumno-ver');
  if (selectVer) {
    selectVer.addEventListener('change', function () {
      var idx = Number(this.value);
      var evaluaciones = cargarEvaluaciones().filter(function (e) { return e.alumnoIdx === idx; });
      document.getElementById('panel-linea-tiempo').innerHTML = '<h2>Línea de tiempo de avance</h2>' + renderLineaTiempoEvaluacion(evaluaciones);
    });
  }

  var btnGuardar = document.getElementById('btn-guardar-evaluacion');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var alumnoIdx = Number(document.getElementById('ev-alumno-ver').value);
      var fecha = document.getElementById('ev-fecha').value;
      if (!fecha) { alert('La fecha es obligatoria.'); return; }
      var nueva = { alumnoIdx: alumnoIdx, fecha: fecha, observaciones: document.getElementById('ev-observaciones').value.trim() };
      INDICADORES_EVALUACION.forEach(function (ind) { nueva[ind] = document.getElementById('ev-' + ind).value; });
      var evaluaciones = cargarEvaluaciones();
      evaluaciones.push(nueva);
      guardarEvaluaciones(evaluaciones);
      document.getElementById('msj-evaluacion-ok').style.display = 'block';
      setTimeout(function () { renderContenido('evaluacion'); }, 700);
    });
  }

  var btnInforme = document.getElementById('btn-informe-pdf');
  if (btnInforme) {
    btnInforme.addEventListener('click', function () {
      var alumnoIdx = Number(document.getElementById('ev-alumno-ver').value);
      var alumno = cargarAlumnos()[alumnoIdx];
      var evaluaciones = cargarEvaluaciones().filter(function (e) { return e.alumnoIdx === alumnoIdx; });
      if (evaluaciones.length === 0) { alert('Este estudiante todavía no tiene evaluaciones registradas.'); return; }

      document.getElementById('comprobante-imprimir').innerHTML = generarHtmlInformeEvaluacion(alumno, evaluaciones);
      window.print();

      var telefono = alumno ? (alumno.telefono || '').replace(/\D/g, '') : '';
      if (telefono && confirm('¿Abrir WhatsApp para enviarle el resumen al acudiente? (el PDF hay que adjuntarlo a mano, WhatsApp no permite adjuntar archivos desde un enlace)')) {
        var ultimo = promedioEvaluacion(evaluaciones[evaluaciones.length - 1]);
        var nivel = ultimo >= 2.5 ? 'Consolidado' : (ultimo >= 1.5 ? 'En desarrollo' : 'Iniciando');
        var msj = encodeURIComponent('Hola, te compartimos el avance de ' + alumno.nombres + ' en Academia Musical Jacquin. Nivel actual: ' + nivel + '. Te enviamos el informe completo en PDF.');
        window.open('https://wa.me/' + telefono + '?text=' + msj, '_blank');
      }
    });
  }
}

function panelResumenContable() {
  var totalIngresos = cargarIngresos().reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalGastos = cargarGastos().reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalCompras = cargarCompras().reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
  var totalNomina = cargarNomina().reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
  var balance = totalIngresos - totalGastos - totalCompras - totalNomina;

  function tarjetaKPI(titulo, valor, color) {
    return '<div class="panel" style="border-top:4px solid ' + color + ';">' +
      '<p style="font-size:12px; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:0.04em;">' + titulo + '</p>' +
      '<p style="margin:0; font-size:22px; font-weight:700; color:' + color + ';">' + formatearCOPContable(valor) + '</p>' +
      '</div>';
  }

  return '' +
    '<div class="grilla-2col" style="align-items:stretch;">' +
      tarjetaKPI('Total ingresos', totalIngresos, 'var(--verde)') +
      tarjetaKPI('Total gastos', totalGastos, 'var(--rojo)') +
      tarjetaKPI('Total compras', totalCompras, 'var(--naranja)') +
      tarjetaKPI('Total nómina', totalNomina, 'var(--azul-oscuro)') +
    '</div>' +
    '<div class="panel" style="border-top:4px solid ' + (balance >= 0 ? 'var(--verde)' : 'var(--rojo)') + ';">' +
      '<p style="font-size:12px; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:0.04em;">Balance (ingresos − gastos − compras − nómina)</p>' +
      '<p style="margin:0; font-size:26px; font-weight:700; color:' + (balance >= 0 ? 'var(--verde)' : 'var(--rojo)') + ';">' + formatearCOPContable(balance) + '</p>' +
    '</div>' +
    '<p style="font-size:11px; color:var(--muted);">Resumen financiero visible solo para Administración — la Secretaría puede registrar movimientos pero no ve estos totales.</p>';
}

function renderContabilidad(sesion) {
  var esAdmin = sesion.rol === 'ADMINISTRADOR';
  var pestañas = ['ingresos', 'gastos', 'compras', 'nomina'];
  if (esAdmin) pestañas.push('resumen');
  var etiquetaPestaña = { ingresos: 'Ingresos', gastos: 'Gastos', compras: 'Compras', nomina: 'Nómina', resumen: 'Resumen' };
  if (!esAdmin && tabContabilidadActiva === 'resumen') tabContabilidadActiva = 'ingresos';

  var botonesPestañas = pestañas.map(function (p) {
    var activa = p === tabContabilidadActiva;
    return '<button type="button" onclick="cambiarTabContabilidad(\'' + p + '\')" style="' +
      'padding:8px 16px; border-radius:8px; border:1px solid ' + (activa ? 'var(--azul-oscuro)' : '#e2e5ea') + ';' +
      'background:' + (activa ? 'var(--azul-oscuro)' : '#fff') + '; color:' + (activa ? '#fff' : 'var(--texto)') + ';' +
      'font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-ui);">' + etiquetaPestaña[p] + '</button>';
  }).join('');

  var contenido = '';
  if (tabContabilidadActiva === 'ingresos') contenido = panelIngresos(esAdmin);
  else if (tabContabilidadActiva === 'gastos') contenido = panelGastos(esAdmin);
  else if (tabContabilidadActiva === 'compras') contenido = panelCompras(esAdmin);
  else if (tabContabilidadActiva === 'nomina') contenido = panelNomina(esAdmin);
  else if (tabContabilidadActiva === 'resumen' && esAdmin) contenido = panelResumenContable();

  return '' +
    '<h1 style="font-family:var(--font-wordmark); font-weight:500; font-size:22px; margin:4px 0 6px;">Contabilidad</h1>' +
    (esAdmin ? '' : '<p style="font-size:12px; color:var(--muted); margin:0 0 16px;">Podés registrar ingresos, gastos, compras y nómina. El resumen financiero completo lo ve solo Administración.</p>') +
    '<div style="display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;">' + botonesPestañas + '</div>' +
    contenido;
}

function activarLogicaContabilidad() {
  var btnIngreso = document.getElementById('btn-crear-ingreso');
  if (btnIngreso) {
    btnIngreso.addEventListener('click', function () {
      var valor = Number(document.getElementById('ing-valor').value) || 0;
      var concepto = document.getElementById('ing-concepto').value.trim();
      if (!concepto || !valor) { alert('Concepto y valor son obligatorios.'); return; }
      var lista = cargarIngresos();
      lista.push({
        fecha: document.getElementById('ing-fecha').value,
        concepto: concepto,
        programa: document.getElementById('ing-programa').value,
        categoria: document.getElementById('ing-categoria').value,
        cliente: document.getElementById('ing-cliente').value.trim(),
        metodo: document.getElementById('ing-metodo').value,
        estado: document.getElementById('ing-estado').value,
        valor: valor
      });
      guardarIngresos(lista);
      document.getElementById('msj-ingreso-creado').style.display = 'block';
      setTimeout(function () { renderContenido('contabilidad'); }, 500);
    });
  }

  var btnGasto = document.getElementById('btn-crear-gasto');
  if (btnGasto) {
    btnGasto.addEventListener('click', function () {
      var valor = Number(document.getElementById('gas-valor').value) || 0;
      var concepto = document.getElementById('gas-concepto').value.trim();
      if (!concepto || !valor) { alert('Concepto y valor son obligatorios.'); return; }
      var lista = cargarGastos();
      lista.push({
        fecha: document.getElementById('gas-fecha').value,
        concepto: concepto,
        categoria: document.getElementById('gas-categoria').value,
        proveedor: document.getElementById('gas-proveedor').value.trim(),
        metodo: document.getElementById('gas-metodo').value,
        estado: document.getElementById('gas-estado').value,
        valor: valor
      });
      guardarGastos(lista);
      document.getElementById('msj-gasto-creado').style.display = 'block';
      setTimeout(function () { renderContenido('contabilidad'); }, 500);
    });
  }

  var btnCompra = document.getElementById('btn-crear-compra');
  if (btnCompra) {
    btnCompra.addEventListener('click', function () {
      var articulo = document.getElementById('com-articulo').value.trim();
      var cantidad = Number(document.getElementById('com-cantidad').value) || 0;
      var valorUnit = Number(document.getElementById('com-valor-unit').value) || 0;
      if (!articulo || !cantidad || !valorUnit) { alert('Artículo, cantidad y valor unitario son obligatorios.'); return; }
      var lista = cargarCompras();
      lista.push({
        fecha: document.getElementById('com-fecha').value,
        articulo: articulo,
        categoria: document.getElementById('com-categoria').value,
        proveedor: document.getElementById('com-proveedor').value.trim(),
        cantidad: cantidad,
        valorUnit: valorUnit,
        valorTotal: cantidad * valorUnit,
        metodo: document.getElementById('com-metodo').value,
        estado: document.getElementById('com-estado').value
      });
      guardarCompras(lista);
      document.getElementById('msj-compra-creada').style.display = 'block';
      setTimeout(function () { renderContenido('contabilidad'); }, 500);
    });
  }

  var btnNomina = document.getElementById('btn-crear-nomina');
  if (btnNomina) {
    btnNomina.addEventListener('click', function () {
      var horas = Number(document.getElementById('nom-horas').value) || 0;
      var tarifa = Number(document.getElementById('nom-tarifa').value) || 0;
      var bonos = Number(document.getElementById('nom-bonos').value) || 0;
      var descuentos = Number(document.getElementById('nom-descuentos').value) || 0;
      if (!horas || !tarifa) { alert('Horas y tarifa son obligatorias.'); return; }
      var basico = horas * tarifa;
      var neto = basico + bonos - descuentos;
      var lista = cargarNomina();
      lista.push({
        mes: document.getElementById('nom-mes').value,
        empleado: document.getElementById('nom-empleado').value,
        cargo: document.getElementById('nom-cargo').value.trim(),
        horas: horas,
        tarifa: tarifa,
        basico: basico,
        bonos: bonos,
        descuentos: descuentos,
        neto: neto,
        metodo: document.getElementById('nom-metodo').value,
        estado: document.getElementById('nom-estado').value
      });
      guardarNomina(lista);
      document.getElementById('msj-nomina-creada').style.display = 'block';
      setTimeout(function () { renderContenido('contabilidad'); }, 500);
    });
  }
}

    '<p id="msj-creado" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Usuario creado (guardado en este navegador, no en el backend real).</p>' +
    '</div>' +

    '<div class="panel"><h2>Usuarios</h2>' +
    '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead><tbody id="tbody-usuarios">' + filas + '</tbody></table></div>' +
    '</div>' +

    '<div class="panel"><h2>Vista previa de menú por rol</h2>' +
    '<select id="previa-rol"><option value="ADMINISTRADOR">Administrador</option><option value="DIRECCION">Dirección</option><option value="SECRETARIA">Secretaría</option><option value="PROFESOR">Profesor</option></select>' +
    '<div class="lista-previa" id="lista-previa"></div>' +
    '</div>';
}

function activarLogicaAdmin() {
  var pass = document.getElementById('admin-pass');
  var btn = document.getElementById('btn-crear-usuario');

  function validarPassword() {
    var val = pass.value;
    var todasOk = true;
    POLITICA_PASSWORD.forEach(function (r) {
      var el = document.getElementById('regla-' + r.id);
      var ok = r.test(val);
      el.className = 'regla' + (ok ? ' ok' : '');
      if (!ok) todasOk = false;
    });
    btn.disabled = !todasOk;
  }

  // 'input' cubre tipeo normal; 'change'/'blur' cubren autocompletado o
  // contraseñas sugeridas por el navegador, que a veces no disparan 'input'.
  ['input', 'change', 'blur', 'keyup', 'paste'].forEach(function (evento) {
    pass.addEventListener(evento, validarPassword);
  });
  // Por si el campo ya viene con un valor al cargar la pantalla (autocompletado del navegador).
  setTimeout(validarPassword, 150);

  btn.addEventListener('click', function () {
    var nombre = document.getElementById('admin-nombre').value.trim();
    var email = document.getElementById('admin-email').value.trim();
    var rol = document.getElementById('admin-rol').value;
    if (!nombre || !email) return;
    var nacimiento = document.getElementById('admin-nacimiento').value;
    var usuarios = cargarUsuarios();
    usuarios.push({ nombre: nombre, email: email, rol: rol, nacimiento: nacimiento });
    guardarUsuarios(usuarios);
    document.getElementById('msj-creado').style.display = 'block';
    setTimeout(function () { renderContenido('admin'); }, 600);
  });

  function pintarPrevia() {
    var rol = document.getElementById('previa-rol').value;
    var visibles = modulosVisibles(rol);
    var html = MODULOS.filter(function (m) { return visibles.indexOf(m.key) !== -1; })
      .map(function (m) { return '<div>· ' + m.label + '</div>'; }).join('');
    document.getElementById('lista-previa').innerHTML = html;
  }
  document.getElementById('previa-rol').addEventListener('change', pintarPrevia);
  pintarPrevia();
}

function renderContenido(clave) {
  var sesion = sesionActual();
  var visibles = modulosVisibles(sesion.rol);
  if (visibles.indexOf(clave) === -1) clave = 'dashboard';
  var mod = MODULOS.find(function (m) { return m.key === clave; }) || MODULOS[0];

  // Horarios necesita más ancho para que la grilla se lea bien — el resto
  // de los módulos se mantiene en el ancho angosto de lectura normal.
  document.getElementById('contenido').classList.toggle('ancho-completo', mod.key === 'horarios' || mod.key === 'dashboard' || mod.key === 'matricula');

  if (mod.key === 'dashboard') {
    document.getElementById('contenido').innerHTML = renderDashboard(sesion);
    activarLogicaDashboard();
  } else if (mod.key === 'admin') {
    document.getElementById('contenido').innerHTML = renderAdmin();
    activarLogicaAdmin();
  } else if (mod.key === 'estudiantes') {
    document.getElementById('contenido').innerHTML = renderEstudiantes();
    activarLogicaEstudiantes();
    if (sesion.rol === 'PROFESOR') {
      document.getElementById('contenido').insertAdjacentHTML('afterbegin',
        '<p style="font-size:12px; color:var(--muted); margin-bottom:14px;">Vista acotada a tus estudiantes asignados (el filtrado real depende de datos que todavía no existen).</p>');
    }
  } else if (mod.key === 'matricula') {
    document.getElementById('contenido').innerHTML = renderMatricula(sesion);
    activarLogicaMatricula();
  } else if (mod.key === 'pagos') {
    document.getElementById('contenido').innerHTML = renderPagos();
    activarLogicaPagos();
  } else if (mod.key === 'horarios') {
    document.getElementById('contenido').innerHTML = renderHorarios(sesion);
    activarLogicaHorarios();
  } else if (mod.key === 'asistencia') {
    document.getElementById('contenido').innerHTML = renderAsistencia(sesion);
    activarLogicaAsistencia();
  } else if (mod.key === 'profesores') {
    document.getElementById('contenido').innerHTML = renderProfesores(sesion);
    activarLogicaProfesores();
  } else if (mod.key === 'cursos') {
    document.getElementById('contenido').innerHTML = renderCursos();
    activarLogicaCursos();
  } else if (mod.key === 'evaluacion') {
    document.getElementById('contenido').innerHTML = renderEvaluacion(sesion);
    activarLogicaEvaluacion();
  } else if (mod.key === 'contabilidad') {
    document.getElementById('contenido').innerHTML = renderContabilidad(sesion);
    activarLogicaContabilidad();
  } else {
    var nota = '';
    if (mod.key === 'estudiantes' && sesion.rol === 'PROFESOR') nota = '<p style="margin-top:8px;">Acotado a los alumnos de tu salón (el filtrado real depende de datos que todavía no existen).</p>';
    document.getElementById('contenido').innerHTML = '<div class="placeholder"><h1>' + mod.label + '</h1><p>Pantalla en construcción — sin datos todavía.</p>' + nota + '</div>';
  }
}

function navegar() {
  var clave = location.hash.replace('#', '') || 'dashboard';
  renderNavModulos(clave);
  renderContenido(clave);
}

function mostrarApp() {
  var sesion = sesionActual();
  document.getElementById('vista-login').style.display = 'none';
  document.getElementById('vista-app').style.display = 'block';
  document.getElementById('quien-soy').textContent = sesion.email + ' · ' + sesion.rol;
  if (!location.hash) location.hash = '#dashboard';
  navegar();
}

function mostrarLogin() {
  document.getElementById('vista-app').style.display = 'none';
  document.getElementById('vista-login').style.display = 'flex';
  document.getElementById('in-email').value = '';
  document.getElementById('in-pass').value = '';
}

// ---- Conexión a la API real (backend en Vercel + Supabase) ----
// Si el HTML se abre como archivo local (file://), apunta al sitio
// publicado. Si el HTML se sirve DESDE ese mismo sitio, usa rutas
// relativas — así funciona sin importar el dominio.
var API_BASE = (location.protocol === 'file:') ? 'https://jacquin-sistema.vercel.app' : '';

async function apiFetch(ruta, opciones) {
  var headers = Object.assign({ 'Content-Type': 'application/json' }, (opciones && opciones.headers) || {});
  var sesion = sesionActual();
  if (sesion && sesion.token) headers['Authorization'] = 'Bearer ' + sesion.token;
  var respuesta = await fetch(API_BASE + ruta, Object.assign({}, opciones, { headers: headers }));
  var cuerpo = await respuesta.json().catch(function () { return null; });
  if (!respuesta.ok) {
    var mensaje = (cuerpo && cuerpo.error && cuerpo.error.mensaje) || ('Error de conexión (' + respuesta.status + ')');
    throw new Error(mensaje);
  }
  return cuerpo ? cuerpo.data : null;
}

document.getElementById('form-login').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('in-email').value.trim();
  var pass = document.getElementById('in-pass').value;
  var msjError = document.getElementById('msj-error');
  msjError.style.display = 'none';

  // Identidad ya está conectada al backend real — el resto de los
  // módulos por ahora sigue funcionando con datos locales, se van
  // conectando uno por uno.
  apiFetch('/api/identidad/login', { method: 'POST', body: JSON.stringify({ email: email, password: pass }) })
    .then(function (data) {
      sessionStorage.setItem('jacquin_demo_sesion', JSON.stringify({
        email: data.usuario.email, rol: data.usuario.rol, token: data.token, usuarioId: data.usuario.id
      }));
      mostrarApp();
    })
    .catch(function (err) {
      msjError.textContent = err.message || 'Email o contraseña incorrectos.';
      msjError.style.display = 'block';
    });
});

document.getElementById('btn-salir').addEventListener('click', function () {
  sessionStorage.removeItem('jacquin_demo_sesion');
  location.hash = '';
  mostrarLogin();
});

window.addEventListener('hashchange', navegar);

if (sesionActual()) { mostrarApp(); } else { mostrarLogin(); }
</script>
