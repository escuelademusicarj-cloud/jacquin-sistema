<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jacquin — Sistema de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400&family=Caveat:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --azul-oscuro: #223F61;
    --azul-noche: #152A44;
    --azul-claro: #93B6EE;
    --naranja: #E78C3B;
    --beige: #F3F2EE;
    --texto: #223F61;
    --muted: #6b7686;
    --verde: #2e7d32;
    --rojo: #b3261e;
    --verde-tint: rgba(46,125,50,.10);
    --rojo-tint: rgba(179,38,30,.10);
    --naranja-tint: rgba(231,140,59,.14);
    --azul-tint: rgba(34,63,97,.08);
    --panel-2: #FAF8F3;
    --linea: #E4E1D8;
    --font-ui: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
    --font-wordmark: 'Cormorant Garamond', Georgia, serif;
    --font-hand: 'Caveat', cursive;
  }

  /* ==================== CONTABILIDAD — rediseño moderno ==================== */
  .contab-hero{
    position:relative; width:100%; overflow:hidden; border-radius:18px; margin:6px 0 22px;
    background:
      linear-gradient(100deg, var(--azul-noche) 0%, var(--azul-noche) 36%, rgba(21,42,68,.72) 54%, rgba(21,42,68,.25) 74%, transparent 92%),
      url('contabilidad-analista.jpg');
    background-size: cover, cover;
    background-position: center, 76% center;
    color:#fff;
  }
  .contab-hero-inner{ position:relative; z-index:1; padding:38px 34px; max-width:640px; }
  .contab-hero-eyebrow{
    font-family:var(--font-ui); font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--naranja);
    display:flex; align-items:center; gap:8px; margin:0 0 12px;
  }
  .contab-hero-eyebrow::before{ content:""; width:24px; height:1.5px; background:var(--naranja); display:inline-block; }
  .contab-hero-inner h1{ margin:0; font-family:var(--font-wordmark); font-weight:600; font-size:clamp(26px,3.6vw,40px); line-height:1.05; }
  .contab-hero-inner p{ margin:12px 0 0; font-size:13.5px; color:#d7dee8; line-height:1.6; max-width:420px; }
  @media (max-width:760px){ .contab-hero-inner{ padding:26px 20px; } }

  .contab-tabs{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1.5px solid var(--linea); padding-bottom:0; }
  .contab-tab{
    border:none; background:transparent; color:var(--muted); padding:9px 14px 12px; font-family:var(--font-ui);
    font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:7px; cursor:pointer;
    border-bottom:2.5px solid transparent; position:relative; top:1.5px;
  }
  .contab-tab .dot{ width:6px; height:6px; border-radius:50%; background:var(--linea); }
  .contab-tab.active{ color:var(--azul-oscuro); border-color:var(--azul-oscuro); }
  .contab-tab.active .dot{ background:var(--naranja); }
  .contab-tab:hover{ color:var(--azul-oscuro); }

  .kpi-grid-contab{ display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:minmax(96px,auto); gap:12px; margin-bottom:20px; }
  .kpi-grid-contab > :nth-child(1){ grid-column:1 / 3; grid-row:1 / 3; }
  .kpi-grid-contab > :nth-child(2){ grid-column:3 / 5; grid-row:1 / 2; }
  .kpi-grid-contab > :nth-child(3){ grid-column:5 / 7; grid-row:1 / 2; }
  .kpi-grid-contab > :nth-child(4){ grid-column:3 / 5; grid-row:2 / 3; }
  .kpi-grid-contab > :nth-child(5){ grid-column:5 / 7; grid-row:2 / 3; }
  @media (max-width:900px){
    .kpi-grid-contab{ grid-template-columns:repeat(2,1fr); grid-auto-rows:auto; }
    .kpi-grid-contab > *{ grid-column:auto !important; grid-row:auto !important; }
  }
  .kpi-card-contab{
    position:relative; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:16px 18px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .kpi-card-contab .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
  .kpi-card-contab .val{ font-family:var(--font-ui); font-size:21px; font-weight:800; margin-top:6px; }
  .kpi-card-contab .sub{ font-size:11px; color:var(--muted); margin-top:4px; }
  .kpi-card-contab .icon-badge{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--azul-tint); color:var(--azul-oscuro);
  }
  .kpi-card-contab.pos .val{ color:var(--verde); } .kpi-card-contab.pos .icon-badge{ background:var(--verde-tint); color:var(--verde); }
  .kpi-card-contab.neg .val{ color:var(--rojo); } .kpi-card-contab.neg .icon-badge{ background:var(--rojo-tint); color:var(--rojo); }
  .kpi-card-contab.neu .val{ color:var(--azul-oscuro); }
  .kpi-card-contab.warn .icon-badge{ background:var(--naranja-tint); color:var(--naranja); }
  .kpi-card-contab.hero{
    background:linear-gradient(140deg, var(--azul-oscuro), var(--azul-noche)); border-color:var(--azul-noche);
    box-shadow:0 14px 28px -14px rgba(21,42,68,.5);
  }
  .kpi-card-contab.hero.neg{ background:linear-gradient(140deg, var(--rojo), #7a1a14); border-color:#7a1a14; }
  .kpi-card-contab.hero .lbl, .kpi-card-contab.hero .val, .kpi-card-contab.hero .sub{ color:#fff; }
  .kpi-card-contab.hero .lbl{ opacity:.8; } .kpi-card-contab.hero .sub{ opacity:.72; }
  .kpi-card-contab.hero .icon-badge{ background:rgba(255,255,255,.18); color:#fff; }
  .kpi-card-contab.hero .val{ font-size:clamp(26px,3vw,36px); margin-top:12px; }

  .chart-card-contab{ background:#fff; border:1px solid var(--linea); border-radius:14px; padding:18px 20px; }
  .chart-card-contab h3{ margin:0; font-size:13.5px; color:var(--azul-oscuro); font-family:var(--font-ui); }
  .chart-card-contab .sub{ font-size:11px; color:var(--muted); margin:2px 0 14px; }
  .donut-pro-contab{ position:relative; width:132px; height:132px; margin:0 auto; }
  .donut-pro-contab .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-pro-contab .center .pct{ font-family:var(--font-ui); font-size:21px; font-weight:800; color:var(--azul-oscuro); }
  .donut-pro-contab .center .pct-lbl{ font-size:9px; color:var(--muted); font-weight:700; text-transform:uppercase; }
  .legend-row-contab{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:12px; justify-content:center; }
  .legend-row-contab .li{ display:flex; align-items:center; gap:6px; }
  .legend-row-contab .sw{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-ui); background: var(--beige); color: var(--texto); }
  a { color: inherit; text-decoration: none; }

  /* ---------- Hero / login ---------- */
  #vista-login {
    min-height: 100vh; position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--azul-noche) 0%, var(--azul-oscuro) 100%);
    display: flex; align-items: center; justify-content: center;
  }
  #ecualizador {
    position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 2%; opacity: 0.55;
  }
  #ecualizador .barra {
    width: 1.1%; min-width: 3px; background: var(--azul-claro); border-radius: 3px 3px 0 0;
    animation: pulso 2.4s ease-in-out infinite;
    transform-origin: bottom;
  }
  @keyframes pulso {
    0%, 100% { transform: scaleY(0.25); }
    50% { transform: scaleY(1); }
  }
  #vista-login::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(21,42,68,0.15) 0%, rgba(21,42,68,0.85) 78%, var(--azul-noche) 100%);
  }
  .tarjeta-login {
    position: relative; z-index: 2; width: 100%; max-width: 340px; margin: 24px;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(6px);
    border-radius: 16px; padding: 40px 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; align-items: center;
  }
  .piano-mini { display: flex; gap: 3px; align-items: flex-end; margin-bottom: 14px; }
  .piano-mini div { width: 9px; background: var(--azul-oscuro); border-radius: 3px 3px 0 0; }
  .logo-login { width: 168px; height: auto; display: block; margin: 0 auto 6px; }
  .wordmark { font-family: var(--font-wordmark); font-weight: 500; font-size: 30px; letter-spacing: 0.01em; margin: 0; color: var(--azul-oscuro); }
  .subwordmark { font-size: 10.5px; letter-spacing: 0.22em; color: var(--muted); margin: 3px 0 26px; text-transform: uppercase; }
  .tagline { font-family: var(--font-wordmark); font-style: italic; font-size: 14px; color: var(--muted); text-align: center; margin: 0 0 26px; }
  #form-login { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  #form-login input, .campo input, .campo select { height: 42px; border: 1px solid #dde1e7; border-radius: 8px; padding: 0 14px; font-size: 14px; width: 100%; font-family: var(--font-ui); }
  #form-login input:focus, .campo input:focus, .campo select:focus { outline: 2px solid var(--azul-claro); outline-offset: 1px; border-color: var(--azul-claro); }
  #form-login button {
    height: 44px; background: var(--naranja); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: filter 0.15s;
  }
  #form-login button:hover { filter: brightness(0.94); }
  #msj-error { font-size: 12px; color: var(--rojo); text-align: center; margin: 2px 0 0; display: none; }
  .caja-prueba { background: var(--beige); border-radius: 8px; padding: 10px 12px; margin-top: 16px; width: 100%; }
  .caja-prueba p { margin: 0; font-size: 12px; }
  .caja-prueba p.etiqueta { color: var(--muted); margin-bottom: 4px; }
  .nota-simulado { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }

  /* ---------- App (post-login) ---------- */
  #vista-app { display: none; min-height: 100vh; }
  header.topbar { background: var(--azul-oscuro); color: #fff; padding: 9px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  header.topbar .marca { display: flex; align-items: center; gap: 10px; font-size: 14px; letter-spacing: 0.03em; font-weight: 500; }
  header.topbar .logo-topbar { height: 34px; width: auto; display: block; }
  header.topbar .quien { font-size: 12px; opacity: 0.85; margin-right: 10px; }
  header.topbar button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; height: 30px; padding: 0 12px; font-size: 12px; cursor: pointer; font-family: var(--font-ui); }

  /* Navegación horizontal arriba — reemplaza al sidebar lateral. */
  nav.nav-modulos {
    background: #fff; border-bottom: 1px solid #e2e5ea; padding: 0 20px; display: flex; align-items: center;
    gap: 2px; overflow-x: auto; position: sticky; top: 55px; z-index: 19; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; transition: background 0.2s, border-color 0.2s;
  }
  nav.nav-modulos::-webkit-scrollbar { display: none; }
  nav.nav-modulos a {
    display: flex; align-items: center; gap: 6px; padding: 13px 14px; font-size: 12.5px; color: var(--muted);
    white-space: nowrap; border-bottom: 2.5px solid transparent; flex-shrink: 0;
  }
  nav.nav-modulos a:hover { color: var(--texto); }
  nav.nav-modulos a.activo { color: var(--azul-oscuro); border-bottom-color: var(--naranja); font-weight: 700; }
  nav.nav-modulos a.separador-grupo { border-left: 1px solid #e2e5ea; margin-left: 8px; padding-left: 16px; }
  nav.nav-modulos .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--azul-claro); flex-shrink: 0; }

  /* Modo "sobre la foto": solo en el Dashboard — el nav queda flotando,
     transparente e integrado con el hero, pegado justo debajo de la
     franja azul del logo. */
  nav.nav-modulos.nav-sobre-foto {
    background: linear-gradient(180deg, rgba(15,30,50,0.72) 0%, rgba(15,30,50,0.22) 100%);
    border-bottom: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  nav.nav-modulos.nav-sobre-foto a {
    color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.55); font-weight: 700;
  }
  nav.nav-modulos.nav-sobre-foto a:hover { color: #fff; }
  nav.nav-modulos.nav-sobre-foto a.activo { color: #fff; border-bottom-color: var(--naranja); }
  nav.nav-modulos.nav-sobre-foto a.separador-grupo { border-left-color: rgba(255,255,255,0.32); }
  nav.nav-modulos.nav-sobre-foto .dot { background: #fff; }
  /* Sube el contenido (la foto del hero) para que quede justo debajo del
     nav, sin usar margin negativo sobre el propio nav sticky (poco fiable). */
  nav.nav-modulos.nav-sobre-foto ~ main.contenido { margin-top: -46px; }

  main.contenido { position: relative; overflow: hidden; min-height: calc(100vh - 55px); }
  #piano-fondo { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; gap: 1.6%; padding: 0 4%; opacity: 0.07; pointer-events: none; z-index: 0; }
  #piano-fondo .barra-grande { width: 3.2%; max-width: 34px; background: var(--azul-oscuro); border-radius: 6px 6px 0 0; animation: pulso-lento 6s ease-in-out infinite; transform-origin: bottom; }
  @keyframes pulso-lento { 0%, 100% { transform: scaleY(0.7); } 50% { transform: scaleY(1); } }
  #contenido { position: relative; z-index: 1; padding: 32px; max-width: 1280px; margin: 0 auto; animation: aparecer 0.25s ease; }
  #contenido.ancho-completo { max-width: 100%; margin: 0; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .malla { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .tile { background: #fff; border-top: 4px solid var(--azul-oscuro); border-radius: 0 0 14px 14px; padding: 18px 14px; cursor: pointer; box-shadow: 0 2px 10px rgba(34,63,97,0.08); transition: transform 0.12s, box-shadow 0.12s; }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(34,63,97,0.14); }
  .tile p { margin: 10px 0 0; font-size: 13px; }

  /* ---------- Inicio (post-login): rediseño total estilo "About us" ---------- */

  /* #contenido sin padding/max-width cuando es el Dashboard, para que el
     hero pueda ir de borde a borde pegado al menú de módulos. El resto
     del contenido del dashboard recupera el ancho legible con .dashboard-padded. */
  #contenido.dashboard-bleed { padding: 0; max-width: 100%; margin: 0; }
  .dashboard-padded { padding: 40px 32px 32px; max-width: 1280px; margin: 0 auto; }

  /* Hero full-bleed: foto de ancho completo, pegada al menú de módulos,
     con el texto ("Sobre Jacquin" + título + bajada) superpuesto y legible. */
  .hero-full {
    position: relative; width: 100%; height: clamp(360px, 52vw, 560px);
    overflow: hidden; margin: 0; display: block;
  }
  .hero-full img {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%;
  }
  .hero-full::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(21,42,68,0.92) 0%, rgba(21,42,68,0.78) 28%, rgba(21,42,68,0.35) 52%, rgba(21,42,68,0.05) 72%),
                linear-gradient(0deg, rgba(21,42,68,0.55) 0%, rgba(21,42,68,0) 30%);
  }
  .hero-full-texto {
    position: absolute; left: 0; top: 0; height: 100%; width: 100%; z-index: 2;
    display: flex; align-items: center; padding: 0 6%;
  }
  .hero-full-texto .interior { max-width: 620px; }
  .hero-full .pildora-eyebrow {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.14); color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 13px;
    border-radius: 999px; margin-bottom: 16px;
  }
  .hero-full h1 {
    font-family: var(--font-wordmark); font-weight: 500; font-style: italic; color: #fff;
    font-size: clamp(28px, 3.6vw, 42px); line-height: 1.18; margin: 0 0 14px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.25);
  }
  .hero-full p.subtitulo {
    font-size: 14.5px; color: rgba(255,255,255,0.88); max-width: 460px; margin: 0; line-height: 1.6;
  }

  /* Recuadro flotante "lo que nos diferencia" — se superpone al borde
     inferior de la foto, estilo tarjeta blanca con íconos (ref. Nexora). */
  .diferenciadores-flotante {
    position: relative; z-index: 3; display: flex; justify-content: center; flex-wrap: wrap;
    background: #fff; border-radius: 20px; box-shadow: 0 18px 40px rgba(21,42,68,0.18);
    max-width: 1120px; margin: -46px auto 0; padding: 26px 20px;
  }
  .dif-item {
    display: flex; align-items: center; gap: 13px; padding: 10px 26px;
    border-right: 1px solid #eceff3;
  }
  .dif-item:last-child { border-right: none; }
  .dif-icono {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .dif-icono svg { width: 20px; height: 20px; }
  .dif-texto strong {
    display: block; font-family: var(--font-wordmark); font-weight: 600; font-size: 22px; color: var(--azul-oscuro); line-height: 1.1;
  }
  .dif-texto span { font-size: 11.5px; color: var(--muted); }
  @media (max-width: 900px) {
    .diferenciadores-flotante { margin-top: -30px; border-radius: 16px; }
    .dif-item { border-right: none; width: 50%; padding: 10px 14px; }
  }

  /* Sección "Tus módulos" — panel azul oscuro, grilla de 3 columnas
     centrada con espacio a los lados, mismo patrón de la referencia
     (eyebrow + título + tarjetas) pero con la paleta de Jacquin. */
  .contenedor-modulos {
    background: var(--azul-noche); border-radius: 32px; padding: 54px 60px;
  }
  .seccion-modulos { text-align: center; margin-bottom: 30px; max-width: 480px; margin-left: auto; margin-right: auto; }
  .seccion-modulos .pildora-eyebrow {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); color: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 12px;
    border-radius: 999px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.2);
  }
  .seccion-modulos h2 {
    font-family: var(--font-wordmark); font-weight: 500; font-style: italic; color: #fff;
    font-size: 26px; margin: 0 0 10px;
  }
  .seccion-modulos p.texto-academia { font-size: 13px; color: rgba(255,255,255,0.68); line-height: 1.6; margin: 0; }

  .grilla-modulos {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    max-width: 780px; margin: 0 auto;
  }
  .carta-modulo2 {
    background: #fff; border: none; border-radius: 16px; padding: 24px 22px; text-decoration: none; display: block;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18); transition: transform 0.15s, box-shadow 0.15s;
    text-align: center;
  }
  .carta-modulo2:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.28); }
  .carta-modulo2 .icono-modulo {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--azul-oscuro);
    margin: 0 auto 16px;
  }
  .carta-modulo2 .icono-modulo svg { width: 100%; height: 100%; }
  .carta-modulo2 p.nombre { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; color: var(--texto); }
  .carta-modulo2 p.descripcion { margin: 0 0 12px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .carta-modulo2 span.entrar { font-size: 11.5px; color: var(--azul-oscuro); font-weight: 600; }

  .carta-modulo2.oscura { background: var(--azul-oscuro); border: 1px solid rgba(255,255,255,0.14); box-shadow: none; }
  .carta-modulo2.oscura:hover { border-color: var(--naranja); }
  .carta-modulo2.oscura .icono-modulo { color: #fff; }
  .carta-modulo2.oscura p.nombre { color: #fff; }
  .carta-modulo2.oscura p.descripcion { color: rgba(255,255,255,0.68); }
  .carta-modulo2.oscura span.entrar { color: #fff; }

<script>

var EMAIL_PRUEBA = 'admin@jacquin.local';
var PASS_PRUEBA = 'CambiarEnPrimerIngreso123';

var MODULOS = [
  { key: 'dashboard', label: 'Inicio', grupo: 'principal' },
  { key: 'estudiantes', label: 'Estudiantes', grupo: 'matricula' },
  { key: 'matricula', label: 'Matrícula', grupo: 'matricula' },
  { key: 'pagos', label: 'Pagos y cartera', grupo: 'matricula' },
  { key: 'horarios', label: 'Horarios', grupo: 'matricula' },

  { key: 'cursos', label: 'Cursos y programas', grupo: 'academia' },

  { key: 'evaluacion', label: 'Avances académicos', grupo: 'seguimiento' },

  { key: 'usuarios-permisos', label: 'Usuarios y permisos', grupo: 'admin' }
];

var VISIBILIDAD_ROL = {
  ADMINISTRADOR: MODULOS.map(function (m) { return m.key; }),
  DIRECCION: ['dashboard','estudiantes','matricula','profesores','cursos','horarios','asistencia','pagos','evaluacion','comunicacion','inventario','reportes'],
  // Secretaría ve Contabilidad, pero con visibilidad restringida (renderContabilidad
  // bifurca según rol: solo puede registrar ingresos/gastos/compras/nómina, sin ver
  // el resumen financiero — eso queda reservado al Administrador).
  SECRETARIA: ['dashboard','estudiantes','matricula','cursos','horarios','asistencia','pagos','comunicacion','inventario','contabilidad','eventos'],
  PROFESOR: ['dashboard','estudiantes','profesores','asistencia','evaluacion']
};

var ROLES_SISTEMA = ['ADMINISTRADOR', 'DIRECCION', 'SECRETARIA', 'PROFESOR'];
var ETIQUETA_ROL_MENSAJE = { ADMINISTRADOR: 'Administración', DIRECCION: 'Dirección', SECRETARIA: 'Secretaría', PROFESOR: 'Profesor' };

var POLITICA_PASSWORD = [
  { id: 'p-len', txt: 'Mínimo 8 caracteres', test: function (p) { return p.length >= 8; } },
  { id: 'p-may', txt: 'Al menos 1 mayúscula', test: function (p) { return /[A-Z]/.test(p); } },
  { id: 'p-min', txt: 'Al menos 1 minúscula', test: function (p) { return /[a-z]/.test(p); } },
  { id: 'p-num', txt: 'Al menos 1 número', test: function (p) { return /[0-9]/.test(p); } },
  { id: 'p-sim', txt: 'Al menos 1 símbolo', test: function (p) { return /[^A-Za-z0-9]/.test(p); } }
];

var PROGRAMAS = ['Piano','Guitarra acústica','Guitarra eléctrica','Bajo','Técnica vocal','Violín','Percusión','Iniciación musical','Exploración musical infantil'];

// Un color propio por programa/instrumento — para identificarlos de un
// vistazo en Horarios y Asistencia cuando se ve "General" (todos mezclados).
var COLOR_PROGRAMA = {
  'Piano': '#223F61',
  'Guitarra acústica': '#B5651D',
  'Guitarra eléctrica': '#E78C3B',
  'Bajo': '#6A4C93',
  'Técnica vocal': '#C2185B',
  'Violín': '#2E7D32',
  'Percusión': '#0097A7',
  'Iniciación musical': '#93B6EE',
  'Exploración musical infantil': '#8D6E63'
};
function colorPrograma(nombre) { return COLOR_PROGRAMA[nombre] || 'var(--azul-oscuro)'; }
function chipPrograma(nombre) {
  var color = colorPrograma(nombre);
  return '<span style="display:inline-block; font-weight:700; font-size:inherit; padding:1px 8px; border-radius:8px; background:' + color + '1a; color:' + color + '; border:1px solid ' + color + '55;">' + nombre + '</span>';
}

// Tipos de plan reales, provistos por el usuario (2026-08-14) — a
// diferencia del catálogo anterior (que era estimado), estos son
// precios y horas confirmados de verdad, no inventados.
var TIPOS_PLAN = [
  { nombre: 'Plan Básico', horasSemana: 1, horasMes: 4, valor: 220000, valorHora: 55000, combinaInstrumentos: 0 },
  { nombre: 'Plan Premium', horasSemana: 2, horasMes: 8, valor: 400000, valorHora: 50000, combinaInstrumentos: 2 },
  { nombre: 'Plan Élite', horasSemana: 3, horasMes: 12, valor: 540000, valorHora: 45000, combinaInstrumentos: 2 },
  { nombre: 'Plan Mozart', horasSemana: 4, horasMes: 16, valor: 640000, valorHora: 40000, combinaInstrumentos: 3 },
  { nombre: 'Plan Hermanos', horasSemana: 2, horasMes: 8, valor: 360000, valorHora: 45000, combinaInstrumentos: 0, nota: 'Valor por cada hermano' },
  { nombre: 'Plan Exploración musical', horasSemana: 1, horasMes: 4, valor: 250000, valorHora: null, combinaInstrumentos: 0, programaFijo: 'Exploración musical infantil', nota: 'Solo para 2 a 3.5 años' }
];

function tiposPlanParaPrograma(programa) {
  if (programa === 'Exploración musical infantil') {
    return TIPOS_PLAN.filter(function (t) { return t.programaFijo === 'Exploración musical infantil'; });
  }
  return TIPOS_PLAN.filter(function (t) { return !t.programaFijo; });
}
var ESTADOS_ALUMNO = ['preinscrito','pendiente_matricula','activo','inactivo','retirado'];
var ETIQUETA_ESTADO = { preinscrito:'Preinscrito', pendiente_matricula:'Pendiente de matrícula', activo:'Activo', inactivo:'Inactivo', retirado:'Retirado' };

// ---- Estudiantes: conectado al backend real (Supabase), ya no a localStorage ----
// CACHE_ALUMNOS guarda en memoria lo último que trajo la API. cargarAlumnos()
// sigue siendo síncrona (así ningún lugar del archivo que ya la usa tiene que
// cambiar) — lee de esa caché. refrescarCacheAlumnos() es quien la llena de
// verdad, hablando con /api/academico/estudiantes.
var CACHE_ALUMNOS = [];

// Traduce la forma que devuelve el backend real (fecha_nacimiento,
// programa_principal, acudientes[]...) a la forma que ya espera el resto
// del archivo (nacimiento, programa, acudiente...) — así no hay que tocar
// los demás lugares que leen cargarAlumnos().
function mapearAlumnoDesdeApi(a) {
  var primerAcudiente = (a.acudientes && a.acudientes[0]) || null;
  return {
    id: a.id,
    nombres: a.nombres,
    apellidos: a.apellidos,
    documento: a.documento || '',
    nacimiento: a.fecha_nacimiento || '',
    programa: a.programa_principal || '',
    // programa2 / dirección todavía no existen en el backend real — quedan
    // vacíos hasta que se agreguen esas columnas/campos del lado del servidor.
    programa2: '',
    profesor: a.profesor_id || '',
    telefono: a.telefono_contacto || '',
    correo: a.email_contacto || '',
    direccion: '',
    acudiente: primerAcudiente ? primerAcudiente.nombre : '',
    celularAcudiente: primerAcudiente ? primerAcudiente.telefono : '',
    observaciones: a.observaciones || '',
    estado: a.estado,
    fechaMatricula: a.fecha_matricula || ''
  };
}

async function refrescarCacheAlumnos() {
  try {
    var lista = await apiFetch('/api/academico/estudiantes', { method: 'GET' });
    CACHE_ALUMNOS = (lista || []).map(mapearAlumnoDesdeApi);
  } catch (err) {
    console.error('No se pudo cargar Estudiantes desde el backend:', err.message);
    // Se deja la caché como estaba (no se borra lo último que sí cargó bien).
  }
}

function cargarAlumnos() {
  return CACHE_ALUMNOS;
}
// guardarAlumnos queda para los módulos que todavía no se migraron al backend
// real (Matrícula, Horarios, etc. — se conectan en su propia fase) y que hoy
// siguen tocando campos del alumno que el backend todavía no soporta
// (programa2, dirección, fechaMatrícula). Por ahora solo actualiza la copia
// en memoria: esos cambios puntuales NO viajan a Supabase todavía y se
// pierden al recargar o cambiar de equipo, igual que antes de este arreglo.
// Ojo: si dos módulos migrados y no migrados escriben sobre la misma lista en
// la misma sesión, refrescarCacheAlumnos() (llamada en cada navegación) va a
// pisar estos cambios en memoria con lo que realmente hay en la base de datos.
function guardarAlumnos(lista) { CACHE_ALUMNOS = lista; }

// ---- Matrícula: conectada al backend real ----
// CACHE_PLANES son los planes reales que ya existen en Supabase (tabla
// `planes`). El catálogo comercial (TIPOS_PLAN, más abajo) sigue siendo la
// fuente de lo que se muestra en el formulario — acá solo se resuelve, para
// cada combinación Programa+Tipo elegida, cuál es su fila real en la base
// (o se crea si todavía no existe ninguna inscripción con esa combinación).
var CACHE_PLANES = [];
async function refrescarCachePlanes() {
  try {
    CACHE_PLANES = await apiFetch('/api/matricula/planes', { method: 'GET' }) || [];
  } catch (err) {
    console.error('No se pudo cargar Planes desde el backend:', err.message);
  }
}
function cargarPlanes() { return CACHE_PLANES; }
function guardarPlanes(lista) { CACHE_PLANES = lista; }

// Busca en CACHE_PLANES el plan real para (programa, tipo de TIPOS_PLAN). Si
// no existe todavía, lo crea (solo funciona si quien está logueado es
// ADMINISTRADOR — regla real del backend, ver servicios/matricula/servicio.js).
async function buscarOCrearPlanId(programa, tipo) {
  var existente = CACHE_PLANES.find(function (p) {
    return p.programa === programa && Number(p.horas_semanales) === Number(tipo.horasSemana);
  });
  if (existente) return existente.id;
  var creado = await apiFetch('/api/matricula/planes', {
    method: 'POST',
    body: JSON.stringify({ programa: programa, horasSemanales: tipo.horasSemana, valor: tipo.valor })
  });
  await refrescarCachePlanes();
  return creado.id;
}

// CACHE_INSCRIPCIONES no tiene un solo endpoint "traer todas" en el backend
// (solo existe "inscripciones de este alumno") — se arma pidiendo, por cada
// estudiante en caché, sus propias inscripciones, y se traduce a la misma
// forma que ya usaba el resto del archivo (alumnoIdx, tipoPlanNombre...).
// El campo "pagado" no viene directo del backend acá — se aproxima con el
// estado actual del alumno (activo = ya pagó la matrícula).
var CACHE_INSCRIPCIONES = [];
async function refrescarCacheInscripciones() {
  try {
    var todas = [];
    for (var i = 0; i < CACHE_ALUMNOS.length; i++) {
      var alumno = CACHE_ALUMNOS[i];
      var propias = await apiFetch('/api/matricula/inscripciones/alumno/' + alumno.id, { method: 'GET' });
      (propias || []).forEach(function (ins) {
        var plan = CACHE_PLANES.find(function (p) { return p.id === ins.plan_id; });
        var tipoCoincidente = plan ? TIPOS_PLAN.find(function (t) { return t.horasSemana === plan.horas_semanales; }) : null;
        todas.push({
          alumnoIdx: i,
          tipoPlanNombre: tipoCoincidente ? tipoCoincidente.nombre : (plan ? plan.nombre : '—'),
          horas: plan ? plan.horas_semanales : null,
          valor: plan ? plan.valor : null,
          descuentoPorcentaje: 0,
          fechaInicio: ins.fecha_inicio,
          pagado: alumno.estado === 'activo'

// ---- Helpers de semana ISO (input type="week") ----
function semanaActualStr() {
  var hoy = new Date();
  var d = new Date(Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var inicioAnio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  var numSemana = Math.ceil((((d - inicioAnio) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + (numSemana < 10 ? '0' + numSemana : numSemana);
}
function lunesDeSemana(semanaStr) {
  var partes = semanaStr.split('-W');
  var anio = parseInt(partes[0], 10);
  var semana = parseInt(partes[1], 10);
  var simple = new Date(anio, 0, 1 + (semana - 1) * 7);
  var diaSemana = simple.getDay();
  var lunes = new Date(simple);
  if (diaSemana <= 4) lunes.setDate(simple.getDate() - diaSemana + 1);
  else lunes.setDate(simple.getDate() + 8 - diaSemana);
  return lunes;
}
function fechaColumnaSemana(semanaStr, diaIndice) {
  var lunes = lunesDeSemana(semanaStr);
  var d = new Date(lunes);
  d.setDate(d.getDate() + (diaIndice - 1));
  return d.toISOString().slice(0, 10);
}

function calcularEdadDesdeFecha(fechaStr) {
  var nacimiento = new Date(fechaStr);
  var hoy = new Date();
  var edad = hoy.getFullYear() - nacimiento.getFullYear();
  var m = hoy.getMonth() - nacimiento.getMonth();
  if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) edad--;
  return edad;
}

function esCumpleañosHoy(fechaStr) {
  if (!fechaStr) return false;
  var nacimiento = new Date(fechaStr);
  var hoy = new Date();
  return nacimiento.getMonth() === hoy.getMonth() && nacimiento.getDate() === hoy.getDate();
}

function activarLogicaEstudiantes(volverA) {
  volverA = volverA || 'estudiantes';
  function esMenor(fechaStr) {
    if (!fechaStr) return null;
    var nacimiento = new Date(fechaStr);
    var hoy = new Date();
    var edad = hoy.getFullYear() - nacimiento.getFullYear();
    var m = hoy.getMonth() - nacimiento.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) edad--;
    return edad < 18;
  }

  function calcularEdadTexto(fechaStr) {
    if (!fechaStr) return '';
    var nacimiento = new Date(fechaStr);
    var hoy = new Date();
    var edad = hoy.getFullYear() - nacimiento.getFullYear();
    var m = hoy.getMonth() - nacimiento.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) edad--;
    return edad + ' años';
  }

  var campoNacimiento = document.getElementById('al-nacimiento');
  var campoEdad = document.getElementById('al-edad');
  if (campoNacimiento && campoEdad) {
    campoNacimiento.addEventListener('change', function () {
      var menor = esMenor(this.value);
      document.getElementById('aviso-menor').style.display = menor ? 'block' : 'none';
      document.getElementById('lbl-acudiente').textContent = menor ? 'Nombre del acudiente (obligatorio)' : 'Nombre del acudiente (opcional)';
      campoEdad.value = calcularEdadTexto(this.value);
    });
  }

  document.getElementById('btn-crear-alumno').addEventListener('click', function () {
    var nombres = document.getElementById('al-nombres').value.trim();
    var apellidos = document.getElementById('al-apellidos').value.trim();
    var nacimiento = document.getElementById('al-nacimiento').value;
    var acudiente = document.getElementById('al-acudiente').value.trim();
    if (!nombres || !apellidos) return;
    if (!nacimiento) { alert('La fecha de nacimiento es obligatoria (determina si necesita acudiente).'); return; }
    if (esMenor(nacimiento) && !acudiente) { alert('El alumno es menor de edad: el acudiente es obligatorio.'); return; }
    var campoCorreo = document.getElementById('al-correo');
    var campoCelularAcudiente = document.getElementById('al-celular-acudiente');
    var btnCrear = document.getElementById('btn-crear-alumno');

    // programa2 y dirección se siguen pidiendo en el formulario, pero el
    // backend real (backend/src/dominio/academico/entidades.js) todavía no
    // los recibe — quedan pendientes de una próxima fase, no se pierden por
    // error, es que ese campo todavía no existe del lado del servidor.
    var payload = {
      alumno: {
        nombres: nombres,
        apellidos: apellidos,
        documento: document.getElementById('al-documento').value.trim() || null,
        fechaNacimiento: nacimiento,
        telefonoContacto: document.getElementById('al-telefono').value.trim() || null,
        emailContacto: campoCorreo ? (campoCorreo.value.trim() || null) : null,
        programaPrincipal: document.getElementById('al-programa').value,
        // El select de profesor hoy usa el email del listado local (todavía
        // no migrado) — no es el id real que pide el backend, así que por
        // ahora se manda sin asignar en vez de mandar un id incorrecto.
        profesorId: null,
        observaciones: document.getElementById('al-obs').value.trim() || null
      },
      acudientes: acudiente ? [{
        nombre: acudiente,
        telefono: campoCelularAcudiente ? campoCelularAcudiente.value.trim() : null,
        relacion: 'Acudiente'
      }] : []
    };

    btnCrear.disabled = true;
    apiFetch('/api/academico/estudiantes', { method: 'POST', body: JSON.stringify(payload) })
      .then(function () { return refrescarCacheAlumnos(); })
      .then(function () {
        document.getElementById('msj-alumno-creado').style.display = 'block';
        setTimeout(function () { renderContenido(volverA); }, 500);
      })
      .catch(function (err) {
        alert('No se pudo registrar el estudiante: ' + err.message);
        btnCrear.disabled = false;
      });
  });

  // ---- Carga masiva por Excel — importa estudiantes reales con datos
  // desprolijos (mayúsculas/minúsculas mezcladas, tildes faltantes, errores
  // de tipeo, programas combinados en una sola celda como "Piano y
  // Percusión"). Normaliza el nombre del programa contra la lista oficial
  // de PROGRAMAS, separa Programa 1 / Programa 2 cuando vienen juntos, evita
  // duplicados (mismo documento, o mismo nombre+apellido+nacimiento), y deja
  // un reporte de qué filas necesitan revisión manual en vez de asignar
  // "Piano" a ciegas cuando no reconoce el texto. ----
  var btnSubirExcel = document.getElementById('btn-subir-excel-estudiantes');
  var inputExcel = document.getElementById('input-excel-estudiantes');
  if (btnSubirExcel && inputExcel) {
    btnSubirExcel.addEventListener('click', function () { inputExcel.click(); });
    inputExcel.addEventListener('change', function () {
      var archivo = this.files[0];
      if (!archivo) return;
      if (typeof XLSX === 'undefined') { alert('No se pudo cargar el lector de Excel — revisá tu conexión a internet e intentá de nuevo.'); return; }

      var estadoElegido = (document.getElementById('sel-estado-excel-estudiantes') || {}).value || 'preinscrito';

      var lector = new FileReader();
      lector.onload = function (e) {
        try {
          var datos = new Uint8Array(e.target.result);
          var libro = XLSX.read(datos, { type: 'array', cellDates: true });
          var hoja = libro.Sheets[libro.SheetNames[0]];
          var filas = XLSX.utils.sheet_to_json(hoja, { defval: '' });

          // Quita tildes y normaliza espacios/mayúsculas, para poder comparar
          // "Percusión", "PERCUSION" y "Percusion" como si fueran lo mismo.
          function normalizarTexto(txt) {
            return String(txt || '')
              .toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\s+/g, ' ')
              .trim();
          }

          // Busca una columna por nombre ignorando tildes/mayúsculas — así
          // "TELÉFONO DE CONTACTO" coincide igual con "telefono de contacto".
          function buscarCampo(fila, nombres) {
            var claves = Object.keys(fila);
            for (var i = 0; i < nombres.length; i++) {
              var objetivo = normalizarTexto(nombres[i]);
              var clave = claves.find(function (k) { return normalizarTexto(k) === objetivo; });
              if (clave) return String(fila[clave]).trim();
            }
            return '';
          }
          function formatearFecha(valor) {
            if (!valor) return '';
            if (valor instanceof Date) return valor.toISOString().slice(0, 10);
            var texto = String(valor).trim();
            var m = texto.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
            if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;
            return '';
          }

          // Diccionario de coincidencias (texto normalizado sin tildes →
          // nombre oficial en PROGRAMAS). Se compara por "contiene", en
          // orden de más específico a menos específico, para no confundir
          // p.ej. "guitarra electrica" con "guitarra" a secas.
          var SINONIMOS_PROGRAMA = [
            { patron: 'guitarra electr', oficial: 'Guitarra eléctrica' },
            { patron: 'guitarra acust', oficial: 'Guitarra acústica' },
            { patron: 'bajo', oficial: 'Bajo' },
            { patron: 'percusion', oficial: 'Percusión' },
            { patron: 'tecnica vocal', oficial: 'Técnica vocal' },
            { patron: 'tec voca', oficial: 'Técnica vocal' },
            { patron: 'vocal', oficial: 'Técnica vocal' },
            { patron: 'violin', oficial: 'Violín' },
            { patron: 'exploracion', oficial: 'Exploración musical infantil' },
            { patron: 'iniciacion', oficial: 'Iniciación musical' },
            { patron: 'pianp', oficial: 'Piano' }, // typo frecuente detectado en la planilla
            { patron: 'piano', oficial: 'Piano' },
            { patron: 'guitarra', oficial: 'Guitarra acústica' } // ambigua — sin "eléctrica" se asume acústica
          ];

          // Reconoce un fragmento de texto de programa y devuelve el nombre
          // oficial, o null si no coincide con nada conocido (p.ej. "Ukelele",
          // "Seniors" — cosas que hoy no son un programa de PROGRAMAS).
          function reconocerPrograma(fragmento) {
            var norm = normalizarTexto(fragmento);
            if (!norm) return null;
            for (var i = 0; i < SINONIMOS_PROGRAMA.length; i++) {
              if (norm.indexOf(SINONIMOS_PROGRAMA[i].patron) !== -1) return SINONIMOS_PROGRAMA[i].oficial;
            }
            return null;
          }

          // Separa celdas como "Piano y Percusión" / "Guitarra + Técnica
          // Vocal" en sus programas individuales, y arma programa/programa2
          // ya normalizados. Devuelve también si hubo algo sin reconocer,
          // para poder avisarle al usuario cuáles filas revisar a mano.
          function interpretarPrograma(textoOriginal) {
            var partes = String(textoOriginal || '').split(/\s+y\s+|\s*\+\s*|\s*\/\s*|,/i).map(function (p) { return p.trim(); }).filter(Boolean);
            if (partes.length === 0) return { programa: '', programa2: '', sinReconocer: false, ambigua: false };

            var reconocidos = [];
            var huboSinReconocer = false;
            var huboAmbigua = false;
            partes.forEach(function (parte) {
              var oficial = reconocerPrograma(parte);
              if (!oficial) { huboSinReconocer = true; return; }
              if (normalizarTexto(parte) === 'guitarra') huboAmbigua = true;
              if (reconocidos.indexOf(oficial) === -1) reconocidos.push(oficial);
            });

            return {
              programa: reconocidos[0] || '',
              programa2: reconocidos[1] || '',
              sinReconocer: huboSinReconocer,
              ambigua: huboAmbigua
            };
          }

          var alumnosExistentes = cargarAlumnos();
          var alumnosNuevos = [];
          var importados = 0, omitidos = 0, duplicados = 0;
          var filasParaRevisar = []; // { nombre, textoOriginal, motivo }

          filas.forEach(function (fila) {
            var nombres = buscarCampo(fila, ['nombres', 'nombre']);
            var apellidos = buscarCampo(fila, ['apellidos', 'apellido']);
            if (!nombres || !apellidos) { omitidos++; return; }

            var documento = buscarCampo(fila, ['documento', 'documento de identidad', 'cedula', 'cédula']);
            var nacimiento = formatearFecha(buscarCampo(fila, ['fecha de nacimiento', 'nacimiento', 'fecha nacimiento']));

            // Evita duplicados: mismo documento (si hay), o mismo
            // nombre+apellido+nacimiento, ya sea contra lo que ya había en
            // el sistema o contra otra fila de esta misma planilla.
            var yaExiste = alumnosExistentes.concat(alumnosNuevos).some(function (a) {
              if (documento && a.documento && a.documento === documento) return true;
              return a.nombres === nombres && a.apellidos === apellidos && a.nacimiento === nacimiento;
            });
            if (yaExiste) { duplicados++; return; }

            var textoProgramaOriginal = buscarCampo(fila, ['programa', 'programa 1', 'programa1']);
            var interpretado = interpretarPrograma(textoProgramaOriginal);
            var programaFinal = interpretado.programa || textoProgramaOriginal || PROGRAMAS[0];

            var notasImportacion = [];
            if (interpretado.sinReconocer) {
              notasImportacion.push('Programa del Excel sin reconocer: "' + textoProgramaOriginal + '" — revisar y corregir.');
              filasParaRevisar.push({ nombre: nombres + ' ' + apellidos, texto: textoProgramaOriginal, motivo: 'no reconocido' });
            } else if (interpretado.ambigua) {
              notasImportacion.push('Programa "Guitarra" importado como Guitarra acústica por defecto — confirmar si es eléctrica.');
              filasParaRevisar.push({ nombre: nombres + ' ' + apellidos, texto: textoProgramaOriginal, motivo: 'guitarra ambigua' });
            }

            var fechaInicioExcel = formatearFecha(buscarCampo(fila, ['fecha inicio', 'fecha de inicio']));
            var observacionesExcel = buscarCampo(fila, ['observaciones', 'observacion', 'observación']);

            var nuevoAlumno = {
              nombres: nombres,
              apellidos: apellidos,
              documento: documento,
              nacimiento: nacimiento,
              programa: programaFinal,
              programa2: interpretado.programa2 || '',
              profesor: '',
              telefono: buscarCampo(fila, ['telefono', 'teléfono', 'telefono de contacto', 'celular']),
              correo: buscarCampo(fila, ['correo', 'correo electronico', 'correo electrónico', 'email']),
              direccion: buscarCampo(fila, ['direccion', 'dirección']),
              acudiente: buscarCampo(fila, ['acudiente', 'nombre del acudiente']),
              celularAcudiente: buscarCampo(fila, ['celular del acudiente', 'celular acudiente', 'telefono acudiente']),
              observaciones: (observacionesExcel ? observacionesExcel + ' — ' : '') + notasImportacion.join(' '),
              estado: estadoElegido
            };
            if (estadoElegido === 'activo') {
              nuevoAlumno.fechaMatricula = fechaInicioExcel || new Date().toISOString().slice(0, 10);
            }

            alumnosNuevos.push(nuevoAlumno);
            importados++;
          });

          guardarAlumnos(alumnosExistentes.concat(alumnosNuevos));

          var resumenPartes = [importados + ' estudiante(s) importado(s) como "' + (estadoElegido === 'activo' ? 'Activo' : 'Preinscrito') + '"'];
          if (duplicados) resumenPartes.push(duplicados + ' fila(s) omitida(s) por estar duplicadas');
          if (omitidos) resumenPartes.push(omitidos + ' fila(s) omitida(s) por falta de nombre/apellido');

          var htmlRevision = '';
          if (filasParaRevisar.length) {
            htmlRevision = '<p style="margin:10px 0 4px; font-weight:600;">' + filasParaRevisar.length + ' estudiante(s) con el programa sin confirmar — revisá su ficha en Estudiantes:</p>' +
              '<ul style="margin:0; padding-left:18px;">' +
              filasParaRevisar.slice(0, 25).map(function (r) { return '<li>' + r.nombre + ' — "' + r.texto + '" (' + r.motivo + ')</li>'; }).join('') +
              (filasParaRevisar.length > 25 ? '<li>… y ' + (filasParaRevisar.length - 25) + ' más.</li>' : '') +
              '</ul>';
          }

          var msj = document.getElementById('msj-excel-estudiantes');
          msj.style.color = 'var(--texto)';
          msj.innerHTML = '<span style="color:var(--verde); font-weight:600;">' + resumenPartes.join(' · ') + '.</span>' + htmlRevision;
          msj.style.display = 'block';
          setTimeout(function () { renderContenido('estudiantes'); }, filasParaRevisar.length ? 4000 : 900);
        } catch (err) {
          alert('No se pudo leer el archivo. Revisá que sea un Excel/CSV válido, con columnas como Nombres, Apellidos, Programa, etc.');
        }
      };
      lector.readAsArrayBuffer(archivo);
    });
  }

  // ---- Editor de estudiantes matriculados ----
  var modalEditor = document.getElementById('modal-editar-estudiante');
  if (modalEditor) {
    document.querySelectorAll('.btn-editar-matriculado').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-alumno-idx'));
        var alumno = cargarAlumnos()[idx];
        var inscripciones = cargarInscripciones().filter(function (x) { return x.alumnoIdx === idx; });
        var ins = inscripciones[inscripciones.length - 1];
        if (!alumno || !ins) return;

        modalEditor.setAttribute('data-alumno-idx', idx);
        document.getElementById('ed-titulo').textContent = 'Editar — ' + alumno.nombres + ' ' + alumno.apellidos;
        document.getElementById('ed-nombres').value = alumno.nombres || '';
        document.getElementById('ed-apellidos').value = alumno.apellidos || '';
        document.getElementById('ed-documento').value = alumno.documento || '';
        document.getElementById('ed-nacimiento').value = alumno.nacimiento || '';
        document.getElementById('ed-programa').value = alumno.programa || PROGRAMAS[0];
        document.getElementById('ed-programa2').value = alumno.programa2 || '';
        document.getElementById('ed-profesor').value = alumno.profesor || '';
        document.getElementById('ed-telefono').value = alumno.telefono || '';
        document.getElementById('ed-correo').value = alumno.correo || '';
        document.getElementById('ed-direccion').value = alumno.direccion || '';
        document.getElementById('ed-acudiente').value = alumno.acudiente || '';
        document.getElementById('ed-celular-acudiente').value = alumno.celularAcudiente || '';
        document.getElementById('ed-obs').value = alumno.observaciones || '';

        function formatearCOP(numero) { return '$ ' + Number(numero).toLocaleString('es-CO'); }
        function repoblarTiposPlan() {
          var selectTipo = document.getElementById('ed-tipo-plan');
          var tipos = tiposPlanParaPrograma(alumno.programa);
          selectTipo.innerHTML = tipos.map(function (t) { return '<option value="' + t.nombre + '">' + t.nombre + ' (' + t.horasSemana + 'h/sem)</option>'; }).join('');
          selectTipo.value = ins.tipoPlanNombre;
          if (selectTipo.value !== ins.tipoPlanNombre) selectTipo.selectedIndex = 0;
          aplicarTipoEdicion();
        }
        function aplicarTipoEdicion() {
          var tipo = TIPOS_PLAN.find(function (t) { return t.nombre === document.getElementById('ed-tipo-plan').value; });
          if (!tipo) return;
          document.getElementById('ed-horas').value = tipo.horasSemana + ' h/semana';
          document.getElementById('ed-valor').value = formatearCOP(tipo.valor);
        }
        repoblarTiposPlan();
        document.getElementById('ed-tipo-plan').addEventListener('change', aplicarTipoEdicion);
        document.getElementById('ed-descuento').value = ins.descuentoPorcentaje || 0;
        document.getElementById('ed-fecha-inicio').value = ins.fechaInicio || '';
        document.getElementById('ed-estado-txt').value = ETIQUETA_ESTADO[alumno.estado] || alumno.estado;

        modalEditor.style.display = 'flex';
      });
    });

    var btnCancelarEditor = document.getElementById('btn-cancelar-editor-estudiante');
    if (btnCancelarEditor) btnCancelarEditor.addEventListener('click', function () { modalEditor.style.display = 'none'; });

    // "Eliminar" nunca borra el registro (regla del sistema: el historial de
    // un estudiante es inmutable) — pasa su estado a "Retirado", que ya
    // existe como estado válido y queda visible en el historial.
    var btnEliminarEditor = document.getElementById('btn-eliminar-editor-estudiante');
    if (btnEliminarEditor) {
      btnEliminarEditor.addEventListener('click', function () {
        var idx = Number(modalEditor.getAttribute('data-alumno-idx'));
        var alumnos = cargarAlumnos();
        var alumno = alumnos[idx];
        if (!alumno) return;
        if (!confirm('¿Retirar a ' + alumno.nombres + ' ' + alumno.apellidos + ' de la academia? No se borra su historial — queda marcado como "Retirado".')) return;
        btnEliminarEditor.disabled = true;
        apiFetch('/api/academico/estudiantes/' + alumno.id + '/estado', {
          method: 'PATCH',
          body: JSON.stringify({ estado: 'retirado', motivo: 'Retirado desde la ficha del estudiante' })
        })
          .then(function () { return refrescarCacheAlumnos(); })
          .then(function () {
            modalEditor.style.display = 'none';
            renderContenido('estudiantes');
          })
          .catch(function (err) {
            alert('No se pudo retirar al estudiante: ' + err.message);
            btnEliminarEditor.disabled = false;
          });
      });
    }

    var btnGuardarEditor = document.getElementById('btn-guardar-editor-estudiante');
    if (btnGuardarEditor) {
      btnGuardarEditor.addEventListener('click', function () {
        var idx = Number(modalEditor.getAttribute('data-alumno-idx'));
        var nombres = document.getElementById('ed-nombres').value.trim();
        var apellidos = document.getElementById('ed-apellidos').value.trim();
        if (!nombres || !apellidos) { alert('Nombres y apellidos son obligatorios.'); return; }

        var alumnos = cargarAlumnos();
        var alumno = alumnos[idx];
        alumno.nombres = nombres;
        alumno.apellidos = apellidos;
        alumno.documento = document.getElementById('ed-documento').value.trim();
        alumno.nacimiento = document.getElementById('ed-nacimiento').value;
        alumno.programa = document.getElementById('ed-programa').value;
        alumno.programa2 = document.getElementById('ed-programa2').value;
        alumno.profesor = document.getElementById('ed-profesor').value;
        alumno.telefono = document.getElementById('ed-telefono').value.trim();
        alumno.correo = document.getElementById('ed-correo').value.trim();
        alumno.direccion = document.getElementById('ed-direccion').value.trim();
        alumno.acudiente = document.getElementById('ed-acudiente').value.trim();
        alumno.celularAcudiente = document.getElementById('ed-celular-acudiente').value.trim();
        alumno.observaciones = document.getElementById('ed-obs').value.trim();
        guardarAlumnos(alumnos);

        var inscripciones = cargarInscripciones();
        var indicesIns = inscripciones.map(function (x, i) { return x.alumnoIdx === idx ? i : -1; }).filter(function (i) { return i !== -1; });
        var ultimoIdx = indicesIns[indicesIns.length - 1];
        if (ultimoIdx !== undefined) {
          var tipoPlanNombre = document.getElementById('ed-tipo-plan').value;
          var tipo = TIPOS_PLAN.find(function (t) { return t.nombre === tipoPlanNombre; });
          inscripciones[ultimoIdx].tipoPlanNombre = tipoPlanNombre;
          if (tipo) { inscripciones[ultimoIdx].horas = tipo.horasSemana; inscripciones[ultimoIdx].valor = tipo.valor; }
          inscripciones[ultimoIdx].descuentoPorcentaje = Number(document.getElementById('ed-descuento').value || 0);
          inscripciones[ultimoIdx].fechaInicio = document.getElementById('ed-fecha-inicio').value;
          guardarInscripciones(inscripciones);
        }

        modalEditor.style.display = 'none';
        renderContenido('estudiantes');
      });
    }
  }
}

function renderMatricula(sesion) {
  var alumnos = cargarAlumnos();
  var inscripciones = cargarInscripciones();

  var filasBusqueda = alumnos.map(function (a, i) {
    var telefono = (a.telefono || '').replace(/\D/g, '');
    var mensaje = encodeURIComponent('Hola, te escribimos de Academia Musical Jacquin sobre la matrícula de ' + a.nombres + '.');
    var botonWhatsapp = telefono
      ? '<a href="https://wa.me/' + telefono + '?text=' + mensaje + '" target="_blank" rel="noopener" style="font-size:12px; background:#25D366; color:#fff; padding:5px 10px; border-radius:6px; text-decoration:none; display:inline-block;">WhatsApp</a>'
      : '<span style="font-size:11px; color:var(--muted); font-style:italic;">sin teléfono</span>';
    return '<tr class="fila-busqueda-matricula" data-nombre="' + (a.nombres + ' ' + a.apellidos).toLowerCase() + '">' +
      '<td style="font-weight:600;">' + a.nombres + ' ' + a.apellidos + '</td>' +
      '<td>' + a.programa + '</td>' +
      '<td><span class="chip-rol">' + ETIQUETA_ESTADO[a.estado] + '</span></td>' +
      '<td>' + (a.acudiente || '<span style="color:var(--muted); font-style:italic;">—</span>') + '</td>' +
      '<td>' + botonWhatsapp + '</td>' +
      '</tr>';
  }).join('');

  var panelBusqueda =
    '<div class="panel"><h2>Buscar estudiante</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Consultá el estado de matrícula de cualquier estudiante y escribile al acudiente por WhatsApp directo.</p>' +
    '<input id="buscar-estudiante-matricula" type="text" placeholder="Escribí un nombre..." />' +
    (alumnos.length === 0 ? '<p style="font-size:13px; color:var(--muted); margin-top:10px;">Todavía no hay estudiantes registrados.</p>' :
     '<div class="tabla-scroll" style="margin-top:12px;"><table class="tabla-usuarios"><thead><tr><th>Estudiante</th><th>Programa</th><th>Estado</th><th>Acudiente</th><th></th></tr></thead><tbody>' + filasBusqueda + '</tbody></table></div>') +
    '</div>';

  var filasInscripciones = inscripciones.map(function (i) {
    var alumno = alumnos[i.alumnoIdx];
    var estadoTxt = i.pagado ? 'Activo (pagado)' : 'Pendiente de matrícula';
    return '<tr><td>' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '—') + '</td><td>' + i.tipoPlanNombre + '</td><td>' + i.fechaInicio + '</td><td><span class="chip-rol">' + estadoTxt + '</span></td></tr>';
  }).join('');

  // Inscribir: un único paso. El programa se toma del estudiante ya
  // registrado (no se vuelve a pedir) — sólo falta elegir el tipo de
  // plan real de la academia; horas/valor se autocompletan solos.

    '<div class="fondo-decorado">' + bloquesFondoDecorado() +

      '</div>' +
      '<div class="split-der">' +
        '<h2>Inscribir estudiante</h2>' +
        (alumnos.length === 0 ? '<p class="ayuda">Primero registrá un estudiante en el módulo Estudiantes.</p>' :
        '<p class="ayuda">El programa se toma del estudiante elegido — se puede corregir acá y queda guardado también en su ficha.</p>' +
        '<div class="grilla-moderna">' +
        '<div class="campo-moderno"><label>Estudiante</label><select id="in-alumno">' +
        alumnos.map(function (a, i) { return '<option value="' + i + '">' + a.nombres + ' ' + a.apellidos + ' — ' + a.programa + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="campo-moderno"><label>Programa 1</label><select id="in-programa">' +
        PROGRAMAS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="campo-moderno"><label>Programa 2 (opcional)</label><select id="in-programa2">' +
        '<option value="">Ninguno</option>' +
        PROGRAMAS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="campo-moderno"><label>Tipo de plan</label><select id="in-tipo-plan"></select></div>' +
        '<div class="campo-moderno"><label>Horas por semana</label><input id="in-horas" type="text" readonly /></div>' +
        '<div class="campo-moderno"><label>Valor (mensualidad)</label><input id="in-valor" type="text" readonly /></div>' +
        '<div class="campo-moderno"><label>Descuento (%)</label><input id="in-descuento" type="number" min="0" max="100" value="0" /></div>' +
        '<div class="campo-moderno"><label>Total con descuento</label><input id="in-total" type="text" readonly style="color:var(--azul-oscuro); font-weight:700;" /></div>' +
        '<div class="campo-moderno"><label>Fecha de inicio</label><input id="in-fecha" type="date" /></div>' +
        '<div class="campo-moderno"><label>¿Ya pagó?</label><select id="in-pagado"><option value="no">No, todavía no</option><option value="si">Sí, ya pagó</option></select></div>' +
        '<div class="campo-moderno"><label id="lbl-fecha-pago">Fecha límite de pago</label><input id="in-fecha-pago" type="date" /></div>' +
        '<div class="campo-moderno" id="campo-medio-pago" style="display:none;"><label>Medio de pago</label><select id="in-medio-pago"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div>' +
        '</div>' +
        '<p id="in-nota-tipo" style="font-size:11px; color:var(--naranja); margin:6px 0 10px; display:none;"></p>' +
        '<button class="btn-moderno" id="btn-inscribir">Inscribir</button>' +
        '<p id="msj-inscripcion" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;"></p>') +
      '</div>' +
    '</div>' +
    '</div>';

  return '' +
    panelInscribir +
    panelBusqueda +
    '<div class="panel"><h2>Inscripciones (' + inscripciones.length + ')</h2>' +
    (inscripciones.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Todavía no hay inscripciones.</p>' :
     '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Estudiante</th><th>Plan</th><th>Inicio</th><th>Estado</th></tr></thead><tbody>' + filasInscripciones + '</tbody></table></div>') +
    '</div>';
}

function activarLogicaMatricula() {
  var buscador = document.getElementById('buscar-estudiante-matricula');
  if (buscador) {
    buscador.addEventListener('input', function () {
      var termino = this.value.trim().toLowerCase();
      document.querySelectorAll('.fila-busqueda-matricula').forEach(function (fila) {
        fila.style.display = fila.getAttribute('data-nombre').indexOf(termino) !== -1 ? '' : 'none';
      });
    });
  }

  function formatearCOP(numero) {
    return '$ ' + Number(numero).toLocaleString('es-CO');
  }

  var selectAlumno = document.getElementById('in-alumno');
  if (!selectAlumno) return; // no hay estudiantes registrados todavía

  var alumnos = cargarAlumnos();

  function recalcularTotal() {
    var valorCrudo = Number((document.getElementById('in-valor').value || '').replace(/\D/g, '')) || 0;
    var descuento = Number(document.getElementById('in-descuento').value || 0);
    var total = Math.round(valorCrudo - (valorCrudo * descuento / 100));
    document.getElementById('in-total').value = formatearCOP(total);
  }

  function aplicarTipoPlanSeleccionado() {
    var selectTipo = document.getElementById('in-tipo-plan');
    var tipo = TIPOS_PLAN.find(function (t) { return t.nombre === selectTipo.value; });
    var notaEl = document.getElementById('in-nota-tipo');
    if (!tipo) return;
    document.getElementById('in-horas').value = tipo.horasSemana + ' h/semana';
    document.getElementById('in-valor').value = formatearCOP(tipo.valor);
    var notas = [];
    if (tipo.combinaInstrumentos > 0) notas.push('Puede combinar hasta ' + tipo.combinaInstrumentos + ' instrumentos.');
    if (tipo.nota) notas.push(tipo.nota);
    if (notas.length) { notaEl.textContent = notas.join(' '); notaEl.style.display = 'block'; }
    else { notaEl.style.display = 'none'; }
    recalcularTotal();
  }

  // El programa se precarga desde el estudiante ya registrado, pero ahora
  // se puede corregir acá mismo (Programa 1 y Programa 2) — al inscribir,
  // el cambio se guarda también en la ficha del estudiante.
  function alDefinirEstudiante() {
    var alumno = alumnos[Number(selectAlumno.value)];
    if (!alumno) return;
    document.getElementById('in-programa').value = alumno.programa;
    document.getElementById('in-programa2').value = alumno.programa2 || '';
    repoblarTiposPlanPorPrograma();
  }

  function repoblarTiposPlanPorPrograma() {
    var programaElegido = document.getElementById('in-programa').value;
    var selectTipo = document.getElementById('in-tipo-plan');
    var tipos = tiposPlanParaPrograma(programaElegido);
    selectTipo.innerHTML = tipos.map(function (t) { return '<option value="' + t.nombre + '">' + t.nombre + ' (' + t.horasSemana + 'h/sem)</option>'; }).join('');
    aplicarTipoPlanSeleccionado();
  }

  selectAlumno.addEventListener('change', alDefinirEstudiante);
  document.getElementById('in-programa').addEventListener('change', repoblarTiposPlanPorPrograma);
  document.getElementById('in-tipo-plan').addEventListener('change', aplicarTipoPlanSeleccionado);
  document.getElementById('in-descuento').addEventListener('input', recalcularTotal);
  alDefinirEstudiante(); // arranca ya cargado con el primer estudiante de la lista

  var selectPagado = document.getElementById('in-pagado');
  if (selectPagado) {
    selectPagado.addEventListener('change', function () {
      var esPagado = this.value === 'si';
      document.getElementById('lbl-fecha-pago').textContent = esPagado ? 'Fecha de pago' : 'Fecha límite de pago';
      document.getElementById('campo-medio-pago').style.display = esPagado ? 'block' : 'none';
    });
  }

  var btnInscribir = document.getElementById('btn-inscribir');
  if (btnInscribir) {
    btnInscribir.addEventListener('click', function () {
      var fechaInicio = document.getElementById('in-fecha').value;
      var fechaPago = document.getElementById('in-fecha-pago').value;
      var pagado = document.getElementById('in-pagado').value === 'si';
      var alumnoIdx = Number(selectAlumno.value);
      var alumno = alumnos[alumnoIdx];
      var tipoPlanNombre = document.getElementById('in-tipo-plan').value;
      var tipo = TIPOS_PLAN.find(function (t) { return t.nombre === tipoPlanNombre; });
      if (!fechaInicio) { alert('La fecha de inicio es obligatoria.'); return; }
      if (!fechaPago) { alert('Falta la fecha de pago (si ya pagó) o la fecha límite (si no pagó).'); return; }
      if (!tipo) { alert('Elegí un tipo de plan.'); return; }
      if (!alumno || !alumno.id) { alert('No se pudo identificar al estudiante — recargá la página e intentá de nuevo.'); return; }

      var programaElegido = document.getElementById('in-programa').value;
      var descuentoPorcentaje = Number(document.getElementById('in-descuento').value || 0);
      var descuentoMonto = Math.round(Number(tipo.valor) * (descuentoPorcentaje / 100));
      var valorConDescuento = Number(tipo.valor) - descuentoMonto;
      var medioPagoInscripcion = pagado ? document.getElementById('in-medio-pago').value : '';

      btnInscribir.disabled = true;
      // buscarOCrearPlanId: si esta combinación Programa+Tipo de plan nunca se
      // usó, intenta crearla en Supabase — eso solo funciona si quien está
      // logueado es ADMINISTRADOR (regla real del backend). Si falla por
      // permisos, el catch de abajo lo explica en vez de fallar en silencio.
      buscarOCrearPlanId(programaElegido, tipo)
        .then(function (planId) {
          return apiFetch('/api/matricula/inscripciones', {
            method: 'POST',
            body: JSON.stringify({
              alumnoId: alumno.id, planId: planId, fechaInicio: fechaInicio,
              pagado: pagado, fecha: fechaPago, medioPago: pagado ? medioPagoInscripcion : undefined
            })
          });
        })
        .then(function () {
          return Promise.all([refrescarCacheAlumnos(), refrescarCachePlanes()]).then(refrescarCacheInscripciones);
        })
        .then(function () {
          // Conecta con Contabilidad (todavía local): todo pago registrado
          // acá aparece como Ingreso, sin tener que cargarlo dos veces.
          if (pagado) {
            var ingresosDesdeMatricula = cargarIngresos();
            ingresosDesdeMatricula.push({
              fecha: fechaPago,
              concepto: 'Matrícula — ' + alumno.nombres + ' ' + alumno.apellidos,
              programa: programaElegido,
              categoria: 'Matrícula',
              cliente: alumno.nombres + ' ' + alumno.apellidos,
              metodo: medioPagoInscripcion,
              estado: 'pagado',
              valor: valorConDescuento
            });
            guardarIngresos(ingresosDesdeMatricula);
          }
          document.getElementById('msj-inscripcion').textContent = pagado
            ? 'Inscripción creada y pago registrado — el estudiante ya quedó "Activo", y el cargo aparece saldado en Pagos y cartera (visible ahí cuando ese módulo también esté conectado).'
            : 'Inscripción creada — el estudiante queda "Pendiente de matrícula" y el cargo aparece pendiente hasta que se registre el pago.';
          document.getElementById('msj-inscripcion').style.display = 'block';
          setTimeout(function () { renderContenido('matricula'); }, 900);
        })
        .catch(function (err) {
          alert('No se pudo crear la inscripción: ' + err.message);
          btnInscribir.disabled = false;
        });
    });
  }
}

function renderPagos() {

function renderCartera(alumnos, cargos) {
  var cartera = {};
  cargos.forEach(function (c) {
    if (c.saldo > 0) cartera[c.alumnoIdx] = (cartera[c.alumnoIdx] || 0) + c.saldo;
  });
  var filasCartera = Object.keys(cartera).map(function (idx) {
    var a = alumnos[idx];
    var telefono = a ? (a.telefono || '').replace(/\D/g, '') : '';
    var msj = encodeURIComponent('Hola, te recordamos que ' + (a ? a.nombres : '') + ' tiene un saldo pendiente de $' + cartera[idx] + ' en Academia Musical Jacquin.');
    return '<tr><td style="font-weight:600;">' + (a ? a.nombres + ' ' + a.apellidos : '—') + '</td>' +
      '<td style="color:var(--rojo); font-weight:700;">$' + cartera[idx] + '</td>' +
      '<td>' + (telefono ? '<a href="https://wa.me/' + telefono + '?text=' + msj + '" target="_blank" rel="noopener" style="font-size:12px; background:#25D366; color:#fff; padding:5px 10px; border-radius:6px; text-decoration:none;">Recordar por WhatsApp</a>' : '<span style="font-size:11px; color:var(--muted); font-style:italic;">sin teléfono</span>') + '</td></tr>';
  }).join('');

  return '' +
    '<div class="panel" style="border:2px solid #fbe2dd; background:#fffaf9;"><h2 style="color:var(--rojo);">Cartera pendiente</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Quién debe, cuánto — la prioridad #1 que pidió Sergio.</p>' +
    (filasCartera ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Estudiante</th><th>Total pendiente</th><th></th></tr></thead><tbody>' + filasCartera + '</tbody></table></div>'
      : '<p style="font-size:13px; color:var(--verde);">Nadie tiene saldo pendiente.</p>') +
    '</div>';
}

    '<div class="campo"><label>Concepto</label><select id="cg-concepto">' +
