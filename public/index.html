    '<div class="grilla-2col">' +
    '<div class="campo"><label>Meta mensual (COP)</label><input id="meta-mensual-contab" type="number" min="0" value="' + (metas.mensual || '') + '" /></div>' +
    '<div class="campo"><label>Meta anual (COP)</label><input id="meta-anual-contab" type="number" min="0" value="' + (metas.anual || '') + '" /></div>' +
    '</div>' +
    '<button class="btn-primario" id="btn-guardar-metas-contab" style="max-width:200px;">Guardar metas</button>' +
    '</div>';
}

function panelResumenGeneral() {
  var ingresos = cargarIngresos(), gastos = cargarGastos(), compras = cargarCompras(), nomina = cargarNomina();
  var totalIngresos = ingresos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalGastos = gastos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalCompras = compras.reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
  var totalNomina = nomina.reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
  var egresosTotal = totalGastos + totalCompras + totalNomina;
  var balance = totalIngresos - egresosTotal;

  var pendientes = [].concat(
    gastos.filter(function (r) { return r.estado === 'pendiente'; }).map(function (r) { return Number(r.valor || 0); }),
    compras.filter(function (r) { return r.estado === 'pendiente'; }).map(function (r) { return Number(r.valorTotal || 0); }),
    nomina.filter(function (r) { return r.estado === 'pendiente'; }).map(function (r) { return Number(r.neto || 0); })
  );
  var totalPendiente = pendientes.reduce(function (a, b) { return a + b; }, 0);

  var catIngreso = ordenarCategorias(categoriasIngresoContable(ingresos)).slice(0, 6);
  var catEgreso = ordenarCategorias(categoriasEgresoContable(gastos, compras, totalNomina)).slice(0, 6);
  var maxIn = Math.max(1, catIngreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));
  var maxOut = Math.max(1, catEgreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));

  var movimientos = [].concat(
    ingresos.map(function (r) { return { fecha: r.fecha, modulo: 'Ingreso', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'in' }; }),
    gastos.map(function (r) { return { fecha: r.fecha, modulo: 'Gasto', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'out' }; }),
    compras.map(function (r) { return { fecha: r.fecha, modulo: 'Compra', concepto: r.articulo, estado: r.estado, valor: Number(r.valorTotal || 0), tipo: 'out' }; }),
    nomina.map(function (r) { return { fecha: r.mes, modulo: 'Nómina', concepto: r.empleado, estado: r.estado, valor: Number(r.neto || 0), tipo: 'out' }; })
  ).sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); }).slice(0, 8);

  var pctIngreso = (totalIngresos + egresosTotal) > 0 ? (totalIngresos / (totalIngresos + egresosTotal)) * 100 : 0;
  var indicadores = calcularIndicadoresContable(totalIngresos, egresosTotal, balance, ingresos.length, totalNomina, null);
  var efectivoBanco = efectivoYBancoContable(ingresos, gastos, compras, nomina);
  var tendencia = ultimosMesesContable(ingresos, gastos, compras, nomina, 6);
  var mesActualYm = new Date().toISOString().slice(0, 7);
  var ingresosMesActual = ingresos.filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === mesActualYm; }).reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);

  return '' +
    '<div class="kpi-grid-contab">' +
      tarjetaKPIModerna('Balance general', balance, balance >= 0 ? 'hero' : 'hero neg', '⚖️', 'Ingresos − egresos totales') +
      tarjetaKPIModerna('Total ingresos', totalIngresos, 'pos', '💰', ingresos.length + ' registro(s)') +
      tarjetaKPIModerna('Total gastos', totalGastos, 'neg', '📉', gastos.length + ' registro(s)') +
      tarjetaKPIModerna('Compras + nómina', totalCompras + totalNomina, 'warn', '🛒', 'Compras: ' + formatearCOPContable(totalCompras)) +
      tarjetaKPIModerna('Pendiente por pagar', totalPendiente, 'neu', '⏳', 'Gastos, compras y nómina') +
    '</div>' +
    '<div class="dash-grid-3" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px;">' +
      '<div class="chart-card-contab"><h3>Tendencia mensual</h3><p class="sub">Ingresos vs. egresos totales — últimos 6 meses</p>' +
      chartBarrasTendenciaContable(tendencia) +
      '<div class="legend-row-contab"><span class="li"><span class="sw" style="background:var(--verde);"></span>Ingresos</span><span class="li"><span class="sw" style="background:var(--azul-oscuro);"></span>Egresos</span></div>' +
      '</div>' +
      '<div class="chart-card-contab"><h3>Ingresos vs. egresos</h3><p class="sub">Participación histórica desde el inicio</p>' +
      donutProContab(pctIngreso) +
      '<div class="legend-row-contab">' +
        '<span class="li"><span class="sw" style="background:var(--verde);"></span>Ingresos · ' + formatearCOPContable(totalIngresos) + '</span>' +
        '<span class="li"><span class="sw" style="background:var(--linea);"></span>Egresos · ' + formatearCOPContable(egresosTotal) + '</span>' +
      '</div></div>' +
    '</div>' +
    '<div class="dash-grid-3" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px;">' +
      '<div class="chart-card-contab"><h3>Ingresos por categoría</h3><p class="sub">Top categorías con más movimiento</p>' +
      (catIngreso.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Sin datos aún.</p>' :
       catIngreso.map(function (e) { return barraCategoriaContable(e[0], e[1], maxIn, 'var(--verde)'); }).join('')) +
      '</div>' +
      '<div class="chart-card-contab"><h3>Egresos por categoría</h3><p class="sub">Gastos, compras y nómina</p>' +
      (catEgreso.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Sin datos aún.</p>' :
       catEgreso.map(function (e) { return barraCategoriaContable(e[0], e[1], maxOut, 'var(--rojo)'); }).join('')) +
      '</div>' +
    '</div>' +
    filaIndicadoresContable(indicadores) +
    filaEfectivoBancoContable(efectivoBanco, '(histórico)') +
    '<div class="dash-grid-3" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0;">' +
      tarjetaCarteraContable() +
      tarjetaMetasContable(ingresosMesActual, '(mes en curso)') +
    '</div>' +
    '<div class="panel"><h2>Últimos movimientos</h2>' + tablaMovimientosContable(movimientos) + '</div>' +
    '<p style="font-size:11px; color:var(--muted);">Resumen financiero visible solo para Administración — la Secretaría puede registrar movimientos pero no ve estos totales.</p>';
}

// ---- Balance mensual — se elige un mes y se recalcula todo para ese
// período (tomado como referencia de renderBalanceMensual() de Neuro Tone).
var mesBalanceContable = '';

function cambiarMesBalanceContable(valor) {
  mesBalanceContable = valor;
  renderContenido('contabilidad');
}

function panelBalanceMensual() {
  var selector =
    '<div class="panel"><h2>Balance mensual</h2>' +
    '<div class="campo" style="max-width:220px;"><label>Selecciona un mes</label>' +
    '<input type="month" id="bal-mes" value="' + mesBalanceContable + '" onchange="cambiarMesBalanceContable(this.value)" /></div>' +
    '</div>';

  if (!mesBalanceContable) {
    return selector + '<p style="font-size:13px; color:var(--muted);">Elegí un mes para ver el balance financiero completo de ese período.</p>';
  }

  var ym = mesBalanceContable;
  var ingresos = cargarIngresos().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; });
  var gastos = cargarGastos().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; });
  var compras = cargarCompras().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; });
  var nomina = cargarNomina().filter(function (r) { return r.mes === ym; });

  var totalIngresos = ingresos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalGastos = gastos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalCompras = compras.reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
  var totalNomina = nomina.reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
  var balanceMes = totalIngresos - totalGastos - totalCompras - totalNomina;

  var catIngreso = ordenarCategorias(categoriasIngresoContable(ingresos));
  var catEgreso = ordenarCategorias(categoriasEgresoContable(gastos, compras, totalNomina));
  var maxIn = Math.max(1, catIngreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));
  var maxOut = Math.max(1, catEgreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));

  var movimientos = [].concat(
    ingresos.map(function (r) { return { fecha: r.fecha, modulo: 'Ingreso', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'in' }; }),
    gastos.map(function (r) { return { fecha: r.fecha, modulo: 'Gasto', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'out' }; }),
    compras.map(function (r) { return { fecha: r.fecha, modulo: 'Compra', concepto: r.articulo, estado: r.estado, valor: Number(r.valorTotal || 0), tipo: 'out' }; }),
    nomina.map(function (r) { return { fecha: r.mes + '-01', modulo: 'Nómina', concepto: r.empleado, estado: r.estado, valor: Number(r.neto || 0), tipo: 'out' }; })
  ).sort(function (a, b) { return (a.fecha || '').localeCompare(b.fecha || ''); });

  var egresosMes = totalGastos + totalCompras + totalNomina;
  var pctIngresoMes = (totalIngresos + egresosMes) > 0 ? (totalIngresos / (totalIngresos + egresosMes)) * 100 : 0;

  // Mes anterior — solo para la "variación vs. mes anterior" del indicador.
  var partesYm = ym.split('-'); var ymAnteriorDate = new Date(Number(partesYm[0]), Number(partesYm[1]) - 2, 1);
  var ymAnterior = ymAnteriorDate.getFullYear() + '-' + String(ymAnteriorDate.getMonth() + 1).padStart(2, '0');
  var ingresosAnt = cargarIngresos().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ymAnterior; }).reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var gastosAnt = cargarGastos().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ymAnterior; }).reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var comprasAnt = cargarCompras().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ymAnterior; }).reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
  var nominaAnt = cargarNomina().filter(function (r) { return r.mes === ymAnterior; }).reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
  var balanceAnterior = ingresosAnt - (gastosAnt + comprasAnt + nominaAnt);

  var indicadores = calcularIndicadoresContable(totalIngresos, egresosMes, balanceMes, ingresos.length, totalNomina, balanceAnterior);
  var efectivoBanco = efectivoYBancoContable(ingresos, gastos, compras, nomina);
  var movimientosOrdenPorFecha = movimientos.filter(function (m) { return m.tipo === 'in'; });
  var movimientosEgresoPorFecha = movimientos.filter(function (m) { return m.tipo === 'out'; });

  return '' +
    selector +
    '<p style="font-size:12px; color:var(--muted); margin:-10px 0 16px;">Mostrando el balance financiero de ' + ym + '.</p>' +
    '<div class="kpi-grid-contab">' +
      tarjetaKPIModerna('Balance del mes', balanceMes, balanceMes >= 0 ? 'hero' : 'hero neg', '⚖️', ym) +
      tarjetaKPIModerna('Ingresos del mes', totalIngresos, 'pos', '💰', ingresos.length + ' registro(s)') +
      tarjetaKPIModerna('Gastos del mes', totalGastos, 'neg', '📉', gastos.length + ' registro(s)') +
      tarjetaKPIModerna('Compras del mes', totalCompras, 'warn', '🛒', compras.length + ' registro(s)') +
      tarjetaKPIModerna('Nómina del mes', totalNomina, 'neu', '👥', nomina.length + ' registro(s)') +
    '</div>' +
    filaEfectivoBancoContable(efectivoBanco, 'del mes seleccionado') +
    '<div class="dash-grid-3" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0;">' +
      '<div class="chart-card-contab"><h3>Ingresos — acumulado del mes</h3><p class="sub">Curva de acumulación diaria (día a día)</p>' +
      chartAreaAcumuladoContable(movimientosOrdenPorFecha, ym, 'var(--verde)') +
      '</div>' +
      '<div class="chart-card-contab"><h3>Egresos — acumulado del mes</h3><p class="sub">Curva de acumulación diaria (día a día)</p>' +
      chartAreaAcumuladoContable(movimientosEgresoPorFecha, ym, 'var(--azul-oscuro)') +
      '</div>' +
    '</div>' +
    filaIndicadoresContable(indicadores) +
    '<div class="dash-grid-3" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:18px;">' +
      '<div class="chart-card-contab"><h3>Ingresos vs. egresos</h3><p class="sub">Participación del mes</p>' +
      donutProContab(pctIngresoMes) +
      '<div class="legend-row-contab">' +
        '<span class="li"><span class="sw" style="background:var(--verde);"></span>Ingresos · ' + formatearCOPContable(totalIngresos) + '</span>' +
        '<span class="li"><span class="sw" style="background:var(--linea);"></span>Egresos · ' + formatearCOPContable(egresosMes) + '</span>' +
      '</div></div>' +
      '<div class="chart-card-contab"><h3>Ingresos por categoría</h3><p class="sub">' + ym + '</p>' +
      (catIngreso.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Sin ingresos este mes.</p>' :
       catIngreso.map(function (e) { return barraCategoriaContable(e[0], e[1], maxIn, 'var(--verde)'); }).join('')) +
      '</div>' +
      '<div class="chart-card-contab"><h3>Egresos por categoría</h3><p class="sub">' + ym + '</p>' +
      (catEgreso.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Sin egresos este mes.</p>' :
       catEgreso.map(function (e) { return barraCategoriaContable(e[0], e[1], maxOut, 'var(--rojo)'); }).join('')) +
      '</div>' +
    '</div>' +
    '<div class="panel"><h2>Movimientos de ' + ym + '</h2>' + tablaMovimientosContable(movimientos) + '</div>';
}

function renderContabilidad(sesion) {
  var esAdmin = sesion.rol === 'ADMINISTRADOR';
  // Decisión de negocio (2026-09-02): Secretaría solo registra Ingresos y
  // Compras — ni Gastos/Nómina ni el resumen financiero quedan a su
  // alcance (antes veía también Gastos y Nómina).
  var pestañas = esAdmin ? ['ingresos', 'gastos', 'compras', 'nomina', 'resumen', 'balance'] : ['ingresos', 'compras'];
  var etiquetaPestaña = { ingresos: 'Ingresos', gastos: 'Gastos', compras: 'Compras', nomina: 'Nómina', resumen: 'Resumen general', balance: 'Balance mensual' };
  if (pestañas.indexOf(tabContabilidadActiva) === -1) tabContabilidadActiva = 'ingresos';

  var botonesPestañas = pestañas.map(function (p) {
    var activa = p === tabContabilidadActiva;
    return '<button type="button" class="contab-tab' + (activa ? ' active' : '') + '" onclick="cambiarTabContabilidad(\'' + p + '\')">' +
      '<span class="dot"></span>' + etiquetaPestaña[p] + '</button>';
  }).join('');

  var contenido = '';
  if (tabContabilidadActiva === 'ingresos') contenido = panelIngresos(esAdmin);
  else if (tabContabilidadActiva === 'gastos' && esAdmin) contenido = panelGastos(esAdmin);
  else if (tabContabilidadActiva === 'compras') contenido = panelCompras(esAdmin);
  else if (tabContabilidadActiva === 'nomina' && esAdmin) contenido = panelNomina(esAdmin);
  else if (tabContabilidadActiva === 'resumen' && esAdmin) contenido = panelResumenGeneral();
  else if (tabContabilidadActiva === 'balance' && esAdmin) contenido = panelBalanceMensual();

  return '' +
    heroContabilidad() +
    (esAdmin ? '' : '<p style="font-size:12px; color:var(--muted); margin:0 0 16px;">Podés registrar ingresos y compras. El resto de Contabilidad (gastos, nómina y el resumen financiero) lo ve solo Administración.</p>') +
    '<div class="contab-tabs">' + botonesPestañas + '</div>' +
    contenido;
}

function activarLogicaContabilidad() {
  var REFRESCAR_CONTAB = { ingreso: refrescarCacheContabIngresos, gasto: refrescarCacheContabGastos, compra: refrescarCacheContabCompras, nomina: refrescarCacheContabNomina };
  var CARGAR_CONTAB = { ingreso: cargarIngresos, gasto: cargarGastos, compra: cargarCompras, nomina: cargarNomina };

// Descarga en CSV (compatible con Excel) — no depende de librerías nuevas.
function descargarCSV(nombreArchivo, columnas, filas) {
  var lineas = [columnas.join(',')].concat(filas.map(function (fila) {
    return columnas.map(function (_, i) {
      var val = fila[i] == null ? '' : String(fila[i]);
      return '"' + val.replace(/"/g, '""') + '"';
    }).join(',');
  }));
  var csv = '\ufeff' + lineas.join('\r\n'); // BOM para que Excel abra bien los acentos
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

  editar: 'Editó', eliminar: 'Eliminó', reactivar: 'Reactivó', cambiar_estado: 'Cambió estado',

async function refrescarCacheAuditoria() {
  try {
    var params = [];
    if (filtrosAuditoria.rol) params.push('rol=' + encodeURIComponent(filtrosAuditoria.rol));
    if (filtrosAuditoria.accion) params.push('accion=' + encodeURIComponent(filtrosAuditoria.accion));
    if (filtrosAuditoria.desde) params.push('desde=' + encodeURIComponent(filtrosAuditoria.desde));
    if (filtrosAuditoria.hasta) params.push('hasta=' + encodeURIComponent(filtrosAuditoria.hasta));
    var qs = params.length ? ('?' + params.join('&')) : '';
    CACHE_AUDITORIA = await apiFetch('/api/auditoria' + qs, { method: 'GET' }) || [];
  } catch (err) {
    console.error('No se pudo cargar Auditoría desde el backend:', err.message);
    CACHE_AUDITORIA = [];
  }
}

function filasTablaAuditoria() {
  if (CACHE_AUDITORIA.length === 0) return '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:16px;">Sin registros con estos filtros.</td></tr>';
  return CACHE_AUDITORIA.map(function (a) {
    var fecha = new Date(a.fecha_hora);
    var fechaTxt = isNaN(fecha.getTime()) ? a.fecha_hora : fecha.toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' });
    var accionTxt = ETIQUETA_ACCION_AUDITORIA[a.accion] || a.accion;
    var esExito = a.resultado === 'exito';
    return '<tr><td style="white-space:nowrap;">' + fechaTxt + '</td>' +
      '<td>' + (a.usuario_nombre || '—') + (a.usuario_email ? '<br><span style="color:var(--muted); font-size:11px;">' + a.usuario_email + '</span>' : '') + '</td>' +
      '<td>' + (a.usuario_rol || '—') + '</td>' +
      '<td>' + accionTxt + '</td>' +
      '<td>' + a.modulo + '</td>' +
      '<td><span style="color:' + (esExito ? 'var(--verde)' : 'var(--rojo)') + '; font-weight:600;">' + (esExito ? 'Éxito' : 'Error') + '</span></td>' +
      '</tr>';
  }).join('');
}

      if ((location.hash.replace('#', '') || 'dashboard') === 'auditoria') renderContenido('auditoria');

  var btnFiltrar = document.getElementById('btn-filtrar-auditoria');
  if (btnFiltrar) {
    btnFiltrar.addEventListener('click', function () {
      filtrosAuditoria.rol = document.getElementById('aud-filtro-rol').value;
      filtrosAuditoria.accion = document.getElementById('aud-filtro-accion').value;
      filtrosAuditoria.desde = document.getElementById('aud-filtro-desde').value;

function renderReportes() {

function activarLogicaReportes() {
  var porModulo = {};
  REPORTES_DISPONIBLES.forEach(function (r) { (porModulo[r.modulo] = porModulo[r.modulo] || []).push(r); });
  var modulos = Object.keys(porModulo);

function cargarMensajes() {
  var g = localStorage.getItem('jacquin_demo_mensajes');
  return g ? JSON.parse(g) : [];
}
function guardarMensajes(lista) { localStorage.setItem('jacquin_demo_mensajes', JSON.stringify(lista)); }

var tabComunicacionActiva = 'bandeja';
function cambiarTabComunicacion(tab) {
  tabComunicacionActiva = tab;
  renderContenido('comunicacion');
}
var filtroBandejaComunicacion = '';
var destinatariosSeleccionadosComunicacion = [];

function mensajesRecibidos(sesion) {
  if (!sesion) return [];
  return cargarMensajes().filter(function (m) {
    return m.de !== sesion.email && (m.paraTodos || (m.para || []).indexOf(sesion.email) !== -1);
  });
}
function mensajesEnviados(sesion) {
  if (!sesion) return [];
  return cargarMensajes().filter(function (m) { return m.de === sesion.email; });
}
function mensajesNoLeidos(sesion) {
  return mensajesRecibidos(sesion).filter(function (m) { return (m.leidoPor || []).indexOf(sesion.email) === -1; });
}

function renderComunicacion(sesion) {
  var pestañas = ['bandeja', 'enviados', 'redactar'];
  var etiquetas = { bandeja: 'Bandeja de entrada', enviados: 'Enviados', redactar: 'Redactar' };
  var noLeidos = mensajesNoLeidos(sesion).length;

  var botonesPestañas = pestañas.map(function (p) {
    var activa = p === tabComunicacionActiva;
    var badge = (p === 'bandeja' && noLeidos > 0) ? ' <span style="background:var(--naranja); color:#fff; border-radius:10px; padding:1px 7px; font-size:10.5px; margin-left:4px;">' + noLeidos + '</span>' : '';
    return '<button type="button" onclick="cambiarTabComunicacion(\'' + p + '\')" style="' +
      'padding:8px 16px; border-radius:8px; border:1px solid ' + (activa ? 'var(--azul-oscuro)' : '#e2e5ea') + ';' +
      'background:' + (activa ? 'var(--azul-oscuro)' : '#fff') + '; color:' + (activa ? '#fff' : 'var(--texto)') + ';' +
      'font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-ui);">' + etiquetas[p] + badge + '</button>';
  }).join('');

  var contenido = '';
  if (tabComunicacionActiva === 'bandeja') contenido = panelBandejaComunicacion(sesion);
  else if (tabComunicacionActiva === 'enviados') contenido = panelEnviadosComunicacion(sesion);
  else if (tabComunicacionActiva === 'redactar') contenido = panelRedactarComunicacion(sesion);

  return '' +
    '<h1 style="font-family:var(--font-wordmark); font-weight:500; font-size:22px; margin:4px 0 6px;">Comunicación interna</h1>' +
    '<p style="font-size:12px; color:var(--muted); margin:0 0 16px;">Canal interno de mensajes entre Administración, Dirección, Secretaría y Profesores.</p>' +
    '<div style="display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;">' + botonesPestañas + '</div>' +
    contenido;
}

function panelBandejaComunicacion(sesion) {
  var usuarios = cargarUsuarios();
  function nombrePorEmail(email) {
    var u = usuarios.find(function (x) { return x.email === email; });
    return u ? u.nombre : email;
  }
  var mensajes = mensajesRecibidos(sesion).slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
  if (filtroBandejaComunicacion) {
    var termino = filtroBandejaComunicacion.toLowerCase();
    mensajes = mensajes.filter(function (m) {
      return (m.asunto || '').toLowerCase().indexOf(termino) !== -1 || nombrePorEmail(m.de).toLowerCase().indexOf(termino) !== -1;
    });
  }
  var filas = mensajes.map(function (m) {
    var leido = (m.leidoPor || []).indexOf(sesion.email) !== -1;
    var urgente = m.prioridad === 'urgente';
    return '<div class="mensaje-item" data-id="' + m.id + '" style="border:1px solid ' + (urgente ? 'var(--rojo)' : '#e2e5ea') + '; border-left:4px solid ' + (urgente ? 'var(--rojo)' : (leido ? '#ddd' : 'var(--azul-oscuro)')) + '; border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; background:' + (leido ? '#fff' : '#f2f6fc') + ';">' +
      '<div style="display:flex; justify-content:space-between; gap:10px; align-items:center;">' +
      '<div style="font-weight:' + (leido ? '600' : '700') + '; font-size:13px;">' + nombrePorEmail(m.de) + (m.paraTodos ? ' <span style="font-size:10.5px; color:var(--muted); font-weight:400;">(a todo el personal)</span>' : '') + '</div>' +
      '<div style="font-size:11px; color:var(--muted); white-space:nowrap;">' + m.fecha + '</div>' +
      '</div>' +
      '<div style="font-size:13px; margin-top:3px;">' + (urgente ? '<span style="color:var(--rojo); font-weight:700;">URGENTE — </span>' : '') + m.asunto + '</div>' +
      '<div class="mensaje-cuerpo" style="display:none; font-size:12.5px; color:var(--texto); margin-top:8px; white-space:pre-wrap; border-top:1px solid #eee; padding-top:8px;">' + m.cuerpo +
      '<div style="margin-top:8px;"><button class="btn-responder-mensaje" data-de="' + m.de + '" data-asunto="' + String(m.asunto).replace(/"/g, '&quot;') + '" style="font-size:11.5px; padding:4px 10px; border-radius:6px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer;">Responder</button></div>' +
      '</div>' +
      '</div>';
  }).join('');

  return '<div class="panel">' +
    '<input id="buscar-mensajes" type="text" placeholder="Buscar por remitente o asunto..." value="' + filtroBandejaComunicacion + '" style="margin-bottom:14px;" />' +
    (mensajes.length ? filas : '<p style="font-size:13px; color:var(--muted);">No hay mensajes en tu bandeja.</p>') +
    '</div>';
}

function panelEnviadosComunicacion(sesion) {
  var usuarios = cargarUsuarios();
  function nombrePorEmail(email) {
    var u = usuarios.find(function (x) { return x.email === email; });
    return u ? u.nombre : email;
  }
  var mensajes = mensajesEnviados(sesion).slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
  var filas = mensajes.map(function (m) {
    var destinatarios = m.paraTodos ? 'Todo el personal' : (m.para || []).map(nombrePorEmail).join(', ');
    var vistoPor = (m.leidoPor || []).length;
    var totalDestinatarios = m.paraTodos ? (usuarios.length - 1) : (m.para || []).length;
    return '<tr><td>' + m.asunto + '</td><td>' + destinatarios + '</td><td>' + m.fecha + '</td>' +
      '<td>' + (m.prioridad === 'urgente' ? '<span style="color:var(--rojo); font-weight:600;">Urgente</span>' : 'Normal') + '</td>' +
      '<td>' + vistoPor + ' de ' + totalDestinatarios + '</td></tr>';
  }).join('');
  return '<div class="panel"><h2>Mensajes enviados (' + mensajes.length + ')</h2>' +
    (mensajes.length ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Asunto</th><th>Para</th><th>Fecha</th><th>Prioridad</th><th>Leído por</th></tr></thead><tbody>' + filas + '</tbody></table></div>'
      : '<p style="font-size:13px; color:var(--muted);">Todavía no enviaste mensajes.</p>') +
    '</div>';
}

function panelRedactarComunicacion(sesion) {
  var usuarios = cargarUsuarios().filter(function (u) { return u.email !== sesion.email; });

  var listaDestinatarios = usuarios.map(function (u) {

    return '<label style="display:flex; align-items:center; gap:6px; font-size:12.5px; padding:4px 0;">' +

      u.nombre + ' <span style="color:var(--muted);">(' + (ETIQUETA_ROL_MENSAJE[u.rol] || u.rol) + ')</span>' +
      '</label>';
  }).join('');

  return '<div class="panel"><h2>Redactar mensaje</h2>' +
    '<div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">' +
    '<button type="button" id="btn-seleccionar-docentes" style="font-size:12px; padding:6px 12px; border-radius:16px; border:1.5px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer;">Seleccionar todos los docentes</button>' +
    '<button type="button" id="btn-seleccionar-personal" style="font-size:12px; padding:6px 12px; border-radius:16px; border:1.5px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer;">Seleccionar todo el personal</button>' +
    '<button type="button" id="btn-limpiar-destinatarios" style="font-size:12px; padding:6px 12px; border-radius:16px; border:1px solid #ddd; background:#fff; color:var(--muted); cursor:pointer;">Limpiar selección</button>' +
    '</div>' +
    '<div style="max-height:180px; overflow-y:auto; border:1px solid #e2e5ea; border-radius:8px; padding:8px 12px; margin-bottom:12px;" id="lista-destinatarios-mensaje">' +
    (usuarios.length ? listaDestinatarios : '<p style="font-size:12px; color:var(--muted);">No hay otros usuarios registrados todavía.</p>') +
    '</div>' +
    '<div class="campo"><label>Asunto</label><input id="msg-asunto" type="text" /></div>' +
    '<div class="campo"><label>Mensaje</label><textarea id="msg-cuerpo" rows="5" style="width:100%; border:1px solid #dde1e7; border-radius:8px; padding:10px 14px; font-size:14px; font-family:var(--font-ui);"></textarea></div>' +
    '<div class="campo" style="max-width:220px;"><label>Prioridad</label><select id="msg-prioridad"><option value="normal">Normal</option><option value="urgente">Urgente</option></select></div>' +
    '<button class="btn-primario" id="btn-enviar-mensaje" style="max-width:220px;">Enviar mensaje</button>' +
    '<p id="msj-mensaje-enviado" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Mensaje enviado.</p>' +
    '</div>';
}

      var marcados = Array.prototype.map.call(document.querySelectorAll('.chk-destinatario-mensaje:checked'), function (c) { return c.value; });

      if (!asunto || !cuerpo) { alert('Asunto y mensaje son obligatorios.'); return; }
      if (marcados.length === 0) { alert('Elegí al menos un destinatario.'); return; }

      var totalOtros = cargarUsuarios().filter(function (u) { return u.email !== sesion.email; }).length;
      var paraTodos = marcados.length === totalOtros && totalOtros > 0;

      var mensajes = cargarMensajes();
      mensajes.push({
        id: Date.now(),
        de: sesion.email,
        para: marcados,
        paraTodos: paraTodos,
        asunto: asunto,
        cuerpo: cuerpo,
        prioridad: prioridad,
        fecha: new Date().toISOString().slice(0, 16).replace('T', ' '),
        leidoPor: []
      });
      guardarMensajes(mensajes);

      destinatariosSeleccionadosComunicacion = [];
      document.getElementById('msj-mensaje-enviado').style.display = 'block';
      tabComunicacionActiva = 'enviados';
      setTimeout(function () { renderContenido('comunicacion'); }, 600);
    });
  }
}

    '<p style="font-size:12px; color:var(--naranja); margin-top:-6px;">Los permisos de Profesor están fijados manualmente mientras se corrige el guardado — no se pueden editar desde acá por ahora.</p>' +

    '<button class="btn-primario" id="btn-guardar-permisos" style="max-width:220px; margin-top:14px;"' + (cargandoPermisos ? ' disabled' : '') + '>Guardar permisos</button>' +
    '<button id="btn-restablecer-permisos" style="max-width:260px; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; display:block;"' + (cargandoPermisos ? ' disabled' : '') + '>Restablecer valores por defecto</button>' +
    '<p id="msj-permisos-guardados" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Permisos actualizados.</p>' +

    (usuarios.length ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead><tbody>' +
      usuarios.map(function (u) { return '<tr><td>' + u.nombre + '</td><td>' + u.email + '</td><td><span class="chip-rol">' + (ETIQUETA_ROL_MENSAJE[u.rol] || u.rol) + '</span></td></tr>'; }).join('') +

// Guarda, rol por rol, la lista completa de módulos marcados contra el
// backend real (PUT /api/permisos/modulo-rol/:rolId, reemplaza todo lo que
// tenía ese rol). Administración se salta siempre: sus checkboxes están
// deshabilitados y el backend igual la trata como acceso total.
function guardarModulosDeRol(rol, modulos) {
  var rolReal = CACHE_ROLES.find(function (r) { return r.nombre === rol; });
  if (!rolReal) return Promise.reject(new Error('No se encontró el rol "' + rol + '" en el sistema.'));
  return apiFetch('/api/permisos/modulo-rol/' + rolReal.id, {
    method: 'PUT',
    body: JSON.stringify({ modulos: modulos })
  });
}

function activarLogicaUsuariosPermisos() {
  var btnGuardar = document.getElementById('btn-guardar-permisos');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var msjError = document.getElementById('msj-permisos-error');
      msjError.style.display = 'none';
      var rolesAGuardar = ROLES_SISTEMA.filter(function (rol) { return rol !== 'ADMINISTRADOR'; });
      var cambios = {};
      rolesAGuardar.forEach(function (rol) {
        cambios[rol] = Array.prototype.map.call(
          document.querySelectorAll('.chk-permiso[data-rol="' + rol + '"]:checked'),
          function (c) { return c.getAttribute('data-modulo'); }
        );
      });

      btnGuardar.disabled = true;
      Promise.all(rolesAGuardar.map(function (rol) { return guardarModulosDeRol(rol, cambios[rol]); }))
        .then(function () { return refrescarCachePermisos(); })
        .then(function () {
          renderNavModulos(location.hash.replace('#', '') || 'dashboard');
          renderContenido('usuarios-permisos');
          setTimeout(function () {
            var msj = document.getElementById('msj-permisos-guardados');
            if (msj) msj.style.display = 'block';
          }, 50);
        })
        .catch(function (err) {
          btnGuardar.disabled = false;
          msjError.textContent = 'No se pudieron guardar los permisos: ' + (err.message || 'error de conexión.');
          msjError.style.display = 'block';
        });
    });
  }
  var btnRestablecer = document.getElementById('btn-restablecer-permisos');
  if (btnRestablecer) {
    btnRestablecer.addEventListener('click', function () {
      if (!confirm('¿Restablecer los permisos de todos los roles a los valores originales del sistema?')) return;
      var msjError = document.getElementById('msj-permisos-error');
      msjError.style.display = 'none';
      var rolesAGuardar = ROLES_SISTEMA.filter(function (rol) { return rol !== 'ADMINISTRADOR'; });
      btnRestablecer.disabled = true;
      Promise.all(rolesAGuardar.map(function (rol) { return guardarModulosDeRol(rol, VISIBILIDAD_ROL[rol] || []); }))
        .then(function () { return refrescarCachePermisos(); })
        .then(function () {
          renderNavModulos(location.hash.replace('#', '') || 'dashboard');
          renderContenido('usuarios-permisos');
        })
        .catch(function (err) {
          btnRestablecer.disabled = false;
          msjError.textContent = 'No se pudo restablecer: ' + (err.message || 'error de conexión.');
          msjError.style.display = 'block';
        });
    });
  }
}

function activarLogicaAdmin() {
  var pass = document.getElementById('admin-pass');
  var btn = document.getElementById('btn-crear-usuario');

  function validarPassword() {
    var val = pass.value;
    var todasOk = true;
    POLITICA_PASSWORD.forEach(function (r) {
      var el = document.getElementById('regla-' + r.id);
      var ok = r.test(val);
      el.className = 'regla' + (ok ? ' ok' : '');
      if (!ok) todasOk = false;
    });
    btn.disabled = !todasOk;
  }

  // 'input' cubre tipeo normal; 'change'/'blur' cubren autocompletado o
  // contraseñas sugeridas por el navegador, que a veces no disparan 'input'.
  ['input', 'change', 'blur', 'keyup', 'paste'].forEach(function (evento) {
    pass.addEventListener(evento, validarPassword);
  });
  // Por si el campo ya viene con un valor al cargar la pantalla (autocompletado del navegador).
  setTimeout(validarPassword, 150);

  btn.addEventListener('click', function () {
    var nombre = document.getElementById('admin-nombre').value.trim();
    var email = document.getElementById('admin-email').value.trim();
    var rol = document.getElementById('admin-rol').value;
    var password = pass.value;
    if (!nombre || !email) return;
    var nacimiento = document.getElementById('admin-nacimiento').value;
    var rolReal = CACHE_ROLES.find(function (r) { return r.nombre === rol; });
    if (!rolReal) { alert('No se encontró el rol "' + rol + '" en el sistema — no se puede crear el usuario.'); return; }

    btn.disabled = true;
    var correoEnviadoOkAdmin = false;
    apiFetch('/api/identidad/usuarios', {
      method: 'POST',
      body: JSON.stringify({ nombre: nombre, email: email, password: password, rolId: rolReal.id })
    })
      .then(function (usuarioCreado) {
        correoEnviadoOkAdmin = !!usuarioCreado.correoEnviado;
        // El comentario/mirror en localStorage sigue existiendo porque otras
        // pantallas (Comunicación, etc.) todavía lo usan para armar sus
        // propias listas — se mantiene en paralelo a la lista real de abajo.
        var usuarios = cargarUsuarios();
        usuarios.push({ nombre: nombre, email: email, rol: rol, nacimiento: nacimiento });
        guardarUsuarios(usuarios);
        // Refresca la lista REAL de "Usuarios" de acá abajo (ya no depende
        // solo del espejo local) y, si es profesor, además la lista real
        // que usan Horarios/Eventos, para que aparezca ahí sin tener que ir
        // a "Profesores".
        return Promise.all([refrescarCacheUsuarios(), rol === 'PROFESOR' ? refrescarCacheProfesores() : Promise.resolve()]);
      })
      .then(function () {
        document.getElementById('msj-creado').textContent = correoEnviadoOkAdmin
          ? 'Usuario creado en el sistema real — le mandamos un correo con su contraseña temporal y el link para entrar.'
          : 'Usuario creado, pero no se pudo mandar el correo automático — pasale vos la contraseña temporal por otro medio.';
        document.getElementById('msj-creado').style.display = 'block';
        setTimeout(function () { renderContenido('admin'); }, 600);
      })
      .catch(function (err) {
        alert('No se pudo crear el usuario: ' + err.message);
        btn.disabled = false;
      });
  });

  document.querySelectorAll('.btn-editar-usuario').forEach(function (btnEditar) {
    btnEditar.addEventListener('click', function () {
      var id = btnEditar.getAttribute('data-id');
      var u = CACHE_USUARIOS.find(function (x) { return String(x.id) === String(id); });
      if (!u) return;
      var modal = document.getElementById('modal-editar-usuario');
      modal.setAttribute('data-id', id);
      document.getElementById('eu-nombre').value = u.nombre || '';
      document.getElementById('eu-email').value = u.email || '';
      document.getElementById('eu-rol').value = u.rol || 'PROFESOR';
      document.getElementById('msj-editar-usuario-error').style.display = 'none';
      modal.style.display = 'flex';
    });
  });

  var modalEditarUsuario = document.getElementById('modal-editar-usuario');
  var btnCancelarEditarUsuario = document.getElementById('btn-cancelar-editar-usuario');
  if (btnCancelarEditarUsuario) btnCancelarEditarUsuario.addEventListener('click', function () { modalEditarUsuario.style.display = 'none'; });

  var btnGuardarEditarUsuario = document.getElementById('btn-guardar-editar-usuario');
  if (btnGuardarEditarUsuario) {
    btnGuardarEditarUsuario.addEventListener('click', function () {
      var id = modalEditarUsuario.getAttribute('data-id');
      var nombre = document.getElementById('eu-nombre').value.trim();
      var email = document.getElementById('eu-email').value.trim();
      var rol = document.getElementById('eu-rol').value;
      var msjError = document.getElementById('msj-editar-usuario-error');
      msjError.style.display = 'none';
      if (!nombre || !email) { msjError.textContent = 'Nombre y email son obligatorios.'; msjError.style.display = 'block'; return; }
      var rolReal = CACHE_ROLES.find(function (r) { return r.nombre === rol; });
      if (!rolReal) { msjError.textContent = 'No se encontró el rol "' + rol + '".'; msjError.style.display = 'block'; return; }

      btnGuardarEditarUsuario.disabled = true;
      apiFetch('/api/identidad/usuarios/' + id, {
        method: 'PUT',
        body: JSON.stringify({ nombre: nombre, email: email, rolId: rolReal.id })
      })
        .then(function () { return Promise.all([refrescarCacheUsuarios(), refrescarCacheProfesores()]); })
        .then(function () {
          btnGuardarEditarUsuario.disabled = false;
          modalEditarUsuario.style.display = 'none';
          renderContenido('admin');
        })
        .catch(function (err) {
          btnGuardarEditarUsuario.disabled = false;
          msjError.textContent = 'No se pudo guardar: ' + (err.message || 'error de conexión.');
          msjError.style.display = 'block';
        });
    });
  }

  document.querySelectorAll('.btn-eliminar-usuario').forEach(function (btnEliminar) {
    btnEliminar.addEventListener('click', function () {
      var id = btnEliminar.getAttribute('data-id');
      if (!confirm('¿Eliminar este usuario? Ya no va a poder iniciar sesión. Esta acción no se puede deshacer.')) return;
      btnEliminar.disabled = true;
      apiFetch('/api/identidad/usuarios/' + id, { method: 'DELETE' })
        .then(function () { return Promise.all([refrescarCacheUsuarios(), refrescarCacheProfesores()]); })
        .then(function () { renderContenido('admin'); })
        .catch(function (err) {
          btnEliminar.disabled = false;
          alert('No se pudo eliminar: ' + (err.message || 'error de conexión.'));
        });
    });
  });

  function pintarPrevia() {
    var rol = document.getElementById('previa-rol').value;
    var visibles = modulosVisibles(rol);
    var html = MODULOS.filter(function (m) { return visibles.indexOf(m.key) !== -1; })
      .map(function (m) { return '<div>· ' + m.label + '</div>'; }).join('');
    document.getElementById('lista-previa').innerHTML = html;
  }
  document.getElementById('previa-rol').addEventListener('change', pintarPrevia);
  pintarPrevia();
}

function renderContenido(clave) {
  var sesion = sesionActual();
  var visibles = modulosVisibles(sesion.rol);
  if (visibles.indexOf(clave) === -1) clave = 'dashboard';
  var mod = MODULOS.find(function (m) { return m.key === clave; }) || MODULOS[0];

  // Ancho completo en todos los módulos salvo Inicio — Horarios también lo usa
  // para que la grilla semanal sea más fácil de ver y registrar.
  document.getElementById('contenido').classList.toggle('ancho-completo', mod.key !== 'dashboard');
  // El Dashboard usa su propio modo "bleed": sin padding/max-width en #contenido
  // para que la foto del hero llegue de borde a borde, pegada al menú de módulos.
  document.getElementById('contenido').classList.toggle('dashboard-bleed', mod.key === 'dashboard');

  if (mod.key === 'dashboard') {
    document.getElementById('contenido').innerHTML = renderDashboard(sesion);
    activarLogicaDashboard();
  } else if (mod.key === 'admin') {
    document.getElementById('contenido').innerHTML = renderAdmin();
    activarLogicaAdmin();
  } else if (mod.key === 'estudiantes') {
    document.getElementById('contenido').innerHTML = renderEstudiantes();
    activarLogicaEstudiantes();
    if (sesion.rol === 'PROFESOR') {
      document.getElementById('contenido').insertAdjacentHTML('afterbegin',
        '<p style="font-size:12px; color:var(--muted); margin-bottom:14px;">Vista acotada a tus estudiantes asignados (el filtrado real depende de datos que todavía no existen).</p>');
    }
  } else if (mod.key === 'matricula') {
    document.getElementById('contenido').innerHTML = renderMatricula(sesion);
    activarLogicaMatricula();
  } else if (mod.key === 'pagos') {
    document.getElementById('contenido').innerHTML = renderPagos();
    activarLogicaPagos();
  } else if (mod.key === 'horarios') {
    document.getElementById('contenido').innerHTML = renderHorarios(sesion);
    activarLogicaHorarios();
  } else if (mod.key === 'asistencia') {
    document.getElementById('contenido').innerHTML = renderAsistencia(sesion);
    activarLogicaAsistencia();
  } else if (mod.key === 'profesores') {
    document.getElementById('contenido').innerHTML = renderProfesores(sesion);
    activarLogicaProfesores();
  } else if (mod.key === 'cursos') {
    document.getElementById('contenido').innerHTML = renderCursos();
    activarLogicaCursos();
  } else if (mod.key === 'evaluacion') {
    document.getElementById('contenido').innerHTML = renderEvaluacion(sesion);
    activarLogicaEvaluacion();
  } else if (mod.key === 'eventos') {
    document.getElementById('contenido').innerHTML = renderEventos(sesion);
    activarLogicaEventos();
  } else if (mod.key === 'pensum') {
    document.getElementById('contenido').innerHTML = renderPensum(sesion);
    activarLogicaPensum();
  } else if (mod.key === 'contabilidad') {
    document.getElementById('contenido').innerHTML = renderContabilidad(sesion);
    activarLogicaContabilidad();
  } else if (mod.key === 'inventario') {
    document.getElementById('contenido').innerHTML = renderInventario();
    activarLogicaInventario();
  } else if (mod.key === 'reportes') {
    document.getElementById('contenido').innerHTML = renderReportes();
    activarLogicaReportes();
  } else if (mod.key === 'auditoria') {
    document.getElementById('contenido').innerHTML = renderAuditoria();
    activarLogicaAuditoria();
  } else if (mod.key === 'comunicacion') {
    document.getElementById('contenido').innerHTML = renderComunicacion(sesion);
    activarLogicaComunicacion();
  } else if (mod.key === 'usuarios-permisos') {
    document.getElementById('contenido').innerHTML = renderUsuariosPermisos();
    activarLogicaUsuariosPermisos();
  } else {
    var nota = '';
    if (mod.key === 'estudiantes' && sesion.rol === 'PROFESOR') nota = '<p style="margin-top:8px;">Acotado a los alumnos de tu salón (el filtrado real depende de datos que todavía no existen).</p>';
    document.getElementById('contenido').innerHTML = '<div class="placeholder"><h1>' + mod.label + '</h1><p>Pantalla en construcción — sin datos todavía.</p>' + nota + '</div>';
  }
}

function navegar() {
  var clave = location.hash.replace('#', '') || 'dashboard';
  renderNavModulos(clave);
  // Primer render con lo que ya haya en caché, para que la pantalla no
  // quede en blanco mientras se espera al backend.
  renderContenido(clave);
  // Estudiantes y Matrícula ya viven en el backend real (Supabase) — se
  // traen frescos en cada navegación para que no dependa de qué
  // computador/navegador se use. Los demás módulos se van sumando acá a
  // medida que se conectan. Inscripciones depende de que Alumnos y Planes
  // ya estén frescos (arma su caché combinando ambos), por eso va al final.
  refrescarCacheAlumnos()
    .then(function () {
      // Estudiantes ya tiene con esto todo lo que necesita — se repinta
      // acá mismo en vez de esperar a Cargos/Asistencia/etc, que dependen
      // de un pedido por estudiante y tardan más (ver mapearEnParalelo).
      if ((location.hash.replace('#', '') || 'dashboard') === clave) renderContenido(clave);
      return refrescarCachePlanes();
    })
    .then(function () { return refrescarCacheInscripciones(); })
    .then(function () { return refrescarCacheConceptos(); })
    .then(function () { return refrescarCacheCargos(); })
    .then(function () { return refrescarCacheRoles(); })
    .then(function () { return refrescarCacheUsuarios(); })
    .then(function () {
      // Los permisos por rol pueden cambiar qué módulos ve el usuario
      // logueado (ej. un Profesor) — por eso se repinta el nav apenas
      // llegan, no solo el contenido.
      return refrescarCachePermisos().then(function () {
        renderNavModulos(clave);
        if ((location.hash.replace('#', '') || 'dashboard') === clave) renderContenido(clave);
      });
    })
    .then(function () { return refrescarCacheSalas(); })
    .then(function () {
      return refrescarCacheProfesores().then(function () {
        // Con CACHE_PROFESORES ya fresco, se puede resolver a email el
        // alumno.profesor de cada estudiante (ver nota en
        // resolverProfesorDeAlumnos) y repintar si un Profesor está
        // mirando una pantalla que dependía de ese dato.
        resolverProfesorDeAlumnos();
        if ((location.hash.replace('#', '') || 'dashboard') === clave) renderContenido(clave);
      });
    })
    .then(function () { return refrescarCacheClases(); })
    .then(function () { return refrescarCacheAsistencias(); })
    .then(function () { return refrescarCacheEvaluacionesMensuales(); })
    .then(function () { return refrescarCacheEventos(); })
    .then(function () { return refrescarCachePensum(); })
    .then(function () { return refrescarCacheContabIngresos(); })
    .then(function () { return refrescarCacheContabGastos(); })
    .then(function () { return refrescarCacheContabCompras(); })
    .then(function () { return refrescarCacheContabNomina(); })
    .then(function () {
      // Si el usuario ya cambió de pantalla mientras se esperaba la
      // respuesta, no pisar lo que se está viendo ahora.
      if ((location.hash.replace('#', '') || 'dashboard') === clave) {
        renderContenido(clave);
      }
    })
    .catch(function (err) {
      // Red de seguridad: si algo de esta cadena llegara a fallar sin
      // atraparse adentro, que quede en consola en vez de dejar la
      // pantalla pegada esperando para siempre un repintado que no llega.
      console.error('Error refrescando datos del backend:', err);
    });
}

function mostrarApp() {
  var sesion = sesionActual();
  document.getElementById('vista-login').style.display = 'none';
  document.getElementById('vista-cambiar-password').style.display = 'none';
  document.getElementById('vista-app').style.display = 'block';
  document.getElementById('quien-soy').textContent = sesion.email + ' · ' + sesion.rol;
  if (!location.hash) location.hash = '#dashboard';
  navegar();
}

function mostrarLogin() {
  document.getElementById('vista-app').style.display = 'none';
  document.getElementById('vista-cambiar-password').style.display = 'none';
  document.getElementById('vista-login').style.display = 'flex';
  document.getElementById('in-email').value = '';
  document.getElementById('in-pass').value = '';
}

// ---- Conexión a la API real (backend en Vercel + Supabase) ----
// Si el HTML se abre como archivo local (file://), apunta al sitio
// publicado. Si el HTML se sirve DESDE ese mismo sitio, usa rutas
// relativas — así funciona sin importar el dominio.
var API_BASE = (location.protocol === 'file:') ? 'https://jacquin-sistema.vercel.app' : '';

async function apiFetch(ruta, opciones) {
  var headers = Object.assign({ 'Content-Type': 'application/json' }, (opciones && opciones.headers) || {});
  var sesion = sesionActual();
  if (sesion && sesion.token) headers['Authorization'] = 'Bearer ' + sesion.token;
  // cache: 'no-store' — sin esto, el navegador puede devolver un 304 con una
  // respuesta vieja cacheada (ej. de la primera vez que se pidió, antes de
  // que hubiera clases/estudiantes reales asignados) y quedarse sirviéndola
  // para siempre, sin importar qué cambie después en la base de datos real.
  // Esto explica por qué distintos navegadores/computadores podían mostrar
  // "fotos" distintas y desactualizadas de los mismos datos.
  var respuesta = await fetch(API_BASE + ruta, Object.assign({}, opciones, { headers: headers, cache: 'no-store' }));
  var cuerpo = await respuesta.json().catch(function () { return null; });
  if (!respuesta.ok) {
    var mensaje = (cuerpo && cuerpo.error && cuerpo.error.mensaje) || ('Error de conexión (' + respuesta.status + ')');
    throw new Error(mensaje);
  }
  return cuerpo ? cuerpo.data : null;
}

document.getElementById('form-login').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('in-email').value.trim();
  var pass = document.getElementById('in-pass').value;
  var msjError = document.getElementById('msj-error');
  msjError.style.display = 'none';

  // Identidad ya está conectada al backend real — el resto de los
  // módulos por ahora sigue funcionando con datos locales, se van
  // conectando uno por uno.
  apiFetch('/api/identidad/login', { method: 'POST', body: JSON.stringify({ email: email, password: pass }) })
    .then(function (data) {
      sessionStorage.setItem('jacquin_demo_sesion', JSON.stringify({
        email: data.usuario.email, nombre: data.usuario.nombre, rol: data.usuario.rol, token: data.token, usuarioId: data.usuario.id
      }));
      if (data.usuario.debeCambiarPassword) {
        mostrarCambiarPassword(pass);
      } else {
        mostrarApp();
      }
    })
    .catch(function (err) {
      msjError.textContent = err.message || 'Email o contraseña incorrectos.';
      msjError.style.display = 'block';
    });
});

// La contraseña con la que acaba de entrar (temporal) se guarda solo en
// memoria de esta pestaña — hace falta para el PUT de cambio de
// contraseña (el backend valida la actual antes de aceptar la nueva),
// pero así el usuario no tiene que volver a escribirla.
var passwordTemporalPendiente = null;
function mostrarCambiarPassword(passwordActual) {
  passwordTemporalPendiente = passwordActual;
  document.getElementById('vista-login').style.display = 'none';
  document.getElementById('vista-app').style.display = 'none';
  document.getElementById('vista-cambiar-password').style.display = 'flex';
  document.getElementById('cp-nueva').value = '';
  document.getElementById('cp-confirmar').value = '';
  document.getElementById('msj-error-cambiar-password').style.display = 'none';
}

document.getElementById('form-cambiar-password').addEventListener('submit', function (e) {
  e.preventDefault();
  var nueva = document.getElementById('cp-nueva').value;
  var confirmar = document.getElementById('cp-confirmar').value;
  var msjError = document.getElementById('msj-error-cambiar-password');
  msjError.style.display = 'none';

  if (nueva.length < 8) { msjError.textContent = 'La contraseña nueva debe tener al menos 8 caracteres.'; msjError.style.display = 'block'; return; }
  if (nueva !== confirmar) { msjError.textContent = 'Las dos contraseñas no coinciden.'; msjError.style.display = 'block'; return; }

  var btn = this.querySelector('button');
  btn.disabled = true;
  apiFetch('/api/identidad/mi-password', {
    method: 'POST',
    body: JSON.stringify({ passwordActual: passwordTemporalPendiente, passwordNueva: nueva })
  })
    .then(function () {
      passwordTemporalPendiente = null;
      btn.disabled = false;
      mostrarApp();
    })
    .catch(function (err) {
      btn.disabled = false;
      msjError.textContent = err.message || 'No se pudo cambiar la contraseña.';
      msjError.style.display = 'block';
    });
});

document.getElementById('btn-salir').addEventListener('click', function () {
  sessionStorage.removeItem('jacquin_demo_sesion');
  location.hash = '';
  mostrarLogin();
});

window.addEventListener('hashchange', navegar);

if (sesionActual()) { mostrarApp(); } else { mostrarLogin(); }
</script>
