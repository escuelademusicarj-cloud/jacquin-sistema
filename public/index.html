}

function activarLogicaEvaluacionMensual() {
  var campoBuscarAvance = document.getElementById('av-buscar-alumno');
  if (campoBuscarAvance) {
    campoBuscarAvance.addEventListener('input', function () {
      busquedaAvanceMensual = this.value;
      renderContenido('evaluacion');
      var campo = document.getElementById('av-buscar-alumno');
      if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    });
  }

  var modal = document.getElementById('modal-eval-mensual');
  if (!modal) return;

  document.querySelectorAll('.btn-eliminar-avance-mensual').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-id');
      if (!confirm('¿Eliminar este avance registrado? Esta acción no se puede deshacer.')) return;
      btn.disabled = true;
      apiFetch('/api/avances/mensual/' + id, { method: 'DELETE' })
        .then(function () { return refrescarCacheEvaluacionesMensuales(); })
        .then(function () { renderContenido('evaluacion'); })
        .catch(function (err) { btn.disabled = false; alert('No se pudo eliminar: ' + (err.message || 'error de conexión.')); });
    });
  });

  document.querySelectorAll('.btn-evaluar-mensual').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var alumnoIdx = Number(btn.getAttribute('data-alumno-idx'));
      var alumno = cargarAlumnos()[alumnoIdx];
      var mesActual = mesActualStr();
      var existente = cargarEvaluacionesMensuales().find(function (e) { return e.alumnoIdx === alumnoIdx && e.mes === mesActual; });

      modal.setAttribute('data-alumno-idx', alumnoIdx);
      document.getElementById('modal-eval-mensual-titulo').textContent = 'Evaluación mensual — ' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '');

      PREGUNTAS_EVAL_MENSUAL.forEach(function (p) {
        var select = document.getElementById('evm-' + p.id);
        select.value = (existente && existente.respuestas && existente.respuestas[p.id]) || 'normal';
      });
      document.getElementById('evm-observaciones').value = (existente && existente.observaciones) || '';

      modal.style.display = 'flex';
    });
  });

  var btnCancelar = document.getElementById('btn-cancelar-eval-mensual');
  if (btnCancelar) btnCancelar.addEventListener('click', function () { modal.style.display = 'none'; });

  var btnGuardar = document.getElementById('btn-guardar-eval-mensual');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var alumnoIdx = Number(modal.getAttribute('data-alumno-idx'));
      var alumno = cargarAlumnos()[alumnoIdx];
      var mesActual = mesActualStr();
      var respuestas = {};
      PREGUNTAS_EVAL_MENSUAL.forEach(function (p) { respuestas[p.id] = document.getElementById('evm-' + p.id).value; });
      var observaciones = document.getElementById('evm-observaciones').value.trim();
      if (!alumno) { alert('No se encontró el estudiante.'); return; }

      btnGuardar.disabled = true;
      apiFetch('/api/avances/mensual', {
        method: 'POST',
        body: JSON.stringify({ alumnoId: alumno.id, mes: mesActual, respuestas: respuestas, observaciones: observaciones })
      })
        .then(function () { return refrescarCacheEvaluacionesMensuales(); })
        .then(function () {
          modal.style.display = 'none';
          btnGuardar.disabled = false;
          renderContenido('evaluacion');
        })
        .catch(function (err) {
          btnGuardar.disabled = false;
          alert('No se pudo guardar la evaluación: ' + (err.message || 'error de conexión.'));
        });
    });
  }

  // Recuadro externo "Ver resultado" — muestra el detalle completo (8
  // respuestas + observaciones) de un avance ya realizado, sin editarlo.
  var modalResultado = document.getElementById('modal-ver-resultado-mensual');
  if (modalResultado) {
    document.querySelectorAll('.btn-ver-resultado-mensual').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var alumnoIdx = Number(btn.getAttribute('data-alumno-idx'));
        var mes = btn.getAttribute('data-mes');
        var alumno = cargarAlumnos()[alumnoIdx];
        var registro = cargarEvaluacionesMensuales().find(function (e) { return e.alumnoIdx === alumnoIdx && e.mes === mes; });
        if (!registro) return;

        var mesLegibleReg = new Date(mes + '-01T00:00:00').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
        document.getElementById('modal-ver-resultado-titulo').textContent = 'Resultado — ' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '');
        document.getElementById('modal-ver-resultado-sub').textContent = mesLegibleReg + ' · registrado el ' + (registro.fecha || '—');

        var htmlRespuestas = PREGUNTAS_EVAL_MENSUAL.map(function (p) {
          var valor = (registro.respuestas && registro.respuestas[p.id]) || 'normal';
          var color = COLOR_ESCALA_MENSUAL[valor] || 'var(--muted)';
          return '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee;">' +
            '<span style="font-size:12.5px;">' + p.texto + '</span>' +
            '<span style="font-size:11px; font-weight:700; color:#fff; background:' + color + '; padding:3px 10px; border-radius:10px; white-space:nowrap;">' + ETIQUETA_ESCALA_MENSUAL[valor] + '</span>' +
            '</div>';
        }).join('');
        document.getElementById('modal-ver-resultado-respuestas').innerHTML = htmlRespuestas;
        document.getElementById('modal-ver-resultado-obs').textContent = registro.observaciones || '—';

        modalResultado.style.display = 'flex';
      });
    });

    var btnCerrarResultado = document.getElementById('btn-cerrar-ver-resultado');
    if (btnCerrarResultado) btnCerrarResultado.addEventListener('click', function () { modalResultado.style.display = 'none'; });
  }
}

function renderLineaTiempoEvaluacion(evaluaciones) {
  if (evaluaciones.length === 0) return '<p style="font-size:13px; color:var(--muted);">Todavía no hay evaluaciones registradas para armar la línea de tiempo.</p>';
  var ordenadas = evaluaciones.slice().sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
  var tiempos = ordenadas.map(function (e) { return new Date(e.fecha).getTime(); });
  var minT = Math.min.apply(null, tiempos), maxT = Math.max.apply(null, tiempos);
  var rango = maxT - minT || 1;
  var W = 680, H = 210, PAD = 40;

  var puntos = ordenadas.map(function (e) {
    var x = PAD + ((new Date(e.fecha).getTime() - minT) / rango) * (W - 2 * PAD);
    var prom = promedioEvaluacion(e);
    var y = (H - PAD - 20) - ((prom - 1) / 2) * (H - 2 * PAD - 20);
    return { x: x, y: y, prom: prom, fecha: e.fecha };
  });

  var lineaPts = puntos.map(function (p) { return p.x + ',' + p.y; }).join(' ');

  var circulos = puntos.map(function (p) {
    var color = p.prom >= 2.5 ? '#39ff88' : (p.prom >= 1.5 ? '#ffb347' : '#ff4d6d');
    return '<circle cx="' + p.x + '" cy="' + p.y + '" r="7" fill="' + color + '" filter="url(#neonGlow)"><title>' + p.fecha + ' — ' + p.prom.toFixed(1) + '/3</title></circle>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#fff"></circle>';
  }).join('');

  var etiquetasFecha = puntos.map(function (p) {
    return '<text x="' + p.x + '" y="' + (H - 12) + '" font-size="9.5" fill="#9fb3d1" text-anchor="middle" transform="rotate(-30 ' + p.x + ' ' + (H - 12) + ')">' + p.fecha + '</text>';
  }).join('');

  var ultimo = puntos[puntos.length - 1];
  var etiquetaUltimo = ultimo.prom >= 2.5 ? 'Consolidado' : (ultimo.prom >= 1.5 ? 'En desarrollo' : 'Iniciando');
  var colorUltimoTexto = ultimo.prom >= 2.5 ? '#39ff88' : (ultimo.prom >= 1.5 ? '#ffb347' : '#ff4d6d');

  return '' +
    '<div style="display:flex; align-items:baseline; gap:10px; margin-bottom:10px;">' +
    '<span style="font-size:13px; color:var(--muted);">Nivel actual:</span>' +
    '<span style="font-size:16px; font-weight:700; color:' + colorUltimoTexto + '; text-shadow:0 0 8px ' + colorUltimoTexto + ';">' + etiquetaUltimo + '</span>' +
    '<span style="font-size:11px; color:var(--muted);">(' + puntos.length + ' evaluación' + (puntos.length === 1 ? '' : 'es') + ' registrada' + (puntos.length === 1 ? '' : 's') + ')</span>' +
    '</div>' +
    '<div style="background:var(--azul-noche); border-radius:12px; padding:8px 4px;">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:210px;">' +
    '<defs><filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">' +
    '<feGaussianBlur stdDeviation="4.5" result="blur"/>' +
    '<feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
    '</filter></defs>' +
    '<line x1="' + PAD + '" y1="' + (H - PAD - 20) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD - 20) + '" stroke="#2a3f5f" stroke-width="1"/>' +
    '<polyline points="' + lineaPts + '" fill="none" stroke="#5ee7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>' +
    '<polyline points="' + lineaPts + '" fill="none" stroke="#eafcff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    circulos +
    etiquetasFecha +
    '</svg>' +
    '</div>';
}

function renderEvaluacionLineaPanel(sesion) {
  var alumnos = cargarAlumnos();
  var esProfesor = sesion.rol === 'PROFESOR'; // se usa más abajo solo para ocultar "Enviar informe al acudiente", no para filtrar datos.
  // Decisión (2026-08-28): Profesor ve todos los estudiantes, como Administración.
  var alumnosVisibles = alumnos.map(function (a, i) { return { a: a, i: i }; });

  if (alumnosVisibles.length === 0) {
    return '<div class="panel"><p style="font-size:13px; color:var(--muted);">Todavía no hay estudiantes registrados.</p></div>';
  }

  var alumnoSeleccionadoIdx = alumnosVisibles[0].i;
  var cargado = CACHE_INDICADORES.alumnoIdx === alumnoSeleccionadoIdx;
  var evaluacionesAlumno = cargado ? CACHE_INDICADORES.lista : [];
  var cargandoTxt = '<p style="font-size:13px; color:var(--muted);">Cargando…</p>';

  return '' +
    '<div class="panel"><p style="font-size:12px; color:var(--muted); margin:0;">Método propio de Jacquin — cualitativo, por observación del profesor. No es examen ni nota numérica. Es un seguimiento aparte de la evaluación mensual, con más detalle por indicador.</p>' +
    '<div class="campo" style="margin-top:10px;"><label>Estudiante</label><select id="ev-alumno-ver">' +
    alumnosVisibles.map(function (o) { return '<option value="' + o.i + '">' + o.a.nombres + ' ' + o.a.apellidos + '</option>'; }).join('') +
    '</select></div>' +
    '</div>' +

    '<div class="panel" id="panel-linea-tiempo"><h2>Línea de tiempo de avance</h2>' +
    (cargado ? renderLineaTiempoEvaluacion(evaluacionesAlumno) : cargandoTxt) +
    '</div>' +

    '<div class="panel"><h2>Nueva evaluación</h2>' +
    '<div class="grilla-2col">' +
    '<div class="campo"><label>Fecha</label><input id="ev-fecha" type="date" value="' + new Date().toISOString().slice(0, 10) + '" /></div>' +
    INDICADORES_EVALUACION.map(function (ind) {
      return '<div class="campo"><label>' + ETIQUETA_INDICADOR[ind] + '</label><select id="ev-' + ind + '">' +
        Object.keys(ETIQUETA_ESCALA).map(function (k) { return '<option value="' + k + '"' + (k === 'en_desarrollo' ? ' selected' : '') + '>' + ETIQUETA_ESCALA[k] + '</option>'; }).join('') +
        '</select></div>';
    }).join('') +
    '<div class="campo"><label>Observaciones</label><input id="ev-observaciones" type="text" placeholder="Notas del profesor sobre esta evaluación..." /></div>' +
    '</div>' +
    '<button class="btn-primario" id="btn-guardar-evaluacion" style="max-width:280px;">Guardar evaluación</button>' +
    '<p id="msj-evaluacion-ok" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Evaluación registrada — la línea de tiempo ya se actualizó.</p>' +
    '</div>' +

    '<div class="panel" id="panel-historial-indicadores"><h2>Historial</h2>' +
    (cargado ? historialIndicadoresHtml(evaluacionesAlumno) : cargandoTxt) +
    '</div>' +

    (esProfesor ? '' :
    '<div class="panel"><h2>Enviar informe al acudiente</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Genera el PDF del informe y te ayuda a mandarlo por WhatsApp.</p>' +
    '<button class="btn-primario" id="btn-informe-pdf">Generar informe PDF</button>' +
    '</div>') +

    '<div id="comprobante-imprimir" style="display:none;"></div>';
}

function renderEvaluacion(sesion) {
  var pestañas = ['mensual', 'linea'];
  var etiquetaPestaña = { mensual: 'Evaluación mensual', linea: 'Seguimiento por indicadores' };

  var botonesPestañas = pestañas.map(function (p) {
    var activa = p === tabEvaluacionActiva;
    return '<button type="button" onclick="cambiarTabEvaluacion(\'' + p + '\')" style="' +
      'padding:8px 16px; border-radius:8px; border:1px solid ' + (activa ? 'var(--azul-oscuro)' : '#e2e5ea') + ';' +
      'background:' + (activa ? 'var(--azul-oscuro)' : '#fff') + '; color:' + (activa ? '#fff' : 'var(--texto)') + ';' +
      'font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-ui);">' + etiquetaPestaña[p] + '</button>';
  }).join('');

  var contenido = tabEvaluacionActiva === 'mensual' ? renderEvaluacionMensualPanel(sesion) : renderEvaluacionLineaPanel(sesion);

  return '' +
    '<h1 style="font-family:var(--font-wordmark); font-weight:500; font-size:22px; margin:4px 0 6px;">Avances académicos</h1>' +
    '<div style="display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;">' + botonesPestañas + '</div>' +
    contenido;
}

function generarHtmlInformeEvaluacion(alumno, evaluaciones) {
  var ordenadas = evaluaciones.slice().sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
  var filas = ordenadas.map(function (e) {
    return '<tr><td style="padding:4px 0;">' + e.fecha + '</td><td style="padding:4px 0; text-align:right;">' + promedioEvaluacion(e).toFixed(1) + '/3</td><td style="padding:4px 0; font-size:11px;">' + (e.observaciones || '—') + '</td></tr>';
  }).join('');
  var ultimo = ordenadas.length ? promedioEvaluacion(ordenadas[ordenadas.length - 1]) : null;
  var nivelTxt = ultimo === null ? '—' : (ultimo >= 2.5 ? 'Consolidado' : (ultimo >= 1.5 ? 'En desarrollo' : 'Iniciando'));

  return '' +
    '<div style="font-family:Arial,sans-serif; max-width:420px; margin:0 auto; padding:24px; border:1px solid #ccc;">' +
    '<div style="text-align:center; border-bottom:2px solid #223F61; padding-bottom:12px; margin-bottom:16px;">' +
    '<div style="font-size:20px; font-weight:bold; color:#223F61;">Jacquin</div>' +
    '<div style="font-size:11px; letter-spacing:2px; color:#666;">ACADEMIA MUSICAL</div>' +
    '</div>' +
    '<h3 style="text-align:center; margin:0 0 6px;">Informe de evaluación académica</h3>' +
    '<p style="text-align:center; font-size:13px; color:#666; margin:0 0 16px;">' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '') + ' — ' + (alumno ? alumno.programa : '') + '</p>' +
    '<p style="text-align:center; font-size:14px; margin:0 0 16px;">Nivel actual: <strong>' + nivelTxt + '</strong></p>' +
    '<table style="width:100%; font-size:12px; border-collapse:collapse;"><thead><tr><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666;">Fecha</td><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666; text-align:right;">Promedio</td><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666;">Observaciones</td></tr></thead><tbody>' + filas + '</tbody></table>' +
    '<p style="text-align:center; font-size:11px; color:#999; margin-top:20px;">Academia Musical Jacquin — evaluación cualitativa por observación del profesor</p>' +
    '</div>';
}

function activarLogicaEvaluacion() {
  var selectVer = document.getElementById('ev-alumno-ver');
  if (selectVer) {
    var idxInicial = Number(selectVer.value);
    if (CACHE_INDICADORES.alumnoIdx !== idxInicial) {
      refrescarIndicadoresDeAlumno(idxInicial).then(function () {
        if (Number(selectVer.value) !== idxInicial) return; // el usuario ya cambió de selección
        var panelLinea = document.getElementById('panel-linea-tiempo');
        if (panelLinea) panelLinea.innerHTML = '<h2>Línea de tiempo de avance</h2>' + renderLineaTiempoEvaluacion(CACHE_INDICADORES.lista);
        var panelHist = document.getElementById('panel-historial-indicadores');
        if (panelHist) panelHist.innerHTML = '<h2>Historial</h2>' + historialIndicadoresHtml(CACHE_INDICADORES.lista);
      });
    }

    selectVer.addEventListener('change', function () {
      var idx = Number(this.value);
      var panelLinea = document.getElementById('panel-linea-tiempo');
      var panelHist = document.getElementById('panel-historial-indicadores');
      if (panelLinea) panelLinea.innerHTML = '<h2>Línea de tiempo de avance</h2><p style="font-size:13px; color:var(--muted);">Cargando…</p>';
      if (panelHist) panelHist.innerHTML = '<h2>Historial</h2><p style="font-size:13px; color:var(--muted);">Cargando…</p>';
      refrescarIndicadoresDeAlumno(idx).then(function () {
        if (Number(selectVer.value) !== idx) return;
        if (panelLinea) panelLinea.innerHTML = '<h2>Línea de tiempo de avance</h2>' + renderLineaTiempoEvaluacion(CACHE_INDICADORES.lista);
        if (panelHist) panelHist.innerHTML = '<h2>Historial</h2>' + historialIndicadoresHtml(CACHE_INDICADORES.lista);
      });
    });
  }

  var btnGuardar = document.getElementById('btn-guardar-evaluacion');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var alumnoIdx = Number(document.getElementById('ev-alumno-ver').value);
      var alumno = cargarAlumnos()[alumnoIdx];
      var fecha = document.getElementById('ev-fecha').value;
      if (!fecha) { alert('La fecha es obligatoria.'); return; }
      if (!alumno) { alert('No se encontró el estudiante.'); return; }
      var indicadores = {};
      INDICADORES_EVALUACION.forEach(function (ind) { indicadores[ind] = document.getElementById('ev-' + ind).value; });
      var observaciones = document.getElementById('ev-observaciones').value.trim();

      btnGuardar.disabled = true;
      apiFetch('/api/avances/indicadores', {
        method: 'POST',
        body: JSON.stringify({ alumnoId: alumno.id, fecha: fecha, indicadores: indicadores, observaciones: observaciones })
      })
        .then(function () { return refrescarIndicadoresDeAlumno(alumnoIdx); })
        .then(function () {
          btnGuardar.disabled = false;
          document.getElementById('msj-evaluacion-ok').style.display = 'block';
          setTimeout(function () { renderContenido('evaluacion'); }, 700);
        })
        .catch(function (err) {
          btnGuardar.disabled = false;
          alert('No se pudo guardar la evaluación: ' + (err.message || 'error de conexión.'));
        });
    });
  }

  var btnInforme = document.getElementById('btn-informe-pdf');
  if (btnInforme) {
    btnInforme.addEventListener('click', function () {
      var alumnoIdx = Number(document.getElementById('ev-alumno-ver').value);
      var alumno = cargarAlumnos()[alumnoIdx];
      var evaluaciones = CACHE_INDICADORES.alumnoIdx === alumnoIdx ? CACHE_INDICADORES.lista : [];
      if (evaluaciones.length === 0) { alert('Este estudiante todavía no tiene evaluaciones registradas.'); return; }

      document.getElementById('comprobante-imprimir').innerHTML = generarHtmlInformeEvaluacion(alumno, evaluaciones);
      window.print();

      var telefono = alumno ? (alumno.telefono || '').replace(/\D/g, '') : '';
      if (telefono && confirm('¿Abrir WhatsApp para enviarle el resumen al acudiente? (el PDF hay que adjuntarlo a mano, WhatsApp no permite adjuntar archivos desde un enlace)')) {
        var ultimo = promedioEvaluacion(evaluaciones[evaluaciones.length - 1]);
        var nivel = ultimo >= 2.5 ? 'Consolidado' : (ultimo >= 1.5 ? 'En desarrollo' : 'Iniciando');
        var msj = encodeURIComponent('Hola, te compartimos el avance de ' + alumno.nombres + ' en Academia Musical Jacquin. Nivel actual: ' + nivel + '. Te enviamos el informe completo en PDF.');
        window.open('https://wa.me/' + telefono + '?text=' + msj, '_blank');
      }
    });
  }

  activarLogicaEvaluacionMensual();
}

// ==================== EVENTOS ====================
// Módulo para programar ensayos, presentaciones y otros eventos (recitales,
// reuniones), y convocar a estudiantes y profesores por WhatsApp con un
// mensaje ya redactado — conectado al listado real de Estudiantes y
// Profesores, para no tener que escribir a mano cada vez. Para que no quede
// tan informal, cada evento lleva su propia lista de convocados con
// registro de a quién ya se le envió la invitación (con fecha) y quién
// confirmó asistencia, en vez de mensajes sueltos sin control.
var TIPOS_EVENTO = ['Ensayo', 'Presentación', 'Otro'];
var ETIQUETA_TIPO_EVENTO = { 'Ensayo': '🎼 Ensayo', 'Presentación': '🎤 Presentación', 'Otro': '📌 Otro' };
var ESTADOS_EVENTO = ['programado', 'realizado', 'cancelado'];
var ETIQUETA_ESTADO_EVENTO = { programado: 'Programado', realizado: 'Realizado', cancelado: 'Cancelado' };
var COLOR_ESTADO_EVENTO = { programado: 'var(--azul-oscuro)', realizado: 'var(--verde)', cancelado: 'var(--rojo)' };

// ---- Eventos: conectado al backend real ----
// El backend guarda profesor_responsable_id (id real) y cada invitado con
// alumno_id/usuario_id (ids reales). El resto del archivo sigue trabajando
// con la forma vieja (profesorResponsable = email, estudiantesIdx = índices
// en cargarAlumnos(), profesoresEmails = emails) — se traduce acá. La clave
// de cada invitado ('e-<idx>' / 'p-<email>', vía claveInvitadoEvento) se
// sigue usando para ubicarlo en pantalla, pero ahora además guarda el id
// real del invitado (CACHE_INVITADOS_EVENTO_POR_CLAVE) para poder marcar
// "enviado"/"confirmado" contra el backend.
var CACHE_PENSUM = [];
async function refrescarCachePensum() {
  try {
    CACHE_PENSUM = await apiFetch('/api/pensum', { method: 'GET' }) || [];
  } catch (err) {
    console.error('No se pudo cargar el Pensum académico desde el backend:', err.message);
  }
}

var CACHE_EVENTOS = [];
var CACHE_INVITADOS_EVENTO_POR_CLAVE = {}; // clave -> id real de evento_invitados

async function refrescarCacheEventos() {
  try {
    var eventos = await apiFetch('/api/eventos', { method: 'GET' });
    CACHE_INVITADOS_EVENTO_POR_CLAVE = {};
    CACHE_EVENTOS = (eventos || []).map(function (e) {
      var profesorResp = CACHE_PROFESORES.find(function (p) { return p.id === e.profesor_responsable_id; });
      var estudiantesIdx = [];
      var profesoresEmails = [];
      var invitaciones = {};
      (e.invitados || []).forEach(function (inv) {
        if (inv.tipo === 'estudiante') {
          var idxAlumno = CACHE_ALUMNOS.findIndex(function (a) { return a.id === inv.alumno_id; });
          if (idxAlumno === -1) return;
          estudiantesIdx.push(idxAlumno);
          var claveE = claveInvitadoEvento('estudiante', idxAlumno);
          invitaciones[claveE] = { enviada: inv.invitacion_enviada, fechaEnvio: inv.fecha_envio, confirmado: inv.confirmado };
          CACHE_INVITADOS_EVENTO_POR_CLAVE[e.id + '|' + claveE] = inv.id;
        } else {
          var profInv = CACHE_PROFESORES.find(function (p) { return p.id === inv.usuario_id; });
          if (!profInv) return;
          profesoresEmails.push(profInv.email);
          var claveP = claveInvitadoEvento('profesor', profInv.email);
          invitaciones[claveP] = { enviada: inv.invitacion_enviada, fechaEnvio: inv.fecha_envio, confirmado: inv.confirmado };
          CACHE_INVITADOS_EVENTO_POR_CLAVE[e.id + '|' + claveP] = inv.id;
        }
      });
      return {
        id: e.id, tipo: e.tipo, titulo: e.titulo, fecha: e.fecha, hora: (e.hora || '').slice(0, 5),
        lugar: e.lugar || '', notas: e.notas || '', profesorResponsable: profesorResp ? profesorResp.email : '',
        estado: e.estado, estudiantesIdx: estudiantesIdx, profesoresEmails: profesoresEmails, invitaciones: invitaciones
      };
    });
  } catch (err) {
    console.error('No se pudo cargar Eventos desde el backend:', err.message);
  }
}
function cargarEventos() { return CACHE_EVENTOS; }
function guardarEventos(lista) { CACHE_EVENTOS = lista; }

function claveInvitadoEvento(tipoInvitado, id) { return (tipoInvitado === 'estudiante' ? 'e-' : 'p-') + id; }

function fechaLegibleEvento(fechaStr) {
  if (!fechaStr) return '—';
  return new Date(fechaStr + 'T00:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// Convierte la hora guardada (formato 24h "HH:MM", tal cual la deja el
// <input type="time">) a un formato de 12 horas con a. m./p. m., para que
// en el mensaje de WhatsApp quede clarísima y no se preste a confusión con
// la hora programada originalmente.
function horaLegibleEvento(horaStr) {
  if (!horaStr) return null;
  var partes = horaStr.split(':');
  var h = Number(partes[0]);
  var m = partes[1] || '00';
  var sufijo = h >= 12 ? 'p. m.' : 'a. m.';
  var h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + m + ' ' + sufijo;
}

// Redacta el mensaje de convocatoria — distinto según el tipo de evento — y
// siempre pide confirmación de asistencia, para que quede formal y no como
// un simple aviso suelto.
function mensajeConvocatoriaEvento(evento, nombreDestino) {
  var fechaTxt = fechaLegibleEvento(evento.fecha);
  var horaTxt = horaLegibleEvento(evento.hora) || 'hora por confirmar';
  var lugarTxt = evento.lugar || 'la academia';
  var intro;
  if (evento.tipo === 'Ensayo') {
    intro = 'Hola ' + nombreDestino + ', te esperamos en el ensayo "' + evento.titulo + '"';
  } else if (evento.tipo === 'Presentación') {
    intro = 'Hola ' + nombreDestino + ', te convocamos a la presentación "' + evento.titulo + '"';
  } else {
    intro = 'Hola ' + nombreDestino + ', te convocamos al evento "' + evento.titulo + '"';
  }
  var cuerpo = intro + ', el ' + fechaTxt + ' a las ' + horaTxt + ', en ' + lugarTxt + '.';
  if (evento.notas) cuerpo += ' ' + evento.notas;
  cuerpo += ' Por favor confirma tu asistencia respondiendo este mensaje. — Academia Musical Jacquin';
  return cuerpo;
}

function renderTarjetaEvento(evento, idx, alumnos, profesores) {
  var invitaciones = evento.invitaciones || {};
  var filasInvitados = [];

  (evento.estudiantesIdx || []).forEach(function (aIdx) {
    var a = alumnos[aIdx];
    if (!a) return;
    var clave = claveInvitadoEvento('estudiante', aIdx);
    var inv = invitaciones[clave] || {};
    var telefono = (a.telefono || a.celularAcudiente || '').replace(/\D/g, '');
    filasInvitados.push(filaInvitadoEvento(idx, clave, a.nombres + ' ' + a.apellidos, 'Estudiante', telefono, inv));
  });

  (evento.profesoresEmails || []).forEach(function (email) {
    var p = profesores.find(function (x) { return x.email === email; });
    if (!p) return;
    var clave = claveInvitadoEvento('profesor', email);
    var inv = invitaciones[clave] || {};
    // El teléfono ya viene del perfil real del profesor (CACHE_PROFESORES),
    // no del perfil local viejo — ese ya no guarda teléfono.
    var telefono = (p.telefono || '').replace(/\D/g, '');
    filasInvitados.push(filaInvitadoEvento(idx, clave, p.nombre, 'Profesor', telefono, inv));
  });

  var totalInvitados = filasInvitados.length;
  var totalEnviados = 0, totalConfirmados = 0;
  Object.keys(invitaciones).forEach(function (k) {
    if (invitaciones[k].enviada) totalEnviados++;
    if (invitaciones[k].confirmado) totalConfirmados++;
  });

  var profesorResp = evento.profesorResponsable ? (profesores.find(function (p) { return p.email === evento.profesorResponsable; }) || {}).nombre : null;

  var selectorEstado = evento.estado === 'programado'
    ? '<select class="sel-estado-evento" data-idx="' + idx + '" style="font-size:12px; padding:5px 8px; border-radius:6px; border:1.5px solid var(--azul-oscuro); color:var(--azul-oscuro);">' +
      ESTADOS_EVENTO.map(function (s) { return '<option value="' + s + '"' + (s === evento.estado ? ' selected' : '') + '>' + ETIQUETA_ESTADO_EVENTO[s] + '</option>'; }).join('') + '</select>'
    : '<span class="chip-rol" style="background:' + COLOR_ESTADO_EVENTO[evento.estado] + '; color:#fff;">' + ETIQUETA_ESTADO_EVENTO[evento.estado] + '</span>';

  var botonesGestion =
    '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' +
    selectorEstado +
    '<button class="btn-editar-evento" data-idx="' + idx + '" style="font-size:12px; padding:5px 10px; border-radius:6px; border:1.5px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer; font-family:var(--font-ui);">Editar</button>' +
    '<button class="btn-eliminar-evento" data-idx="' + idx + '" style="font-size:12px; padding:5px 10px; border-radius:6px; border:1.5px solid var(--rojo); background:#fff; color:var(--rojo); cursor:pointer; font-family:var(--font-ui);">Eliminar</button>' +
    '</div>';

  return '' +
    '<div class="panel" style="margin-bottom:14px; border-left:4px solid ' + COLOR_ESTADO_EVENTO[evento.estado] + ';">' +
    '<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">' +
    '<div>' +
    '<span class="chip-rol" style="background:var(--beige); color:var(--texto); margin-bottom:6px; display:inline-block;">' + ETIQUETA_TIPO_EVENTO[evento.tipo] + '</span>' +
    '<h3 style="margin:4px 0 2px;">' + evento.titulo + '</h3>' +
    '<p style="margin:0; font-size:12.5px; color:var(--muted); text-transform:capitalize;">' + fechaLegibleEvento(evento.fecha) + (evento.hora ? ' · ' + horaLegibleEvento(evento.hora) : '') + (evento.lugar ? ' · ' + evento.lugar : '') + '</p>' +
    (profesorResp ? '<p style="margin:2px 0 0; font-size:12px; color:var(--muted);">Responsable: ' + profesorResp + '</p>' : '') +
    '</div>' +
    botonesGestion +
    '</div>' +
    '<p style="font-size:12px; color:var(--muted); margin:10px 0 8px;">' + totalEnviados + ' de ' + totalInvitados + ' invitaciones enviadas · ' + totalConfirmados + ' confirmadas</p>' +
    (filasInvitados.length === 0 ? '<p style="font-size:12.5px; color:var(--muted);">No se convocó a nadie todavía.</p>' :
     '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Tipo</th><th>Invitación</th><th>Confirmó</th><th></th></tr></thead><tbody>' + filasInvitados.join('') + '</tbody></table></div>') +
    '</div>';
}

function filaInvitadoEvento(idxEvento, clave, nombre, tipoPersona, telefono, inv) {
  var chipEnvio = inv.enviada
    ? '<span class="chip-rol" style="background:var(--verde); color:#fff;">Invitado' + (inv.fechaEnvio ? ' el ' + inv.fechaEnvio : '') + '</span>'
    : '<span class="chip-rol" style="background:var(--naranja); color:#fff;">Sin enviar</span>';
  var checkboxConfirmado = '<input type="checkbox" class="chk-confirmado-evento" data-idx-evento="' + idxEvento + '" data-clave="' + clave + '"' + (inv.confirmado ? ' checked' : '') + (inv.enviada ? '' : ' disabled') + ' />';
  var botonWhatsapp = telefono
    ? '<button class="btn-whatsapp-evento" data-idx-evento="' + idxEvento + '" data-clave="' + clave + '" data-telefono="' + telefono + '" data-nombre="' + nombre.replace(/"/g, '&quot;') + '" style="font-size:11px; background:#25D366; color:#fff; border:none; border-radius:6px; padding:5px 9px; cursor:pointer;">WhatsApp</button>'
    : '<span style="font-size:11px; color:var(--muted); font-style:italic;">sin teléfono</span>';
  return '<tr><td>' + nombre + '</td><td>' + tipoPersona + '</td><td>' + chipEnvio + '</td><td>' + checkboxConfirmado + '</td><td>' + botonWhatsapp + '</td></tr>';
}

function activarLogicaEventos() {
  var btnCrear = document.getElementById('btn-crear-evento');
  if (btnCrear) {
    btnCrear.addEventListener('click', function () {
      var tipo = document.getElementById('ev-tipo').value;
      var titulo = document.getElementById('ev-titulo').value.trim();
      var fecha = document.getElementById('ev-fecha').value;
      var hora = document.getElementById('ev-hora').value;
      var lugar = document.getElementById('ev-lugar').value.trim();
      var profesorResponsableEmail = document.getElementById('ev-profesor-responsable').value;
      var notas = document.getElementById('ev-notas').value.trim();
      if (!titulo || !fecha) { alert('El título y la fecha son obligatorios.'); return; }

      var estudiantesIdx = Array.prototype.slice.call(document.querySelectorAll('.chk-ev-estudiante:checked')).map(function (c) { return Number(c.value); });
      var profesoresEmails = Array.prototype.slice.call(document.querySelectorAll('.chk-ev-profesor:checked')).map(function (c) { return c.value; });
      if (estudiantesIdx.length === 0 && profesoresEmails.length === 0) { alert('Convocá al menos a un estudiante o profesor.'); return; }

      var alumnosLista = cargarAlumnos();
      var profesorResponsable = CACHE_PROFESORES.find(function (p) { return p.email === profesorResponsableEmail; });
      var invitados = [];
      estudiantesIdx.forEach(function (idx) {
        var a = alumnosLista[idx];
        if (a && a.id) invitados.push({ tipo: 'estudiante', alumnoId: a.id });
      });
      profesoresEmails.forEach(function (email) {
        var p = CACHE_PROFESORES.find(function (pp) { return pp.email === email; });
        if (p) invitados.push({ tipo: 'profesor', usuarioId: p.id });
      });

      btnCrear.disabled = true;
      apiFetch('/api/eventos', {
        method: 'POST',
        body: JSON.stringify({
          evento: {
            tipo: tipo, titulo: titulo, fecha: fecha, hora: hora || null, lugar: lugar || null,
            notas: notas || null, profesorResponsableId: profesorResponsable ? profesorResponsable.id : null
          },
          invitados: invitados
        })
      })
        .then(function () { return refrescarCacheEventos(); })
        .then(function () {
          document.getElementById('msj-evento-creado').style.display = 'block';
          setTimeout(function () { renderContenido('eventos'); }, 700);
        })
        .catch(function (err) {
          alert('No se pudo programar el evento: ' + err.message);
          btnCrear.disabled = false;
        });
    });
  }

  document.querySelectorAll('.sel-estado-evento').forEach(function (sel) {
    sel.addEventListener('change', function () {
      var idx = Number(sel.getAttribute('data-idx'));
      var eventos = cargarEventos();
      var evento = eventos[idx];
      var nuevoEstado = sel.value;
      if (!evento || !evento.id) return;
      sel.disabled = true;
      apiFetch('/api/eventos/' + evento.id + '/estado', { method: 'PATCH', body: JSON.stringify({ estado: nuevoEstado }) })
        .then(function () { return refrescarCacheEventos(); })
        .then(function () { renderContenido('eventos'); })
        .catch(function (err) {
          alert('No se pudo cambiar el estado: ' + err.message);
          sel.disabled = false;
        });
    });
  });

  document.querySelectorAll('.btn-whatsapp-evento').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idxEvento = Number(btn.getAttribute('data-idx-evento'));
      var clave = btn.getAttribute('data-clave');
      var telefono = btn.getAttribute('data-telefono');
      var nombreDestino = btn.getAttribute('data-nombre');
      var eventos = cargarEventos();
      var evento = eventos[idxEvento];
      var mensaje = mensajeConvocatoriaEvento(evento, nombreDestino);
      window.open('https://wa.me/' + telefono + '?text=' + encodeURIComponent(mensaje), '_blank');

      var invitadoId = CACHE_INVITADOS_EVENTO_POR_CLAVE[evento.id + '|' + clave];
      if (!invitadoId) { renderContenido('eventos'); return; }
      apiFetch('/api/eventos/invitados/' + invitadoId + '/enviado', { method: 'PATCH', body: JSON.stringify({}) })
        .then(function () { return refrescarCacheEventos(); })
        .then(function () { renderContenido('eventos'); })
        .catch(function (err) { console.error('No se pudo marcar la invitación como enviada:', err.message); });
    });
  });

  document.querySelectorAll('.chk-confirmado-evento').forEach(function (chk) {
    chk.addEventListener('change', function () {
      var idxEvento = Number(chk.getAttribute('data-idx-evento'));
      var clave = chk.getAttribute('data-clave');
      var eventos = cargarEventos();
      var evento = eventos[idxEvento];
      var invitadoId = CACHE_INVITADOS_EVENTO_POR_CLAVE[evento.id + '|' + clave];
      if (!invitadoId) return;
      var marcado = chk.checked;
      chk.disabled = true;
      apiFetch('/api/eventos/invitados/' + invitadoId + '/confirmado', { method: 'PATCH', body: JSON.stringify({ confirmado: marcado }) })
        .then(function () { return refrescarCacheEventos(); })
        .catch(function (err) { alert('No se pudo guardar la confirmación: ' + err.message); })
        .then(function () { chk.disabled = false; });
    });
  });

  var modalEditar = document.getElementById('modal-editar-evento');

  document.querySelectorAll('.btn-editar-evento').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = Number(btn.getAttribute('data-idx'));
      var evento = cargarEventos()[idx];
      if (!evento || !modalEditar) return;

      modalEditar.setAttribute('data-idx', idx);
      document.getElementById('ee-tipo').value = evento.tipo || 'Ensayo';
      document.getElementById('ee-titulo').value = evento.titulo || '';
      document.getElementById('ee-fecha').value = evento.fecha || '';
      document.getElementById('ee-hora').value = evento.hora || '';
      document.getElementById('ee-lugar').value = evento.lugar || '';
      document.getElementById('ee-profesor-responsable').value = evento.profesorResponsable || '';
      document.getElementById('ee-notas').value = evento.notas || '';
      modalEditar.style.display = 'flex';
    });
  });

  var btnCancelarEditar = document.getElementById('btn-cancelar-editar-evento');
  if (btnCancelarEditar) btnCancelarEditar.addEventListener('click', function () { modalEditar.style.display = 'none'; });

  var btnGuardarEditar = document.getElementById('btn-guardar-editar-evento');
  if (btnGuardarEditar) {
    btnGuardarEditar.addEventListener('click', function () {
      var idx = Number(modalEditar.getAttribute('data-idx'));
      var titulo = document.getElementById('ee-titulo').value.trim();
      var fecha = document.getElementById('ee-fecha').value;
      if (!titulo || !fecha) { alert('El título y la fecha son obligatorios.'); return; }

      var eventos = cargarEventos();
      var evento = eventos[idx];
      if (!evento || !evento.id) return;
      var profesorEmail = document.getElementById('ee-profesor-responsable').value;
      var profesorResp = CACHE_PROFESORES.find(function (p) { return p.email === profesorEmail; });

      btnGuardarEditar.disabled = true;
      apiFetch('/api/eventos/' + evento.id, {
        method: 'PUT',
        body: JSON.stringify({
          tipo: document.getElementById('ee-tipo').value,
          titulo: titulo,
          fecha: fecha,
          hora: document.getElementById('ee-hora').value || null,
          lugar: document.getElementById('ee-lugar').value.trim() || null,
          notas: document.getElementById('ee-notas').value.trim() || null,
          profesorResponsableId: profesorResp ? profesorResp.id : null
        })
      })
        .then(function () { return refrescarCacheEventos(); })
        .then(function () {
          modalEditar.style.display = 'none';
          renderContenido('eventos');
        })
        .catch(function (err) {
          alert('No se pudo guardar el evento: ' + err.message);
          btnGuardarEditar.disabled = false;
        });
    });
  }

  document.querySelectorAll('.btn-eliminar-evento').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = Number(btn.getAttribute('data-idx'));
      var eventos = cargarEventos();
      var evento = eventos[idx];
      if (!evento || !evento.id) return;
      if (!confirm('¿Eliminar el evento "' + evento.titulo + '"? Esta acción no se puede deshacer.')) return;

      btn.disabled = true;
      apiFetch('/api/eventos/' + evento.id, { method: 'DELETE' })
        .then(function () { return refrescarCacheEventos(); })
        .then(function () { renderContenido('eventos'); })
        .catch(function (err) {
          alert('No se pudo eliminar el evento: ' + err.message);
          btn.disabled = false;
        });
    });
  });
}

// ==================== PENSUM ACADÉMICO ====================
// Módulo nuevo (2026-08-29): cada curso es una tarjeta; al abrirla se ve
// su contenido temático (secciones -> temas), con selector de Nivel 1/2
// para los cursos que lo tienen (Piano, Guitarra, Bajo, Violín). Cada
// tema puede tener un enlace (Drive u otro) — editable solo por
// Administración/Dirección (permiso pensum:crear); cualquier rol logueado
// puede verlo (permiso pensum:ver). Conectado al backend real desde el
// arranque (CACHE_PENSUM), no local — para que se vea igual en cualquier
// navegador sin el bug clásico de este proyecto.
var pensumProgramaAbierto = null;
var pensumNivelSeleccionado = 1;

// Paleta corporativa (variaciones de los colores de marca — nada de
// arcoíris genérico) que se repite cíclicamente entre las tarjetas.
var PALETA_PENSUM = [
  { fondo: '#EAF1FB', icono: '#223F61' }, // azul oscuro sobre celeste
  { fondo: '#FDEEE0', icono: '#E78C3B' }, // naranja sobre durazno suave
  { fondo: '#E9EDF3', icono: '#4A6FA5' }, // azul acero sobre gris azulado
  { fondo: '#F5EFE3', icono: '#A67C43' }  // bronce sobre beige
];
var ICONO_NOTA_PENSUM = '<svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>';

function renderPensum(sesion) {
  var puedeEditar = sesion.rol === 'ADMINISTRADOR' || sesion.rol === 'DIRECCION';
  var porPrograma = {};
  CACHE_PENSUM.forEach(function (n) {
    if (!porPrograma[n.programa]) porPrograma[n.programa] = [];
    porPrograma[n.programa].push(n);
  });

  if (pensumProgramaAbierto) {
    var niveles = (porPrograma[pensumProgramaAbierto] || []).slice().sort(function (a, b) { return a.nivel - b.nivel; });
    return '' +
      '<h1 style="font-family:var(--font-wordmark); font-weight:500; font-size:22px; margin:4px 0 14px;">Pensum académico</h1>' +
      renderDetallePensum(pensumProgramaAbierto, niveles, puedeEditar);
  }

  var tarjetas = PROGRAMAS.map(function (programa, i) {
    var niveles = (porPrograma[programa] || []).slice().sort(function (a, b) { return a.nivel - b.nivel; });
    var colores = PALETA_PENSUM[i % PALETA_PENSUM.length];
    return '<button class="tarjeta-curso-pensum" data-programa="' + programa + '" style="background:' + colores.fondo + ';">' +
      '<span class="icono-curso-pensum" style="background:' + colores.icono + ';">' + ICONO_NOTA_PENSUM + '</span>' +
      '<span class="texto-curso-pensum">' +
      '<span class="titulo-curso-pensum">' + programa + '</span>' +
      '<span class="subtitulo-curso-pensum">' + (niveles.length === 0 ? 'Sin contenido todavía' : (niveles.length > 1 ? 'Nivel 1 y Nivel 2' : 'Nivel único')) + '</span>' +
      '</span>' +
      '<span class="flecha-curso-pensum">›</span>' +
      '</button>';
  }).join('');

  return '' +
    '<h1 style="font-family:var(--font-wordmark); font-weight:500; font-size:22px; margin:4px 0 6px;">Pensum académico</h1>' +
    '<div class="panel">' +
    '<p style="font-size:13px; color:var(--muted); margin-top:-4px;">Elegí un curso para ver su contenido temático.' + (puedeEditar ? ' Podés agregar o cambiar el enlace de material (Drive u otro) de cada tema.' : '') + '</p>' +
    '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px; margin-top:16px;">' + tarjetas + '</div>' +
    '</div>';
}

function renderDetallePensum(programa, niveles, puedeEditar) {
  var volver = '<button class="btn-volver-pensum" id="btn-volver-pensum">‹ Volver a los cursos</button>';

  if (niveles.length === 0) {
    return volver + '<div class="panel"><p style="font-size:13px; color:var(--muted);">Todavía no hay contenido cargado para "' + programa + '".</p></div>';
  }
  var tieneDosNiveles = niveles.length > 1;
  var nivelActivo = niveles.find(function (n) { return n.nivel === pensumNivelSeleccionado; }) || niveles[0];

  var selectorNivel = tieneDosNiveles ? '<div style="margin-bottom:16px;">' +
    niveles.map(function (n) {
      var activo = n.id === nivelActivo.id;
      return '<button class="btn-nivel-pensum" data-nivel-id="' + n.id + '" style="background:' + (activo ? 'var(--azul-oscuro)' : '#fff') + '; color:' + (activo ? '#fff' : 'var(--azul-oscuro)') + ';">Nivel ' + n.nivel + '</button>';
    }).join('') + '</div>' : '';

  var secciones = (nivelActivo.secciones || []).map(function (s) {
    var temas = (s.temas || []).map(function (t) {
      var tieneEnlace = !!t.enlace_drive;
      return '<div class="tema-pensum-fila">' +
        '<span style="font-size:13.5px; color:var(--texto);">' + t.titulo + '</span>' +
        '<span style="display:flex; align-items:center; gap:8px;">' +
        (tieneEnlace ? '<a href="' + t.enlace_drive + '" target="_blank" rel="noopener" style="font-size:12px; color:var(--azul-oscuro); text-decoration:underline; font-weight:600;">Ver material</a>' : '<span style="font-size:12px; color:var(--muted); font-style:italic;">Sin material todavía</span>') +
        (puedeEditar ? '<button class="btn-editar-enlace-pensum" data-id="' + t.id + '" data-titulo="' + t.titulo.replace(/"/g, '&quot;') + '" data-enlace="' + (t.enlace_drive || '') + '" style="font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer; font-family:var(--font-ui);">' + (tieneEnlace ? 'Editar enlace' : 'Agregar enlace') + '</button>' : '') +
        '</span></div>';
    }).join('');
    return '<div class="seccion-pensum"><div class="seccion-pensum-header">' + s.titulo + '</div>' + temas + '</div>';
  }).join('');

  return volver +
    '<div class="panel">' +
    '<h2 style="margin-top:0;">' + nivelActivo.programa + (tieneDosNiveles ? ' — Nivel ' + nivelActivo.nivel : '') + '</h2>' +
    selectorNivel +
    (nivelActivo.resumen ? '<div class="resumen-pensum">' + nivelActivo.resumen + '</div>' : '') +
    secciones +
    '</div>' +
    '<div id="modal-editar-enlace-pensum" style="display:none; position:fixed; inset:0; background:rgba(21,42,68,0.5); z-index:60; align-items:center; justify-content:center; padding:20px;">' +
    '<div style="background:#fff; border-radius:12px; padding:22px; width:100%; max-width:420px;">' +
    '<h2 style="margin-top:0;" id="titulo-modal-enlace-pensum">Enlace del tema</h2>' +
    '<div class="campo"><label>Enlace (Drive u otro)</label><input id="input-enlace-pensum" type="url" placeholder="https://drive.google.com/..." /></div>' +
    '<button class="btn-primario" id="btn-guardar-enlace-pensum">Guardar</button>' +
    '<button id="btn-cancelar-enlace-pensum" style="width:100%; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer;">Cancelar</button>' +
    '<p id="msj-error-enlace-pensum" style="font-size:12px; color:#c0392b; display:none; margin-top:8px;"></p>' +
    '</div></div>';
}

function activarLogicaPensum() {
  document.querySelectorAll('.tarjeta-curso-pensum').forEach(function (btn) {
    btn.addEventListener('click', function () {
      pensumProgramaAbierto = btn.getAttribute('data-programa');
      pensumNivelSeleccionado = 1;
      renderContenido('pensum');
    });
  });

  var btnVolverPensum = document.getElementById('btn-volver-pensum');
  if (btnVolverPensum) {
    btnVolverPensum.addEventListener('click', function () {
      pensumProgramaAbierto = null;
      renderContenido('pensum');
    });
  }

  document.querySelectorAll('.btn-nivel-pensum').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var nivel = CACHE_PENSUM.find(function (n) { return n.id === btn.getAttribute('data-nivel-id'); });
      if (nivel) { pensumNivelSeleccionado = nivel.nivel; renderContenido('pensum'); }
    });
  });

  document.querySelectorAll('.btn-editar-enlace-pensum').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById('titulo-modal-enlace-pensum').textContent = btn.getAttribute('data-titulo');
      document.getElementById('input-enlace-pensum').value = btn.getAttribute('data-enlace') || '';
      document.getElementById('modal-editar-enlace-pensum').setAttribute('data-tema-id', btn.getAttribute('data-id'));
      document.getElementById('msj-error-enlace-pensum').style.display = 'none';
      document.getElementById('modal-editar-enlace-pensum').style.display = 'flex';
    });
  });

  var modalPensum = document.getElementById('modal-editar-enlace-pensum');
  var btnCancelarEnlacePensum = document.getElementById('btn-cancelar-enlace-pensum');
  if (btnCancelarEnlacePensum) btnCancelarEnlacePensum.addEventListener('click', function () { modalPensum.style.display = 'none'; });

  var btnGuardarEnlacePensum = document.getElementById('btn-guardar-enlace-pensum');
  if (btnGuardarEnlacePensum) {
    btnGuardarEnlacePensum.addEventListener('click', function () {
      var id = modalPensum.getAttribute('data-tema-id');
      var enlace = document.getElementById('input-enlace-pensum').value.trim();
      var msjError = document.getElementById('msj-error-enlace-pensum');
      msjError.style.display = 'none';

      btnGuardarEnlacePensum.disabled = true;
      apiFetch('/api/pensum/temas/' + id, { method: 'PUT', body: JSON.stringify({ enlaceDrive: enlace || null }) })
        .then(function () { return refrescarCachePensum(); })
        .then(function () {
          btnGuardarEnlacePensum.disabled = false;
          modalPensum.style.display = 'none';
          renderContenido('pensum');
        })
        .catch(function (err) {
          btnGuardarEnlacePensum.disabled = false;
          msjError.textContent = err.message || 'No se pudo guardar el enlace.';
          msjError.style.display = 'block';
        });
    });
  }
}

function filaTablaContable(celdas) {

    PROGRAMAS.map(function (p) { return '<option value="' + p + '"' + (r && r.programa === p ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div>' +
    '<div class="campo"><label>Categoría</label><select id="ing-categoria">' +
    CATEGORIAS_INGRESO.map(function (c) { return '<option value="' + c + '"' + (r && r.categoria === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
    '<div class="campo"><label>Estudiante / cliente (opcional)</label><input id="ing-cliente" type="text" value="' + (r ? r.cliente || '' : '') + '" /></div>' +
    '<div class="campo"><label>Método de pago</label><select id="ing-metodo">' +
    METODOS_PAGO_CONTABLE.map(function (m) { return '<option value="' + m + '"' + (r && r.metodo === m ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></div>' +
    '<div class="campo"><label>Estado</label><select id="ing-estado"><option value="pagado"' + (r && r.estado === 'pagado' ? ' selected' : '') + '>Pagado</option><option value="pendiente"' + (r && r.estado === 'pendiente' ? ' selected' : '') + '>Pendiente</option></select></div>' +

    (r ? '<button id="btn-cancelar-edicion-contable" style="max-width:280px; margin-left:8px; background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer;">Cancelar edición</button>' : '') +
    '<p id="msj-ingreso-creado" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Ingreso registrado.</p>' +
    '</div>';

  if (!esAdmin) return form;

  var total = ingresos.reduce(function (s, x) { return s + Number(x.valor || 0); }, 0);
  var filas = ingresos.map(function (x, i) {
    var botones = '<button class="btn-editar-contable" data-tipo="ingreso" data-idx="' + i + '" style="font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer; margin-right:4px;">Editar</button>' +
      '<button class="btn-eliminar-contable" data-tipo="ingreso" data-idx="' + i + '" style="font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid var(--rojo); background:#fff; color:var(--rojo); cursor:pointer;">Eliminar</button>';
    return filaTablaContable([x.fecha || '—', x.concepto, x.programa || '—', x.categoria, x.cliente || '—', x.metodo,

      '<strong>' + formatearCOPContable(x.valor) + '</strong>', botones]);
  }).join('');

  return form +
    '<div class="panel"><h2>Ingresos registrados (' + ingresos.length + ') · Total: ' + formatearCOPContable(total) + '</h2>' +
    (ingresos.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Todavía no hay ingresos registrados.</p>' :
     '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Fecha</th><th>Concepto</th><th>Programa</th><th>Categoría</th><th>Cliente</th><th>Método</th><th>Estado</th><th>Valor</th><th></th></tr></thead><tbody>' + filas + '</tbody></table></div>') +

}

    '<div class="campo"><label>Proveedor (opcional)</label><input id="gas-proveedor" type="text" value="' + (r ? r.proveedor || '' : '') + '" /></div>' +
    '<div class="campo"><label>Método de pago</label><select id="gas-metodo">' +

    '<div class="campo"><label>Estado</label><select id="gas-estado"><option value="pagado"' + (r && r.estado === 'pagado' ? ' selected' : '') + '>Pagado</option><option value="pendiente"' + (r && r.estado === 'pendiente' ? ' selected' : '') + '>Pendiente</option></select></div>' +

  if (!esAdmin) return form;

// ---- Donut SVG (ingresos como % del movimiento total del período).
function donutProContab(pctIngreso) {
  var pct = Math.max(0, Math.min(100, Math.round(pctIngreso)));
  var r = 52, c = 2 * Math.PI * r;
  var dash = (pct / 100) * c;
  return '' +
    '<div class="donut-pro-contab"><svg viewBox="0 0 130 130">' +
    '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--linea)" stroke-width="13"/>' +
    '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--verde)" stroke-width="13" stroke-linecap="round" ' +
    'stroke-dasharray="' + dash.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 65 65)"/>' +
    '</svg><div class="center"><span class="pct">' + pct + '%</span><span class="pct-lbl">Ingresos</span></div></div>';
}

// Combina categorías de gastos (texto libre en categoria) y compras en un solo
// mapa "categoría → total", igual que el archivo de referencia (que suma
// gastos + compras + nómina agregada para armar las barras de egresos).
function categoriasEgresoContable(gastos, compras, totalNomina) {
  var mapa = {};
  gastos.forEach(function (r) { mapa[r.categoria] = (mapa[r.categoria] || 0) + Number(r.valor || 0); });
  compras.forEach(function (r) { mapa[r.categoria] = (mapa[r.categoria] || 0) + Number(r.valorTotal || 0); });
  if (totalNomina > 0) mapa['Nómina'] = (mapa['Nómina'] || 0) + totalNomina;
  return mapa;
}

function categoriasIngresoContable(ingresos) {
  var mapa = {};
  ingresos.forEach(function (r) { mapa[r.categoria] = (mapa[r.categoria] || 0) + Number(r.valor || 0); });
  return mapa;
}

function ordenarCategorias(mapa) {
  return Object.keys(mapa).map(function (k) { return [k, mapa[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
}

function tablaMovimientosContable(movimientos) {

  }).join('');
  return '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Fecha</th><th>Módulo</th><th>Concepto</th><th>Estado</th><th>Valor</th></tr></thead><tbody>' + filas + '</tbody></table></div>';
}

// ---- Resumen general — visión global desde el inicio hasta hoy, con
// desglose por categoría y últimos movimientos (tomado como referencia
// de renderDashboard() del proyecto Neuro Tone, adaptado sin gráficos SVG).
// ---- Indicadores, efectivo/banco, tendencia y metas (2026-08-19) —
// mismas piezas que ya se veían en el dashboard financiero de Neuro Tone,
// con la paleta de Jacquin (var(--azul-oscuro)/var(--naranja)/var(--verde)/
// var(--rojo), ya definidas en el archivo) en vez del negro+dorado.
function calcularIndicadoresContable(totalIngresos, egresosTotal, balance, cantidadIngresos, totalNomina, balanceAnterior) {
  var margenNeto = totalIngresos > 0 ? (balance / totalIngresos) * 100 : 0;
  var relacion = totalIngresos > 0 ? (egresosTotal / totalIngresos) * 100 : 0;
  var variacion = null;
  if (balanceAnterior != null) {
    variacion = balanceAnterior !== 0 ? ((balance - balanceAnterior) / Math.abs(balanceAnterior)) * 100 : (balance > 0 ? 100 : 0);
  }
  var ingresoPromedio = cantidadIngresos > 0 ? totalIngresos / cantidadIngresos : 0;
  var pesoNomina = totalIngresos > 0 ? (totalNomina / totalIngresos) * 100 : 0;
  return { margenNeto: margenNeto, relacion: relacion, variacion: variacion, ingresoPromedio: ingresoPromedio, pesoNomina: pesoNomina };
}

function efectivoYBancoContable(ingresos, gastos, compras, nomina) {
  function porMetodo(lista, campoValor, metodo) {
    return lista.filter(function (r) { return (r.metodo || '') === metodo; }).reduce(function (s, r) { return s + Number(r[campoValor] || 0); }, 0);
  }
  function porMetodoDistinto(lista, campoValor, metodo) {
    return lista.filter(function (r) { return (r.metodo || '') !== metodo; }).reduce(function (s, r) { return s + Number(r[campoValor] || 0); }, 0);
  }
  var ingEfectivo = porMetodo(ingresos, 'valor', 'Efectivo');
  var ingBanco = porMetodoDistinto(ingresos, 'valor', 'Efectivo');
  var egEfectivo = porMetodo(gastos, 'valor', 'Efectivo') + porMetodo(compras, 'valorTotal', 'Efectivo') + porMetodo(nomina, 'neto', 'Efectivo');
  var egBanco = porMetodoDistinto(gastos, 'valor', 'Efectivo') + porMetodoDistinto(compras, 'valorTotal', 'Efectivo') + porMetodoDistinto(nomina, 'neto', 'Efectivo');
  return { ingEfectivo: ingEfectivo, ingBanco: ingBanco, egEfectivo: egEfectivo, egBanco: egBanco, efectivoDisponible: ingEfectivo - egEfectivo, bancoDisponible: ingBanco - egBanco };
}

// Curva de acumulación diaria dentro de un mes — usada en Balance mensual.
function chartAreaAcumuladoContable(movimientos, ym, color) {
  var partes = ym.split('-'); var anio = Number(partes[0]), mes = Number(partes[1]);
  var diasEnMes = new Date(anio, mes, 0).getDate();
  var porDia = new Array(diasEnMes + 1).fill(0);
  movimientos.forEach(function (m) {
    var d = Number((m.fecha || '').slice(8, 10));
    if (d >= 1 && d <= diasEnMes) porDia[d] += Number(m.valor || 0);
  });
  var acumulado = []; var run = 0;
  for (var d = 1; d <= diasEnMes; d++) { run += porDia[d]; acumulado.push(run); }
  var max = Math.max(1, Math.max.apply(null, acumulado));
  var w = 280, h = 100;
  var pts = acumulado.map(function (v, i) {
    var x = diasEnMes > 1 ? (i / (diasEnMes - 1)) * w : 0;
    var y = h - (v / max) * h;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var pathLine = 'M' + pts.join(' L');
  var pathArea = pathLine + ' L' + w + ',' + h + ' L0,' + h + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%; height:110px; display:block;" preserveAspectRatio="none">' +
    '<path d="' + pathArea + '" fill="' + color + '22" stroke="none"/>' +
    '<path d="' + pathLine + '" fill="none" stroke="' + color + '" stroke-width="2.5"/>' +
    '</svg>';
}

// Tendencia de los últimos N meses (ingresos vs egresos) — usada en Resumen general.
function ultimosMesesContable(ingresos, gastos, compras, nomina, n) {
  var hoy = new Date(); var meses = [];
  for (var i = n - 1; i >= 0; i--) {
    var d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return meses.map(function (ym) {
    var ing = ingresos.filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; }).reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
    var gas = gastos.filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; }).reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
    var com = compras.filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; }).reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
    var nom = nomina.filter(function (r) { return r.mes === ym; }).reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
    return { ym: ym, ingresos: ing, egresos: gas + com + nom };
  });
}

function chartBarrasTendenciaContable(meses) {
  var max = Math.max(1, meses.reduce(function (m, x) { return Math.max(m, x.ingresos, x.egresos); }, 0));
  var w = meses.length * 46, h = 90;
  var barras = meses.map(function (m, i) {
    var xBase = i * 46;
    var hIn = (m.ingresos / max) * h, hOut = (m.egresos / max) * h;
    return '<rect x="' + xBase + '" y="' + (h - hIn).toFixed(1) + '" width="16" height="' + hIn.toFixed(1) + '" fill="var(--verde)" rx="2"/>' +
      '<rect x="' + (xBase + 19) + '" y="' + (h - hOut).toFixed(1) + '" width="16" height="' + hOut.toFixed(1) + '" fill="var(--azul-oscuro)" rx="2"/>';
  }).join('');
  var etiquetas = meses.map(function (m, i) {
    var mesTxt = new Date(m.ym + '-01T00:00:00').toLocaleDateString('es-CO', { month: 'short' });
    return '<text x="' + (i * 46 + 17) + '" y="' + (h + 15) + '" font-size="10" fill="var(--muted)" text-anchor="middle">' + mesTxt + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + (h + 20) + '" style="width:100%; height:105px;">' + barras + etiquetas + '</svg>';
}

function tarjetaCarteraContable() {
  var cargos = (typeof CACHE_CARGOS !== 'undefined') ? CACHE_CARGOS : [];
  var pendientes = cargos.filter(function (c) { return Number(c.saldo || 0) > 0; });
  var totalCartera = pendientes.reduce(function (s, c) { return s + Number(c.saldo || 0); }, 0);
  return '<div class="panel"><h2>Cartera</h2><p style="font-size:12px; color:var(--muted); margin-top:-6px;">Acceso rápido a cuentas por cobrar reales (Pagos y cartera)</p>' +
    '<div style="border-left:4px solid var(--rojo); background:var(--rojo-tint); border-radius:8px; padding:12px 14px; margin:12px 0;">' +
    '<p style="font-size:11px; color:var(--muted); text-transform:uppercase; margin:0 0 4px;">Cuentas por cobrar</p>' +
    '<p style="margin:0; font-size:20px; font-weight:800; color:var(--rojo);">' + formatearCOPContable(totalCartera) + '</p>' +
    '<p style="margin:4px 0 0; font-size:11px; color:var(--muted);">' + pendientes.length + ' cargo(s) pendiente(s)</p>' +
    '</div>' +
    '<button class="btn-primario" id="btn-contab-ver-cartera" style="max-width:220px;">Ver cartera</button>' +
    '</div>';
}

function tarjetaMetasContable(totalIngresosPeriodo, etiquetaMeta) {
  var metas = cargarMetasContables();
  var pct = metas.mensual > 0 ? Math.min(100, Math.round((totalIngresosPeriodo / metas.mensual) * 100)) : 0;
  return '<div class="panel"><h2>Metas financieras</h2><p style="font-size:12px; color:var(--muted); margin-top:-6px;">Progreso de ingresos frente a la meta ' + etiquetaMeta + '</p>' +
    '<div style="margin:14px 0;"><div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span>Meta mensual</span><span>' + formatearCOPContable(totalIngresosPeriodo) + ' / ' + formatearCOPContable(metas.mensual) + '</span></div>' +
    '<div style="background:var(--beige); border-radius:6px; height:8px; overflow:hidden;"><div style="width:' + pct + '%; height:100%; background:var(--naranja);"></div></div>' +
    (metas.mensual === 0 ? '<p style="font-size:12px; color:var(--muted); margin-top:6px;">Definí una meta mensual para ver el progreso.</p>' : '') +
