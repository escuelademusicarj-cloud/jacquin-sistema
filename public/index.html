    var edadTxt = o.a.nacimiento ? calcularEdadDesdeFecha(o.a.nacimiento) + ' años' : '—';
    var curso = o.a.programa + (o.a.programa2 ? ' + ' + o.a.programa2 : '');
    var chip = evaluado
      ? '<span class="chip-rol" style="background:var(--verde); color:#fff;">Evaluado este mes</span>'
      : '<span class="chip-rol" style="background:var(--naranja); color:#fff;">Pendiente este mes</span>';
    var botones = '<div style="display:flex; gap:6px; flex-wrap:wrap;">' +
      '<button class="btn-primario btn-evaluar-mensual" data-alumno-idx="' + o.i + '" style="max-width:110px; font-size:12px; padding:6px 10px;">' + (evaluado ? 'Editar' : 'Evaluar') + '</button>' +
      (evaluado ? '<button class="btn-ver-resultado-mensual" data-alumno-idx="' + o.i + '" data-mes="' + mesActual + '" style="font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer; font-family:var(--font-ui); white-space:nowrap;">Ver avance</button>' : '') +
      '</div>';
    return '<tr><td>' + o.a.nombres + ' ' + o.a.apellidos + '</td><td>' + edadTxt + '</td><td>' + curso + '</td><td>' + chip + '</td><td>' + botones + '</td></tr>';
  }).join('');

  var historialFilas = evaluacionesMensuales.slice().sort(function (a, b) { return (b.mes || '').localeCompare(a.mes || ''); }).map(function (e) {
    var alumno = alumnos[e.alumnoIdx];
    var boton = '<button class="btn-ver-resultado-mensual" data-alumno-idx="' + e.alumnoIdx + '" data-mes="' + e.mes + '" style="font-size:11px; padding:5px 12px; border-radius:8px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer; font-family:var(--font-ui); white-space:nowrap;">Ver avance</button>';
    return '<tr><td>' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '—') + '</td><td>' + e.mes + '</td><td>' + (e.fecha || '—') + '</td><td>' + (e.observaciones || '—') + '</td><td>' + boton + '</td></tr>';
  }).join('');

  var htmlModal =
    '<div id="modal-eval-mensual" style="display:none; position:fixed; inset:0; background:rgba(21,42,68,0.5); z-index:60; align-items:center; justify-content:center; padding:20px;">' +
    '<div style="background:#fff; border-radius:12px; padding:22px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;">' +
    '<h2 style="margin-top:0;" id="modal-eval-mensual-titulo">Evaluación mensual</h2>' +
    '<p id="modal-eval-mensual-mes" style="font-size:12px; color:var(--muted); margin-top:-8px;">' + mesLegible + '</p>' +
    PREGUNTAS_EVAL_MENSUAL.map(function (p) {
      return '<div class="campo"><label>' + p.texto + '</label><select id="evm-' + p.id + '">' +
        ESCALA_MENSUAL.map(function (e) { return '<option value="' + e + '">' + ETIQUETA_ESCALA_MENSUAL[e] + '</option>'; }).join('') +
        '</select></div>';
    }).join('') +
    '<div class="campo"><label>Observaciones (opcional)</label><input id="evm-observaciones" type="text" /></div>' +
    '<button class="btn-primario" id="btn-guardar-eval-mensual">Guardar evaluación</button>' +
    '<button id="btn-cancelar-eval-mensual" style="width:100%; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer;">Cancelar</button>' +
    '</div></div>';

  // Recuadro externo (modal de solo lectura) para ver el detalle completo
  // de un avance ya realizado — las 8 respuestas + observaciones.
  var htmlModalResultado =
    '<div id="modal-ver-resultado-mensual" style="display:none; position:fixed; inset:0; background:rgba(21,42,68,0.5); z-index:60; align-items:center; justify-content:center; padding:20px;">' +
    '<div style="background:#fff; border-radius:12px; padding:22px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;">' +
    '<h2 style="margin-top:0;" id="modal-ver-resultado-titulo">Resultado del avance</h2>' +
    '<p id="modal-ver-resultado-sub" style="font-size:12px; color:var(--muted); margin-top:-8px;"></p>' +
    '<div id="modal-ver-resultado-respuestas"></div>' +
    '<p style="font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 4px;">Observaciones</p>' +
    '<p id="modal-ver-resultado-obs" style="font-size:13px; margin:0 0 16px;">—</p>' +
    '<button id="btn-cerrar-ver-resultado" style="width:100%; background:var(--azul-oscuro); color:#fff; border:none; border-radius:8px; height:38px; font-size:13px; cursor:pointer; font-family:var(--font-ui);">Cerrar</button>' +
    '</div></div>';

  return '' +
    '<div class="panel"><h2>Estudiantes — ' + mesLegible + '</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">A cada estudiante hay que hacerle esta evaluación al menos una vez por mes. Cuando empieza un mes nuevo, vuelve a aparecer como "Pendiente este mes" aunque ya se le haya hecho en meses anteriores.</p>' +
    buscadorHtml +
    '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Edad</th><th>Curso</th><th>Estado del mes</th><th></th></tr></thead><tbody>' + filas + '</tbody></table></div>' +
    '</div>' +
    '<div class="panel"><h2>Historial de avances académicos</h2>' +
    (historialFilas ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Estudiante</th><th>Mes</th><th>Fecha registrada</th><th>Observaciones</th><th></th></tr></thead><tbody>' + historialFilas + '</tbody></table></div>'
      : '<p style="font-size:13px; color:var(--muted);">Sin evaluaciones mensuales registradas todavía.</p>') +
    '</div>' +
    htmlModal + htmlModalResultado;
}

function activarLogicaEvaluacionMensual() {
  var campoBuscarAvance = document.getElementById('av-buscar-alumno');
  if (campoBuscarAvance) {
    campoBuscarAvance.addEventListener('input', function () {
      busquedaAvanceMensual = this.value;
      renderContenido('evaluacion');
      var campo = document.getElementById('av-buscar-alumno');
      if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    });
  }

  var modal = document.getElementById('modal-eval-mensual');
  if (!modal) return;

  document.querySelectorAll('.btn-evaluar-mensual').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var alumnoIdx = Number(btn.getAttribute('data-alumno-idx'));
      var alumno = cargarAlumnos()[alumnoIdx];
      var mesActual = mesActualStr();
      var existente = cargarEvaluacionesMensuales().find(function (e) { return e.alumnoIdx === alumnoIdx && e.mes === mesActual; });

      modal.setAttribute('data-alumno-idx', alumnoIdx);
      document.getElementById('modal-eval-mensual-titulo').textContent = 'Evaluación mensual — ' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '');

      PREGUNTAS_EVAL_MENSUAL.forEach(function (p) {
        var select = document.getElementById('evm-' + p.id);
        select.value = (existente && existente.respuestas && existente.respuestas[p.id]) || 'normal';
      });
      document.getElementById('evm-observaciones').value = (existente && existente.observaciones) || '';

      modal.style.display = 'flex';
    });
  });

  var btnCancelar = document.getElementById('btn-cancelar-eval-mensual');
  if (btnCancelar) btnCancelar.addEventListener('click', function () { modal.style.display = 'none'; });

  var btnGuardar = document.getElementById('btn-guardar-eval-mensual');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var alumnoIdx = Number(modal.getAttribute('data-alumno-idx'));
      var mesActual = mesActualStr();
      var respuestas = {};
      PREGUNTAS_EVAL_MENSUAL.forEach(function (p) { respuestas[p.id] = document.getElementById('evm-' + p.id).value; });
      var observaciones = document.getElementById('evm-observaciones').value.trim();

      var evaluaciones = cargarEvaluacionesMensuales();
      var existenteIdx = evaluaciones.findIndex(function (e) { return e.alumnoIdx === alumnoIdx && e.mes === mesActual; });
      var registro = { alumnoIdx: alumnoIdx, mes: mesActual, fecha: new Date().toISOString().slice(0, 10), respuestas: respuestas, observaciones: observaciones };
      if (existenteIdx !== -1) evaluaciones[existenteIdx] = registro; else evaluaciones.push(registro);
      guardarEvaluacionesMensuales(evaluaciones);

      modal.style.display = 'none';
      renderContenido('evaluacion');
    });
  }

  // Recuadro externo "Ver resultado" — muestra el detalle completo (8
  // respuestas + observaciones) de un avance ya realizado, sin editarlo.
  var modalResultado = document.getElementById('modal-ver-resultado-mensual');
  if (modalResultado) {
    document.querySelectorAll('.btn-ver-resultado-mensual').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var alumnoIdx = Number(btn.getAttribute('data-alumno-idx'));
        var mes = btn.getAttribute('data-mes');
        var alumno = cargarAlumnos()[alumnoIdx];
        var registro = cargarEvaluacionesMensuales().find(function (e) { return e.alumnoIdx === alumnoIdx && e.mes === mes; });
        if (!registro) return;

        var mesLegibleReg = new Date(mes + '-01T00:00:00').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
        document.getElementById('modal-ver-resultado-titulo').textContent = 'Resultado — ' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '');
        document.getElementById('modal-ver-resultado-sub').textContent = mesLegibleReg + ' · registrado el ' + (registro.fecha || '—');

        var htmlRespuestas = PREGUNTAS_EVAL_MENSUAL.map(function (p) {
          var valor = (registro.respuestas && registro.respuestas[p.id]) || 'normal';
          var color = COLOR_ESCALA_MENSUAL[valor] || 'var(--muted)';
          return '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee;">' +
            '<span style="font-size:12.5px;">' + p.texto + '</span>' +
            '<span style="font-size:11px; font-weight:700; color:#fff; background:' + color + '; padding:3px 10px; border-radius:10px; white-space:nowrap;">' + ETIQUETA_ESCALA_MENSUAL[valor] + '</span>' +
            '</div>';
        }).join('');
        document.getElementById('modal-ver-resultado-respuestas').innerHTML = htmlRespuestas;
        document.getElementById('modal-ver-resultado-obs').textContent = registro.observaciones || '—';

        modalResultado.style.display = 'flex';
      });
    });

    var btnCerrarResultado = document.getElementById('btn-cerrar-ver-resultado');
    if (btnCerrarResultado) btnCerrarResultado.addEventListener('click', function () { modalResultado.style.display = 'none'; });
  }
}

function renderLineaTiempoEvaluacion(evaluaciones) {
  if (evaluaciones.length === 0) return '<p style="font-size:13px; color:var(--muted);">Todavía no hay evaluaciones registradas para armar la línea de tiempo.</p>';
  var ordenadas = evaluaciones.slice().sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
  var tiempos = ordenadas.map(function (e) { return new Date(e.fecha).getTime(); });
  var minT = Math.min.apply(null, tiempos), maxT = Math.max.apply(null, tiempos);
  var rango = maxT - minT || 1;
  var W = 680, H = 210, PAD = 40;

  var puntos = ordenadas.map(function (e) {
    var x = PAD + ((new Date(e.fecha).getTime() - minT) / rango) * (W - 2 * PAD);
    var prom = promedioEvaluacion(e);
    var y = (H - PAD - 20) - ((prom - 1) / 2) * (H - 2 * PAD - 20);
    return { x: x, y: y, prom: prom, fecha: e.fecha };
  });

  var lineaPts = puntos.map(function (p) { return p.x + ',' + p.y; }).join(' ');

  var circulos = puntos.map(function (p) {
    var color = p.prom >= 2.5 ? '#39ff88' : (p.prom >= 1.5 ? '#ffb347' : '#ff4d6d');
    return '<circle cx="' + p.x + '" cy="' + p.y + '" r="7" fill="' + color + '" filter="url(#neonGlow)"><title>' + p.fecha + ' — ' + p.prom.toFixed(1) + '/3</title></circle>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#fff"></circle>';
  }).join('');

  var etiquetasFecha = puntos.map(function (p) {
    return '<text x="' + p.x + '" y="' + (H - 12) + '" font-size="9.5" fill="#9fb3d1" text-anchor="middle" transform="rotate(-30 ' + p.x + ' ' + (H - 12) + ')">' + p.fecha + '</text>';
  }).join('');

  var ultimo = puntos[puntos.length - 1];
  var etiquetaUltimo = ultimo.prom >= 2.5 ? 'Consolidado' : (ultimo.prom >= 1.5 ? 'En desarrollo' : 'Iniciando');
  var colorUltimoTexto = ultimo.prom >= 2.5 ? '#39ff88' : (ultimo.prom >= 1.5 ? '#ffb347' : '#ff4d6d');

  return '' +
    '<div style="display:flex; align-items:baseline; gap:10px; margin-bottom:10px;">' +
    '<span style="font-size:13px; color:var(--muted);">Nivel actual:</span>' +
    '<span style="font-size:16px; font-weight:700; color:' + colorUltimoTexto + '; text-shadow:0 0 8px ' + colorUltimoTexto + ';">' + etiquetaUltimo + '</span>' +
    '<span style="font-size:11px; color:var(--muted);">(' + puntos.length + ' evaluación' + (puntos.length === 1 ? '' : 'es') + ' registrada' + (puntos.length === 1 ? '' : 's') + ')</span>' +
    '</div>' +
    '<div style="background:var(--azul-noche); border-radius:12px; padding:8px 4px;">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:210px;">' +
    '<defs><filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">' +
    '<feGaussianBlur stdDeviation="4.5" result="blur"/>' +
    '<feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
    '</filter></defs>' +
    '<line x1="' + PAD + '" y1="' + (H - PAD - 20) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD - 20) + '" stroke="#2a3f5f" stroke-width="1"/>' +
    '<polyline points="' + lineaPts + '" fill="none" stroke="#5ee7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>' +
    '<polyline points="' + lineaPts + '" fill="none" stroke="#eafcff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    circulos +
    etiquetasFecha +
    '</svg>' +
    '</div>';
}

function renderEvaluacionLineaPanel(sesion) {
  var alumnos = cargarAlumnos();
  var esProfesor = sesion.rol === 'PROFESOR';
  var alumnosVisibles = esProfesor ? alumnos.map(function (a, i) { return { a: a, i: i }; }).filter(function (o) { return o.a.profesor === sesion.email; }) : alumnos.map(function (a, i) { return { a: a, i: i }; });
  var evaluaciones = cargarEvaluaciones();

  if (alumnosVisibles.length === 0) {
    return '<div class="panel"><p style="font-size:13px; color:var(--muted);">' + (esProfesor ? 'No tenés estudiantes asignados todavía.' : 'Todavía no hay estudiantes registrados.') + '</p></div>';
  }

  var alumnoSeleccionadoIdx = alumnosVisibles[0].i;
  var evaluacionesAlumno = evaluaciones.filter(function (e) { return e.alumnoIdx === alumnoSeleccionadoIdx; });

  var historialFilas = evaluacionesAlumno.slice().sort(function (a, b) { return new Date(b.fecha) - new Date(a.fecha); }).map(function (e) {
    return '<tr><td>' + e.fecha + '</td><td>' + promedioEvaluacion(e).toFixed(1) + '/3</td><td>' + (e.observaciones || '—') + '</td></tr>';
  }).join('');

  return '' +
    '<div class="panel"><p style="font-size:12px; color:var(--muted); margin:0;">Método propio de Jacquin — cualitativo, por observación del profesor. No es examen ni nota numérica. Es un seguimiento aparte de la evaluación mensual, con más detalle por indicador.</p>' +
    '<div class="campo" style="margin-top:10px;"><label>Estudiante</label><select id="ev-alumno-ver">' +
    alumnosVisibles.map(function (o) { return '<option value="' + o.i + '">' + o.a.nombres + ' ' + o.a.apellidos + '</option>'; }).join('') +
    '</select></div>' +
    '</div>' +

    '<div class="panel" id="panel-linea-tiempo"><h2>Línea de tiempo de avance</h2>' +
    renderLineaTiempoEvaluacion(evaluacionesAlumno) +
    '</div>' +

    '<div class="panel"><h2>Nueva evaluación</h2>' +
    '<div class="grilla-2col">' +
    '<div class="campo"><label>Fecha</label><input id="ev-fecha" type="date" value="' + new Date().toISOString().slice(0, 10) + '" /></div>' +
    INDICADORES_EVALUACION.map(function (ind) {
      return '<div class="campo"><label>' + ETIQUETA_INDICADOR[ind] + '</label><select id="ev-' + ind + '">' +
        Object.keys(ETIQUETA_ESCALA).map(function (k) { return '<option value="' + k + '"' + (k === 'en_desarrollo' ? ' selected' : '') + '>' + ETIQUETA_ESCALA[k] + '</option>'; }).join('') +
        '</select></div>';
    }).join('') +
    '<div class="campo"><label>Observaciones</label><input id="ev-observaciones" type="text" placeholder="Notas del profesor sobre esta evaluación..." /></div>' +
    '</div>' +
    '<button class="btn-primario" id="btn-guardar-evaluacion" style="max-width:280px;">Guardar evaluación</button>' +
    '<p id="msj-evaluacion-ok" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Evaluación registrada — la línea de tiempo ya se actualizó.</p>' +
    '</div>' +

    '<div class="panel"><h2>Historial</h2>' +
    (historialFilas ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Fecha</th><th>Promedio</th><th>Observaciones</th></tr></thead><tbody>' + historialFilas + '</tbody></table></div>' : '<p style="font-size:13px; color:var(--muted);">Sin evaluaciones todavía.</p>') +
    '</div>' +

    (esProfesor ? '' :
    '<div class="panel"><h2>Enviar informe al acudiente</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Genera el PDF del informe y te ayuda a mandarlo por WhatsApp.</p>' +
    '<button class="btn-primario" id="btn-informe-pdf">Generar informe PDF</button>' +
    '</div>') +

    '<div id="comprobante-imprimir" style="display:none;"></div>';
}

function renderEvaluacion(sesion) {
  var pestañas = ['mensual', 'linea'];
  var etiquetaPestaña = { mensual: 'Evaluación mensual', linea: 'Seguimiento por indicadores' };

  var botonesPestañas = pestañas.map(function (p) {
    var activa = p === tabEvaluacionActiva;
    return '<button type="button" onclick="cambiarTabEvaluacion(\'' + p + '\')" style="' +
      'padding:8px 16px; border-radius:8px; border:1px solid ' + (activa ? 'var(--azul-oscuro)' : '#e2e5ea') + ';' +
      'background:' + (activa ? 'var(--azul-oscuro)' : '#fff') + '; color:' + (activa ? '#fff' : 'var(--texto)') + ';' +
      'font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-ui);">' + etiquetaPestaña[p] + '</button>';
  }).join('');

  var contenido = tabEvaluacionActiva === 'mensual' ? renderEvaluacionMensualPanel(sesion) : renderEvaluacionLineaPanel(sesion);

  return '' +
    '<h1 style="font-family:var(--font-wordmark); font-weight:500; font-size:22px; margin:4px 0 6px;">Avances académicos</h1>' +
    '<div style="display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;">' + botonesPestañas + '</div>' +
    contenido;
}

  var filas = ordenadas.map(function (e) {
    return '<tr><td style="padding:4px 0;">' + e.fecha + '</td><td style="padding:4px 0; text-align:right;">' + promedioEvaluacion(e).toFixed(1) + '/3</td><td style="padding:4px 0; font-size:11px;">' + (e.observaciones || '—') + '</td></tr>';
  }).join('');
  var ultimo = ordenadas.length ? promedioEvaluacion(ordenadas[ordenadas.length - 1]) : null;
  var nivelTxt = ultimo === null ? '—' : (ultimo >= 2.5 ? 'Consolidado' : (ultimo >= 1.5 ? 'En desarrollo' : 'Iniciando'));

  return '' +
    '<div style="font-family:Arial,sans-serif; max-width:420px; margin:0 auto; padding:24px; border:1px solid #ccc;">' +
    '<div style="text-align:center; border-bottom:2px solid #223F61; padding-bottom:12px; margin-bottom:16px;">' +
    '<div style="font-size:20px; font-weight:bold; color:#223F61;">Jacquin</div>' +
    '<div style="font-size:11px; letter-spacing:2px; color:#666;">ACADEMIA MUSICAL</div>' +
    '</div>' +
    '<h3 style="text-align:center; margin:0 0 6px;">Informe de evaluación académica</h3>' +
    '<p style="text-align:center; font-size:13px; color:#666; margin:0 0 16px;">' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '') + ' — ' + (alumno ? alumno.programa : '') + '</p>' +

function activarLogicaEvaluacion() {
  var selectVer = document.getElementById('ev-alumno-ver');
  if (selectVer) {
    selectVer.addEventListener('change', function () {
      var idx = Number(this.value);
      var evaluaciones = cargarEvaluaciones().filter(function (e) { return e.alumnoIdx === idx; });
      document.getElementById('panel-linea-tiempo').innerHTML = '<h2>Línea de tiempo de avance</h2>' + renderLineaTiempoEvaluacion(evaluaciones);
    });
  }

  var btnGuardar = document.getElementById('btn-guardar-evaluacion');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var alumnoIdx = Number(document.getElementById('ev-alumno-ver').value);
      var fecha = document.getElementById('ev-fecha').value;
      if (!fecha) { alert('La fecha es obligatoria.'); return; }
      var nueva = { alumnoIdx: alumnoIdx, fecha: fecha, observaciones: document.getElementById('ev-observaciones').value.trim() };
      INDICADORES_EVALUACION.forEach(function (ind) { nueva[ind] = document.getElementById('ev-' + ind).value; });
      var evaluaciones = cargarEvaluaciones();
      evaluaciones.push(nueva);
      guardarEvaluaciones(evaluaciones);
      document.getElementById('msj-evaluacion-ok').style.display = 'block';
      setTimeout(function () { renderContenido('evaluacion'); }, 700);
    });
  }

  var btnInforme = document.getElementById('btn-informe-pdf');
  if (btnInforme) {
    btnInforme.addEventListener('click', function () {
      var alumnoIdx = Number(document.getElementById('ev-alumno-ver').value);
      var alumno = cargarAlumnos()[alumnoIdx];
      var evaluaciones = cargarEvaluaciones().filter(function (e) { return e.alumnoIdx === alumnoIdx; });
      if (evaluaciones.length === 0) { alert('Este estudiante todavía no tiene evaluaciones registradas.'); return; }

      document.getElementById('comprobante-imprimir').innerHTML = generarHtmlInformeEvaluacion(alumno, evaluaciones);
      window.print();

      var telefono = alumno ? (alumno.telefono || '').replace(/\D/g, '') : '';
      if (telefono && confirm('¿Abrir WhatsApp para enviarle el resumen al acudiente? (el PDF hay que adjuntarlo a mano, WhatsApp no permite adjuntar archivos desde un enlace)')) {
        var ultimo = promedioEvaluacion(evaluaciones[evaluaciones.length - 1]);
        var nivel = ultimo >= 2.5 ? 'Consolidado' : (ultimo >= 1.5 ? 'En desarrollo' : 'Iniciando');
        var msj = encodeURIComponent('Hola, te compartimos el avance de ' + alumno.nombres + ' en Academia Musical Jacquin. Nivel actual: ' + nivel + '. Te enviamos el informe completo en PDF.');
        window.open('https://wa.me/' + telefono + '?text=' + msj, '_blank');
      }
    });
  }

  activarLogicaEvaluacionMensual();
}

// ==================== EVENTOS ====================
// Módulo para programar ensayos, presentaciones y otros eventos (recitales,
// reuniones), y convocar a estudiantes y profesores por WhatsApp con un
// mensaje ya redactado — conectado al listado real de Estudiantes y
// Profesores, para no tener que escribir a mano cada vez. Para que no quede
// tan informal, cada evento lleva su propia lista de convocados con
// registro de a quién ya se le envió la invitación (con fecha) y quién
// confirmó asistencia, en vez de mensajes sueltos sin control.
var TIPOS_EVENTO = ['Ensayo', 'Presentación', 'Otro'];
var ETIQUETA_TIPO_EVENTO = { 'Ensayo': '🎼 Ensayo', 'Presentación': '🎤 Presentación', 'Otro': '📌 Otro' };
var ESTADOS_EVENTO = ['programado', 'realizado', 'cancelado'];
var ETIQUETA_ESTADO_EVENTO = { programado: 'Programado', realizado: 'Realizado', cancelado: 'Cancelado' };
var COLOR_ESTADO_EVENTO = { programado: 'var(--azul-oscuro)', realizado: 'var(--verde)', cancelado: 'var(--rojo)' };

function cargarEventos() {
  var g = localStorage.getItem('jacquin_demo_eventos');
  return g ? JSON.parse(g) : [];
}
function guardarEventos(lista) { localStorage.setItem('jacquin_demo_eventos', JSON.stringify(lista)); }

function claveInvitadoEvento(tipoInvitado, id) { return (tipoInvitado === 'estudiante' ? 'e-' : 'p-') + id; }

function fechaLegibleEvento(fechaStr) {
  if (!fechaStr) return '—';
  return new Date(fechaStr + 'T00:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// Convierte la hora guardada (formato 24h "HH:MM", tal cual la deja el
// <input type="time">) a un formato de 12 horas con a. m./p. m., para que
// en el mensaje de WhatsApp quede clarísima y no se preste a confusión con
// la hora programada originalmente.
function horaLegibleEvento(horaStr) {
  if (!horaStr) return null;
  var partes = horaStr.split(':');
  var h = Number(partes[0]);
  var m = partes[1] || '00';
  var sufijo = h >= 12 ? 'p. m.' : 'a. m.';
  var h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + m + ' ' + sufijo;
}

// Redacta el mensaje de convocatoria — distinto según el tipo de evento — y
// siempre pide confirmación de asistencia, para que quede formal y no como
// un simple aviso suelto.
function mensajeConvocatoriaEvento(evento, nombreDestino) {
  var fechaTxt = fechaLegibleEvento(evento.fecha);
  var horaTxt = horaLegibleEvento(evento.hora) || 'hora por confirmar';
  var lugarTxt = evento.lugar || 'la academia';
  var intro;
  if (evento.tipo === 'Ensayo') {
    intro = 'Hola ' + nombreDestino + ', te esperamos en el ensayo "' + evento.titulo + '"';
  } else if (evento.tipo === 'Presentación') {
    intro = 'Hola ' + nombreDestino + ', te convocamos a la presentación "' + evento.titulo + '"';
  } else {
    intro = 'Hola ' + nombreDestino + ', te convocamos al evento "' + evento.titulo + '"';
  }
  var cuerpo = intro + ', el ' + fechaTxt + ' a las ' + horaTxt + ', en ' + lugarTxt + '.';
  if (evento.notas) cuerpo += ' ' + evento.notas;
  cuerpo += ' Por favor confirma tu asistencia respondiendo este mensaje. — Academia Musical Jacquin';
  return cuerpo;
}

function renderTarjetaEvento(evento, idx, alumnos, profesores) {
  var invitaciones = evento.invitaciones || {};
  var perfiles = cargarPerfilesProfesor();
  var filasInvitados = [];

  (evento.estudiantesIdx || []).forEach(function (aIdx) {
    var a = alumnos[aIdx];
    if (!a) return;
    var clave = claveInvitadoEvento('estudiante', aIdx);
    var inv = invitaciones[clave] || {};
    var telefono = (a.telefono || a.celularAcudiente || '').replace(/\D/g, '');
    filasInvitados.push(filaInvitadoEvento(idx, clave, a.nombres + ' ' + a.apellidos, 'Estudiante', telefono, inv));
  });

  (evento.profesoresEmails || []).forEach(function (email) {
    var p = profesores.find(function (x) { return x.email === email; });
    if (!p) return;
    var clave = claveInvitadoEvento('profesor', email);
    var inv = invitaciones[clave] || {};
    var telefono = ((perfiles[email] && perfiles[email].telefono) || '').replace(/\D/g, '');
    filasInvitados.push(filaInvitadoEvento(idx, clave, p.nombre, 'Profesor', telefono, inv));
  });

  var totalInvitados = filasInvitados.length;
  var totalEnviados = 0, totalConfirmados = 0;
  Object.keys(invitaciones).forEach(function (k) {
    if (invitaciones[k].enviada) totalEnviados++;
    if (invitaciones[k].confirmado) totalConfirmados++;
  });

  var profesorResp = evento.profesorResponsable ? (profesores.find(function (p) { return p.email === evento.profesorResponsable; }) || {}).nombre : null;

  var selectorEstado = evento.estado === 'programado'
    ? '<select class="sel-estado-evento" data-idx="' + idx + '" style="font-size:12px; padding:5px 8px; border-radius:6px; border:1.5px solid var(--azul-oscuro); color:var(--azul-oscuro);">' +
      ESTADOS_EVENTO.map(function (s) { return '<option value="' + s + '"' + (s === evento.estado ? ' selected' : '') + '>' + ETIQUETA_ESTADO_EVENTO[s] + '</option>'; }).join('') + '</select>'
    : '<span class="chip-rol" style="background:' + COLOR_ESTADO_EVENTO[evento.estado] + '; color:#fff;">' + ETIQUETA_ESTADO_EVENTO[evento.estado] + '</span>';

  var botonesGestion =
    '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' +
    selectorEstado +
    '<button class="btn-editar-evento" data-idx="' + idx + '" style="font-size:12px; padding:5px 10px; border-radius:6px; border:1.5px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer; font-family:var(--font-ui);">Editar</button>' +
    '<button class="btn-eliminar-evento" data-idx="' + idx + '" style="font-size:12px; padding:5px 10px; border-radius:6px; border:1.5px solid var(--rojo); background:#fff; color:var(--rojo); cursor:pointer; font-family:var(--font-ui);">Eliminar</button>' +
    '</div>';

  return '' +
    '<div class="panel" style="margin-bottom:14px; border-left:4px solid ' + COLOR_ESTADO_EVENTO[evento.estado] + ';">' +
    '<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">' +
    '<div>' +
    '<span class="chip-rol" style="background:var(--beige); color:var(--texto); margin-bottom:6px; display:inline-block;">' + ETIQUETA_TIPO_EVENTO[evento.tipo] + '</span>' +
    '<h3 style="margin:4px 0 2px;">' + evento.titulo + '</h3>' +
    '<p style="margin:0; font-size:12.5px; color:var(--muted); text-transform:capitalize;">' + fechaLegibleEvento(evento.fecha) + (evento.hora ? ' · ' + horaLegibleEvento(evento.hora) : '') + (evento.lugar ? ' · ' + evento.lugar : '') + '</p>' +
    (profesorResp ? '<p style="margin:2px 0 0; font-size:12px; color:var(--muted);">Responsable: ' + profesorResp + '</p>' : '') +
    '</div>' +
    botonesGestion +
    '</div>' +
    '<p style="font-size:12px; color:var(--muted); margin:10px 0 8px;">' + totalEnviados + ' de ' + totalInvitados + ' invitaciones enviadas · ' + totalConfirmados + ' confirmadas</p>' +
    (filasInvitados.length === 0 ? '<p style="font-size:12.5px; color:var(--muted);">No se convocó a nadie todavía.</p>' :
     '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Tipo</th><th>Invitación</th><th>Confirmó</th><th></th></tr></thead><tbody>' + filasInvitados.join('') + '</tbody></table></div>') +
    '</div>';
}

function filaInvitadoEvento(idxEvento, clave, nombre, tipoPersona, telefono, inv) {
  var chipEnvio = inv.enviada
    ? '<span class="chip-rol" style="background:var(--verde); color:#fff;">Invitado' + (inv.fechaEnvio ? ' el ' + inv.fechaEnvio : '') + '</span>'
    : '<span class="chip-rol" style="background:var(--naranja); color:#fff;">Sin enviar</span>';
  var checkboxConfirmado = '<input type="checkbox" class="chk-confirmado-evento" data-idx-evento="' + idxEvento + '" data-clave="' + clave + '"' + (inv.confirmado ? ' checked' : '') + (inv.enviada ? '' : ' disabled') + ' />';
  var botonWhatsapp = telefono
    ? '<button class="btn-whatsapp-evento" data-idx-evento="' + idxEvento + '" data-clave="' + clave + '" data-telefono="' + telefono + '" data-nombre="' + nombre.replace(/"/g, '&quot;') + '" style="font-size:11px; background:#25D366; color:#fff; border:none; border-radius:6px; padding:5px 9px; cursor:pointer;">WhatsApp</button>'
    : '<span style="font-size:11px; color:var(--muted); font-style:italic;">sin teléfono</span>';
  return '<tr><td>' + nombre + '</td><td>' + tipoPersona + '</td><td>' + chipEnvio + '</td><td>' + checkboxConfirmado + '</td><td>' + botonWhatsapp + '</td></tr>';
}

function activarLogicaEventos() {
  var btnCrear = document.getElementById('btn-crear-evento');
  if (btnCrear) {
    btnCrear.addEventListener('click', function () {
      var tipo = document.getElementById('ev-tipo').value;
      var titulo = document.getElementById('ev-titulo').value.trim();
      var fecha = document.getElementById('ev-fecha').value;
      var hora = document.getElementById('ev-hora').value;
      var lugar = document.getElementById('ev-lugar').value.trim();
      var profesorResponsable = document.getElementById('ev-profesor-responsable').value;
      var notas = document.getElementById('ev-notas').value.trim();
      if (!titulo || !fecha) { alert('El título y la fecha son obligatorios.'); return; }

      var estudiantesIdx = Array.prototype.slice.call(document.querySelectorAll('.chk-ev-estudiante:checked')).map(function (c) { return Number(c.value); });
      var profesoresEmails = Array.prototype.slice.call(document.querySelectorAll('.chk-ev-profesor:checked')).map(function (c) { return c.value; });
      if (estudiantesIdx.length === 0 && profesoresEmails.length === 0) { alert('Convocá al menos a un estudiante o profesor.'); return; }

      var eventos = cargarEventos();
      eventos.push({
        tipo: tipo, titulo: titulo, fecha: fecha, hora: hora, lugar: lugar,
        profesorResponsable: profesorResponsable, notas: notas,
        estudiantesIdx: estudiantesIdx, profesoresEmails: profesoresEmails,
        estado: 'programado', invitaciones: {}
      });
      guardarEventos(eventos);

      document.getElementById('msj-evento-creado').style.display = 'block';
      setTimeout(function () { renderContenido('eventos'); }, 700);
    });
  }

  document.querySelectorAll('.sel-estado-evento').forEach(function (sel) {
    sel.addEventListener('change', function () {
      var idx = Number(sel.getAttribute('data-idx'));
      var eventos = cargarEventos();
      eventos[idx].estado = sel.value;
      guardarEventos(eventos);
      renderContenido('eventos');
    });
  });

  document.querySelectorAll('.btn-whatsapp-evento').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idxEvento = Number(btn.getAttribute('data-idx-evento'));
      var clave = btn.getAttribute('data-clave');
      var telefono = btn.getAttribute('data-telefono');
      var nombreDestino = btn.getAttribute('data-nombre');
      var eventos = cargarEventos();
      var evento = eventos[idxEvento];
      var mensaje = mensajeConvocatoriaEvento(evento, nombreDestino);
      window.open('https://wa.me/' + telefono + '?text=' + encodeURIComponent(mensaje), '_blank');

      if (!evento.invitaciones) evento.invitaciones = {};
      evento.invitaciones[clave] = Object.assign({}, evento.invitaciones[clave], { enviada: true, fechaEnvio: new Date().toISOString().slice(0, 10) });
      guardarEventos(eventos);
      renderContenido('eventos');
    });
  });

  document.querySelectorAll('.chk-confirmado-evento').forEach(function (chk) {
    chk.addEventListener('change', function () {
      var idxEvento = Number(chk.getAttribute('data-idx-evento'));
      var clave = chk.getAttribute('data-clave');
      var eventos = cargarEventos();
      var evento = eventos[idxEvento];
      if (!evento.invitaciones) evento.invitaciones = {};
      if (!evento.invitaciones[clave]) evento.invitaciones[clave] = {};
      evento.invitaciones[clave].confirmado = chk.checked;
      guardarEventos(eventos);
    });
  });

  var modalEditar = document.getElementById('modal-editar-evento');

  document.querySelectorAll('.btn-editar-evento').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = Number(btn.getAttribute('data-idx'));
      var evento = cargarEventos()[idx];
      if (!evento || !modalEditar) return;

      modalEditar.setAttribute('data-idx', idx);
      document.getElementById('ee-tipo').value = evento.tipo || 'Ensayo';
      document.getElementById('ee-titulo').value = evento.titulo || '';
      document.getElementById('ee-fecha').value = evento.fecha || '';
      document.getElementById('ee-hora').value = evento.hora || '';
      document.getElementById('ee-lugar').value = evento.lugar || '';
      document.getElementById('ee-profesor-responsable').value = evento.profesorResponsable || '';
      document.getElementById('ee-notas').value = evento.notas || '';
      modalEditar.style.display = 'flex';
    });
  });

  var btnCancelarEditar = document.getElementById('btn-cancelar-editar-evento');
  if (btnCancelarEditar) btnCancelarEditar.addEventListener('click', function () { modalEditar.style.display = 'none'; });

  var btnGuardarEditar = document.getElementById('btn-guardar-editar-evento');
  if (btnGuardarEditar) {
    btnGuardarEditar.addEventListener('click', function () {
      var idx = Number(modalEditar.getAttribute('data-idx'));
      var titulo = document.getElementById('ee-titulo').value.trim();
      var fecha = document.getElementById('ee-fecha').value;
      if (!titulo || !fecha) { alert('El título y la fecha son obligatorios.'); return; }

      var eventos = cargarEventos();
      var evento = eventos[idx];
      evento.tipo = document.getElementById('ee-tipo').value;
      evento.titulo = titulo;
      evento.fecha = fecha;
      evento.hora = document.getElementById('ee-hora').value;
      evento.lugar = document.getElementById('ee-lugar').value.trim();
      evento.profesorResponsable = document.getElementById('ee-profesor-responsable').value;
      evento.notas = document.getElementById('ee-notas').value.trim();
      guardarEventos(eventos);

      modalEditar.style.display = 'none';
      renderContenido('eventos');
    });
  }

  document.querySelectorAll('.btn-eliminar-evento').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = Number(btn.getAttribute('data-idx'));
      var eventos = cargarEventos();
      var evento = eventos[idx];
      if (!evento) return;
      if (!confirm('¿Eliminar el evento "' + evento.titulo + '"? Esta acción no se puede deshacer.')) return;

      eventos.splice(idx, 1);
      guardarEventos(eventos);
      renderContenido('eventos');
    });
  });
}

// ---- Donut SVG (ingresos como % del movimiento total del período).
function donutProContab(pctIngreso) {
  var pct = Math.max(0, Math.min(100, Math.round(pctIngreso)));
  var r = 52, c = 2 * Math.PI * r;
  var dash = (pct / 100) * c;
  return '' +
    '<div class="donut-pro-contab"><svg viewBox="0 0 130 130">' +
    '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--linea)" stroke-width="13"/>' +
    '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--verde)" stroke-width="13" stroke-linecap="round" ' +
    'stroke-dasharray="' + dash.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 65 65)"/>' +
    '</svg><div class="center"><span class="pct">' + pct + '%</span><span class="pct-lbl">Ingresos</span></div></div>';
}

// Combina categorías de gastos (texto libre en categoria) y compras en un solo
// mapa "categoría → total", igual que el archivo de referencia (que suma
// gastos + compras + nómina agregada para armar las barras de egresos).
function categoriasEgresoContable(gastos, compras, totalNomina) {
  var mapa = {};
  gastos.forEach(function (r) { mapa[r.categoria] = (mapa[r.categoria] || 0) + Number(r.valor || 0); });
  compras.forEach(function (r) { mapa[r.categoria] = (mapa[r.categoria] || 0) + Number(r.valorTotal || 0); });
  if (totalNomina > 0) mapa['Nómina'] = (mapa['Nómina'] || 0) + totalNomina;
  return mapa;
}

function categoriasIngresoContable(ingresos) {
  var mapa = {};
  ingresos.forEach(function (r) { mapa[r.categoria] = (mapa[r.categoria] || 0) + Number(r.valor || 0); });
  return mapa;
}

function ordenarCategorias(mapa) {
  return Object.keys(mapa).map(function (k) { return [k, mapa[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
}

function tablaMovimientosContable(movimientos) {
  if (movimientos.length === 0) return '<p style="font-size:13px; color:var(--muted);">No hay movimientos registrados.</p>';
  var filas = movimientos.map(function (m) {
    return filaTablaContable([m.fecha || '—', m.modulo, m.concepto,
      '<span class="chip-rol">' + (m.estado === 'pagado' ? 'Pagado' : 'Pendiente') + '</span>',
      '<strong style="color:' + (m.tipo === 'in' ? 'var(--verde)' : 'var(--rojo)') + ';">' + (m.tipo === 'in' ? '+ ' : '− ') + formatearCOPContable(m.valor) + '</strong>']);
  }).join('');
  return '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Fecha</th><th>Módulo</th><th>Concepto</th><th>Estado</th><th>Valor</th></tr></thead><tbody>' + filas + '</tbody></table></div>';
}

// ---- Resumen general — visión global desde el inicio hasta hoy, con
// desglose por categoría y últimos movimientos (tomado como referencia
// de renderDashboard() del proyecto Neuro Tone, adaptado sin gráficos SVG).
function panelResumenGeneral() {
  var ingresos = cargarIngresos(), gastos = cargarGastos(), compras = cargarCompras(), nomina = cargarNomina();
  var totalIngresos = ingresos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalGastos = gastos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalCompras = compras.reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
  var totalNomina = nomina.reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
  var egresosTotal = totalGastos + totalCompras + totalNomina;
  var balance = totalIngresos - egresosTotal;

  var pendientes = [].concat(
    gastos.filter(function (r) { return r.estado === 'pendiente'; }).map(function (r) { return Number(r.valor || 0); }),
    compras.filter(function (r) { return r.estado === 'pendiente'; }).map(function (r) { return Number(r.valorTotal || 0); }),
    nomina.filter(function (r) { return r.estado === 'pendiente'; }).map(function (r) { return Number(r.neto || 0); })
  );
  var totalPendiente = pendientes.reduce(function (a, b) { return a + b; }, 0);

  var catIngreso = ordenarCategorias(categoriasIngresoContable(ingresos)).slice(0, 6);
  var catEgreso = ordenarCategorias(categoriasEgresoContable(gastos, compras, totalNomina)).slice(0, 6);
  var maxIn = Math.max(1, catIngreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));
  var maxOut = Math.max(1, catEgreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));

  var movimientos = [].concat(
    ingresos.map(function (r) { return { fecha: r.fecha, modulo: 'Ingreso', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'in' }; }),
    gastos.map(function (r) { return { fecha: r.fecha, modulo: 'Gasto', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'out' }; }),
    compras.map(function (r) { return { fecha: r.fecha, modulo: 'Compra', concepto: r.articulo, estado: r.estado, valor: Number(r.valorTotal || 0), tipo: 'out' }; }),
    nomina.map(function (r) { return { fecha: r.mes, modulo: 'Nómina', concepto: r.empleado, estado: r.estado, valor: Number(r.neto || 0), tipo: 'out' }; })
  ).sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); }).slice(0, 8);

  var pctIngreso = (totalIngresos + egresosTotal) > 0 ? (totalIngresos / (totalIngresos + egresosTotal)) * 100 : 0;

  return '' +
    '<div class="kpi-grid-contab">' +
      tarjetaKPIModerna('Balance general', balance, balance >= 0 ? 'hero' : 'hero neg', '⚖️', 'Ingresos − egresos totales') +
      tarjetaKPIModerna('Total ingresos', totalIngresos, 'pos', '💰', ingresos.length + ' registro(s)') +

// ---- Balance mensual — se elige un mes y se recalcula todo para ese
// período (tomado como referencia de renderBalanceMensual() de Neuro Tone).
var mesBalanceContable = '';

function cambiarMesBalanceContable(valor) {
  mesBalanceContable = valor;
  renderContenido('contabilidad');
}

function panelBalanceMensual() {
  var selector =
    '<div class="panel"><h2>Balance mensual</h2>' +
    '<div class="campo" style="max-width:220px;"><label>Selecciona un mes</label>' +
    '<input type="month" id="bal-mes" value="' + mesBalanceContable + '" onchange="cambiarMesBalanceContable(this.value)" /></div>' +
    '</div>';

  if (!mesBalanceContable) {
    return selector + '<p style="font-size:13px; color:var(--muted);">Elegí un mes para ver el balance financiero completo de ese período.</p>';
  }

  var ym = mesBalanceContable;
  var ingresos = cargarIngresos().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; });
  var gastos = cargarGastos().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; });
  var compras = cargarCompras().filter(function (r) { return r.fecha && r.fecha.slice(0, 7) === ym; });
  var nomina = cargarNomina().filter(function (r) { return r.mes === ym; });

  var totalIngresos = ingresos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalGastos = gastos.reduce(function (s, r) { return s + Number(r.valor || 0); }, 0);
  var totalCompras = compras.reduce(function (s, r) { return s + Number(r.valorTotal || 0); }, 0);
  var totalNomina = nomina.reduce(function (s, r) { return s + Number(r.neto || 0); }, 0);
  var balanceMes = totalIngresos - totalGastos - totalCompras - totalNomina;

  var catIngreso = ordenarCategorias(categoriasIngresoContable(ingresos));
  var catEgreso = ordenarCategorias(categoriasEgresoContable(gastos, compras, totalNomina));
  var maxIn = Math.max(1, catIngreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));
  var maxOut = Math.max(1, catEgreso.reduce(function (m, e) { return Math.max(m, e[1]); }, 0));

  var movimientos = [].concat(
    ingresos.map(function (r) { return { fecha: r.fecha, modulo: 'Ingreso', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'in' }; }),
    gastos.map(function (r) { return { fecha: r.fecha, modulo: 'Gasto', concepto: r.concepto, estado: r.estado, valor: Number(r.valor || 0), tipo: 'out' }; }),
    compras.map(function (r) { return { fecha: r.fecha, modulo: 'Compra', concepto: r.articulo, estado: r.estado, valor: Number(r.valorTotal || 0), tipo: 'out' }; }),
    nomina.map(function (r) { return { fecha: r.mes + '-01', modulo: 'Nómina', concepto: r.empleado, estado: r.estado, valor: Number(r.neto || 0), tipo: 'out' }; })
  ).sort(function (a, b) { return (a.fecha || '').localeCompare(b.fecha || ''); });

  var egresosMes = totalGastos + totalCompras + totalNomina;
  var pctIngresoMes = (totalIngresos + egresosMes) > 0 ? (totalIngresos / (totalIngresos + egresosMes)) * 100 : 0;

  return '' +
    selector +
    '<p style="font-size:12px; color:var(--muted); margin:-10px 0 16px;">Mostrando el balance financiero de ' + ym + '.</p>' +
    '<div class="kpi-grid-contab">' +
      tarjetaKPIModerna('Balance del mes', balanceMes, balanceMes >= 0 ? 'hero' : 'hero neg', '⚖️', ym) +
      tarjetaKPIModerna('Ingresos del mes', totalIngresos, 'pos', '💰', ingresos.length + ' registro(s)') +
      tarjetaKPIModerna('Gastos del mes', totalGastos, 'neg', '📉', gastos.length + ' registro(s)') +
      tarjetaKPIModerna('Compras del mes', totalCompras, 'warn', '🛒', compras.length + ' registro(s)') +
      tarjetaKPIModerna('Nómina del mes', totalNomina, 'neu', '👥', nomina.length + ' registro(s)') +
    '</div>' +
    '<div class="dash-grid-3" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:18px;">' +
      '<div class="chart-card-contab"><h3>Ingresos vs. egresos</h3><p class="sub">Participación del mes</p>' +
      donutProContab(pctIngresoMes) +
      '<div class="legend-row-contab">' +
        '<span class="li"><span class="sw" style="background:var(--verde);"></span>Ingresos · ' + formatearCOPContable(totalIngresos) + '</span>' +
        '<span class="li"><span class="sw" style="background:var(--linea);"></span>Egresos · ' + formatearCOPContable(egresosMes) + '</span>' +
      '</div></div>' +
      '<div class="chart-card-contab"><h3>Ingresos por categoría</h3><p class="sub">' + ym + '</p>' +
      (catIngreso.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Sin ingresos este mes.</p>' :
       catIngreso.map(function (e) { return barraCategoriaContable(e[0], e[1], maxIn, 'var(--verde)'); }).join('')) +
      '</div>' +
      '<div class="chart-card-contab"><h3>Egresos por categoría</h3><p class="sub">' + ym + '</p>' +
      (catEgreso.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Sin egresos este mes.</p>' :
       catEgreso.map(function (e) { return barraCategoriaContable(e[0], e[1], maxOut, 'var(--rojo)'); }).join('')) +
      '</div>' +
    '</div>' +
    '<div class="panel"><h2>Movimientos de ' + ym + '</h2>' + tablaMovimientosContable(movimientos) + '</div>';
}

function renderContabilidad(sesion) {
  var esAdmin = sesion.rol === 'ADMINISTRADOR';
  var pestañas = ['ingresos', 'gastos', 'compras', 'nomina'];
  if (esAdmin) pestañas.push('resumen', 'balance');
  var etiquetaPestaña = { ingresos: 'Ingresos', gastos: 'Gastos', compras: 'Compras', nomina: 'Nómina', resumen: 'Resumen general', balance: 'Balance mensual' };
  if (!esAdmin && (tabContabilidadActiva === 'resumen' || tabContabilidadActiva === 'balance')) tabContabilidadActiva = 'ingresos';

  var botonesPestañas = pestañas.map(function (p) {
    var activa = p === tabContabilidadActiva;
    return '<button type="button" class="contab-tab' + (activa ? ' active' : '') + '" onclick="cambiarTabContabilidad(\'' + p + '\')">' +
      '<span class="dot"></span>' + etiquetaPestaña[p] + '</button>';
  }).join('');

  var contenido = '';
  if (tabContabilidadActiva === 'ingresos') contenido = panelIngresos(esAdmin);
  else if (tabContabilidadActiva === 'gastos') contenido = panelGastos(esAdmin);
  else if (tabContabilidadActiva === 'compras') contenido = panelCompras(esAdmin);
  else if (tabContabilidadActiva === 'nomina') contenido = panelNomina(esAdmin);
  else if (tabContabilidadActiva === 'resumen' && esAdmin) contenido = panelResumenGeneral();
  else if (tabContabilidadActiva === 'balance' && esAdmin) contenido = panelBalanceMensual();

  return '' +
    heroContabilidad() +
    (esAdmin ? '' : '<p style="font-size:12px; color:var(--muted); margin:0 0 16px;">Podés registrar ingresos, gastos, compras y nómina. El resumen financiero completo lo ve solo Administración.</p>') +
    '<div class="contab-tabs">' + botonesPestañas + '</div>' +
    contenido;
}

function cargarMensajes() {
  var g = localStorage.getItem('jacquin_demo_mensajes');
  return g ? JSON.parse(g) : [];
}
function guardarMensajes(lista) { localStorage.setItem('jacquin_demo_mensajes', JSON.stringify(lista)); }

var tabComunicacionActiva = 'bandeja';
function cambiarTabComunicacion(tab) {
  tabComunicacionActiva = tab;
  renderContenido('comunicacion');
}
var filtroBandejaComunicacion = '';
var destinatariosSeleccionadosComunicacion = [];

function mensajesRecibidos(sesion) {
  if (!sesion) return [];
  return cargarMensajes().filter(function (m) {
    return m.de !== sesion.email && (m.paraTodos || (m.para || []).indexOf(sesion.email) !== -1);
  });
}
function mensajesEnviados(sesion) {
  if (!sesion) return [];
  return cargarMensajes().filter(function (m) { return m.de === sesion.email; });
}
function mensajesNoLeidos(sesion) {
  return mensajesRecibidos(sesion).filter(function (m) { return (m.leidoPor || []).indexOf(sesion.email) === -1; });
}

      'font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-ui);">' + etiquetas[p] + badge + '</button>';

    '<p style="font-size:12px; color:var(--muted); margin:0 0 16px;">Canal interno de mensajes entre Administración, Dirección, Secretaría y Profesores.</p>' +

function panelBandejaComunicacion(sesion) {
  var usuarios = cargarUsuarios();
  function nombrePorEmail(email) {
    var u = usuarios.find(function (x) { return x.email === email; });
    return u ? u.nombre : email;
  }
  var mensajes = mensajesRecibidos(sesion).slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
  if (filtroBandejaComunicacion) {
    var termino = filtroBandejaComunicacion.toLowerCase();
    mensajes = mensajes.filter(function (m) {
      return (m.asunto || '').toLowerCase().indexOf(termino) !== -1 || nombrePorEmail(m.de).toLowerCase().indexOf(termino) !== -1;
    });
  }
  var filas = mensajes.map(function (m) {
    var leido = (m.leidoPor || []).indexOf(sesion.email) !== -1;
    var urgente = m.prioridad === 'urgente';
    return '<div class="mensaje-item" data-id="' + m.id + '" style="border:1px solid ' + (urgente ? 'var(--rojo)' : '#e2e5ea') + '; border-left:4px solid ' + (urgente ? 'var(--rojo)' : (leido ? '#ddd' : 'var(--azul-oscuro)')) + '; border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; background:' + (leido ? '#fff' : '#f2f6fc') + ';">' +
      '<div style="display:flex; justify-content:space-between; gap:10px; align-items:center;">' +
      '<div style="font-weight:' + (leido ? '600' : '700') + '; font-size:13px;">' + nombrePorEmail(m.de) + (m.paraTodos ? ' <span style="font-size:10.5px; color:var(--muted); font-weight:400;">(a todo el personal)</span>' : '') + '</div>' +
      '<div style="font-size:11px; color:var(--muted); white-space:nowrap;">' + m.fecha + '</div>' +
      '</div>' +
      '<div style="font-size:13px; margin-top:3px;">' + (urgente ? '<span style="color:var(--rojo); font-weight:700;">URGENTE — </span>' : '') + m.asunto + '</div>' +
      '<div class="mensaje-cuerpo" style="display:none; font-size:12.5px; color:var(--texto); margin-top:8px; white-space:pre-wrap; border-top:1px solid #eee; padding-top:8px;">' + m.cuerpo +
      '<div style="margin-top:8px;"><button class="btn-responder-mensaje" data-de="' + m.de + '" data-asunto="' + String(m.asunto).replace(/"/g, '&quot;') + '" style="font-size:11.5px; padding:4px 10px; border-radius:6px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer;">Responder</button></div>' +
      '</div>' +
      '</div>';
  }).join('');

  return '<div class="panel">' +
    '<input id="buscar-mensajes" type="text" placeholder="Buscar por remitente o asunto..." value="' + filtroBandejaComunicacion + '" style="margin-bottom:14px;" />' +
    (mensajes.length ? filas : '<p style="font-size:13px; color:var(--muted);">No hay mensajes en tu bandeja.</p>') +
    '</div>';
}

function panelEnviadosComunicacion(sesion) {
  var usuarios = cargarUsuarios();
  function nombrePorEmail(email) {
    var u = usuarios.find(function (x) { return x.email === email; });
    return u ? u.nombre : email;
  }
  var mensajes = mensajesEnviados(sesion).slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
  var filas = mensajes.map(function (m) {
    var destinatarios = m.paraTodos ? 'Todo el personal' : (m.para || []).map(nombrePorEmail).join(', ');
    var vistoPor = (m.leidoPor || []).length;
    var totalDestinatarios = m.paraTodos ? (usuarios.length - 1) : (m.para || []).length;
    return '<tr><td>' + m.asunto + '</td><td>' + destinatarios + '</td><td>' + m.fecha + '</td>' +
      '<td>' + (m.prioridad === 'urgente' ? '<span style="color:var(--rojo); font-weight:600;">Urgente</span>' : 'Normal') + '</td>' +
      '<td>' + vistoPor + ' de ' + totalDestinatarios + '</td></tr>';
  }).join('');
  return '<div class="panel"><h2>Mensajes enviados (' + mensajes.length + ')</h2>' +
    (mensajes.length ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Asunto</th><th>Para</th><th>Fecha</th><th>Prioridad</th><th>Leído por</th></tr></thead><tbody>' + filas + '</tbody></table></div>'
      : '<p style="font-size:13px; color:var(--muted);">Todavía no enviaste mensajes.</p>') +

}

function activarLogicaComunicacion() {
  var sesion = sesionActual();

  var inputBuscar = document.getElementById('buscar-mensajes');
  if (inputBuscar) {
    inputBuscar.addEventListener('input', function () {
      filtroBandejaComunicacion = this.value;
      renderContenido('comunicacion');
    });
    inputBuscar.focus();
    inputBuscar.setSelectionRange(inputBuscar.value.length, inputBuscar.value.length);
  }

  document.querySelectorAll('.mensaje-item').forEach(function (item) {
    item.addEventListener('click', function (e) {
      if (e.target.classList && e.target.classList.contains('btn-responder-mensaje')) return;
      var id = Number(item.getAttribute('data-id'));
      var mensajes = cargarMensajes();
      var m = mensajes.find(function (x) { return x.id === id; });
      if (m) {
        m.leidoPor = m.leidoPor || [];
        if (m.leidoPor.indexOf(sesion.email) === -1) {
          m.leidoPor.push(sesion.email);
          guardarMensajes(mensajes);
          renderNavModulos('comunicacion');
        }
      }
      var cuerpo = item.querySelector('.mensaje-cuerpo');
      if (cuerpo) {
        var abierto = cuerpo.style.display === 'block';
        document.querySelectorAll('.mensaje-cuerpo').forEach(function (c) { c.style.display = 'none'; });
        cuerpo.style.display = abierto ? 'none' : 'block';
      }
    });
  });

  document.querySelectorAll('.btn-responder-mensaje').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      destinatariosSeleccionadosComunicacion = [btn.getAttribute('data-de')];
      tabComunicacionActiva = 'redactar';
      renderContenido('comunicacion');
      setTimeout(function () {
        var asuntoEl = document.getElementById('msg-asunto');
        if (asuntoEl) asuntoEl.value = 'Re: ' + btn.getAttribute('data-asunto');
      }, 0);
    });
  });

  var btnDocentes = document.getElementById('btn-seleccionar-docentes');
  if (btnDocentes) {
    btnDocentes.addEventListener('click', function () {
      var profesores = cargarUsuarios().filter(function (u) { return u.rol === 'PROFESOR' && u.email !== sesion.email; });
      destinatariosSeleccionadosComunicacion = profesores.map(function (p) { return p.email; });
      renderContenido('comunicacion');
    });
  }
  var btnPersonal = document.getElementById('btn-seleccionar-personal');
  if (btnPersonal) {
    btnPersonal.addEventListener('click', function () {
      destinatariosSeleccionadosComunicacion = cargarUsuarios().filter(function (u) { return u.email !== sesion.email; }).map(function (u) { return u.email; });
      renderContenido('comunicacion');
    });
  }
  var btnLimpiar = document.getElementById('btn-limpiar-destinatarios');
  if (btnLimpiar) {
    btnLimpiar.addEventListener('click', function () {
      destinatariosSeleccionadosComunicacion = [];
      renderContenido('comunicacion');
    });
  }

  document.querySelectorAll('.chk-destinatario-mensaje').forEach(function (chk) {
    chk.addEventListener('change', function () {
      var email = this.value;
      var idx = destinatariosSeleccionadosComunicacion.indexOf(email);
      if (this.checked && idx === -1) destinatariosSeleccionadosComunicacion.push(email);
      else if (!this.checked && idx !== -1) destinatariosSeleccionadosComunicacion.splice(idx, 1);
    });
  });

  var btnEnviar = document.getElementById('btn-enviar-mensaje');
  if (btnEnviar) {
    btnEnviar.addEventListener('click', function () {
      var asunto = document.getElementById('msg-asunto').value.trim();
      var cuerpo = document.getElementById('msg-cuerpo').value.trim();
      var prioridad = document.getElementById('msg-prioridad').value;
      var marcados = Array.prototype.map.call(document.querySelectorAll('.chk-destinatario-mensaje:checked'), function (c) { return c.value; });

      if (!asunto || !cuerpo) { alert('Asunto y mensaje son obligatorios.'); return; }
      if (marcados.length === 0) { alert('Elegí al menos un destinatario.'); return; }

      var totalOtros = cargarUsuarios().filter(function (u) { return u.email !== sesion.email; }).length;
      var paraTodos = marcados.length === totalOtros && totalOtros > 0;

      var mensajes = cargarMensajes();
      mensajes.push({
        id: Date.now(),
        de: sesion.email,
        para: marcados,
        paraTodos: paraTodos,
        asunto: asunto,
        cuerpo: cuerpo,
        prioridad: prioridad,
        fecha: new Date().toISOString().slice(0, 16).replace('T', ' '),
        leidoPor: []
      });
      guardarMensajes(mensajes);

      destinatariosSeleccionadosComunicacion = [];
      document.getElementById('msj-mensaje-enviado').style.display = 'block';
      tabComunicacionActiva = 'enviados';
      setTimeout(function () { renderContenido('comunicacion'); }, 600);
    });
  }
}

function renderUsuariosPermisos() {

    '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Módulo</th>' + encabezadoRoles + '</tr></thead><tbody>' + filasMatriz + '</tbody></table></div>' +

    '<p id="msj-permisos-guardados" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Permisos actualizados.</p>' +
    '</div>' +

    '<div class="panel"><h2>Usuarios y roles (' + usuarios.length + ')</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Para crear un usuario nuevo o cambiarle el rol, andá al módulo "Admin (tenant)". Acá solo se administran los permisos de cada rol.</p>' +
    (usuarios.length ? '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead><tbody>' +
      usuarios.map(function (u) { return '<tr><td>' + u.nombre + '</td><td>' + u.email + '</td><td><span class="chip-rol">' + (ETIQUETA_ROL_MENSAJE[u.rol] || u.rol) + '</span></td></tr>'; }).join('') +
      '</tbody></table></div>' : '<p style="font-size:13px; color:var(--muted);">Todavía no hay usuarios registrados.</p>') +
    '</div>';
}

function activarLogicaUsuariosPermisos() {
  var btnGuardar = document.getElementById('btn-guardar-permisos');
  if (btnGuardar) {
    btnGuardar.addEventListener('click', function () {
      var overrides = cargarPermisosOverride();
      ROLES_SISTEMA.forEach(function (rol) {
        if (rol === 'ADMINISTRADOR') return;

  if (btnRestablecer) {
    btnRestablecer.addEventListener('click', function () {
      if (!confirm('¿Restablecer los permisos de todos los roles a los valores originales del sistema?')) return;

      renderContenido('usuarios-permisos');
    });
  }
}

function activarLogicaAdmin() {
  var pass = document.getElementById('admin-pass');
  var btn = document.getElementById('btn-crear-usuario');

  function validarPassword() {
    var val = pass.value;
    var todasOk = true;
    POLITICA_PASSWORD.forEach(function (r) {
      var el = document.getElementById('regla-' + r.id);
      var ok = r.test(val);
      el.className = 'regla' + (ok ? ' ok' : '');
      if (!ok) todasOk = false;
    });
    btn.disabled = !todasOk;
  }

  // 'input' cubre tipeo normal; 'change'/'blur' cubren autocompletado o
  // contraseñas sugeridas por el navegador, que a veces no disparan 'input'.
  ['input', 'change', 'blur', 'keyup', 'paste'].forEach(function (evento) {
    pass.addEventListener(evento, validarPassword);
  });
  // Por si el campo ya viene con un valor al cargar la pantalla (autocompletado del navegador).
  setTimeout(validarPassword, 150);

  btn.addEventListener('click', function () {
    var nombre = document.getElementById('admin-nombre').value.trim();
    var email = document.getElementById('admin-email').value.trim();
    var rol = document.getElementById('admin-rol').value;
    if (!nombre || !email) return;
    var nacimiento = document.getElementById('admin-nacimiento').value;
    var usuarios = cargarUsuarios();
    usuarios.push({ nombre: nombre, email: email, rol: rol, nacimiento: nacimiento });
    guardarUsuarios(usuarios);
    document.getElementById('msj-creado').style.display = 'block';
    setTimeout(function () { renderContenido('admin'); }, 600);
  });

  function pintarPrevia() {
    var rol = document.getElementById('previa-rol').value;
    var visibles = modulosVisibles(rol);
    var html = MODULOS.filter(function (m) { return visibles.indexOf(m.key) !== -1; })
      .map(function (m) { return '<div>· ' + m.label + '</div>'; }).join('');
    document.getElementById('lista-previa').innerHTML = html;
  }
  document.getElementById('previa-rol').addEventListener('change', pintarPrevia);
  pintarPrevia();
}

function renderContenido(clave) {
  var sesion = sesionActual();
  var visibles = modulosVisibles(sesion.rol);
  if (visibles.indexOf(clave) === -1) clave = 'dashboard';
  var mod = MODULOS.find(function (m) { return m.key === clave; }) || MODULOS[0];

  // Ancho completo en todos los módulos salvo Inicio — Horarios también lo usa
  // para que la grilla semanal sea más fácil de ver y registrar.
  document.getElementById('contenido').classList.toggle('ancho-completo', mod.key !== 'dashboard');
  // El Dashboard usa su propio modo "bleed": sin padding/max-width en #contenido
  // para que la foto del hero llegue de borde a borde, pegada al menú de módulos.
  document.getElementById('contenido').classList.toggle('dashboard-bleed', mod.key === 'dashboard');

  if (mod.key === 'dashboard') {
    document.getElementById('contenido').innerHTML = renderDashboard(sesion);
    activarLogicaDashboard();
  } else if (mod.key === 'admin') {
    document.getElementById('contenido').innerHTML = renderAdmin();
    activarLogicaAdmin();
  } else if (mod.key === 'estudiantes') {
    document.getElementById('contenido').innerHTML = renderEstudiantes();
    activarLogicaEstudiantes();
    if (sesion.rol === 'PROFESOR') {
      document.getElementById('contenido').insertAdjacentHTML('afterbegin',
        '<p style="font-size:12px; color:var(--muted); margin-bottom:14px;">Vista acotada a tus estudiantes asignados (el filtrado real depende de datos que todavía no existen).</p>');
    }
  } else if (mod.key === 'matricula') {
    document.getElementById('contenido').innerHTML = renderMatricula(sesion);
    activarLogicaMatricula();
  } else if (mod.key === 'pagos') {
    document.getElementById('contenido').innerHTML = renderPagos();
    activarLogicaPagos();
  } else if (mod.key === 'horarios') {
    document.getElementById('contenido').innerHTML = renderHorarios(sesion);
    activarLogicaHorarios();
  } else if (mod.key === 'asistencia') {
    document.getElementById('contenido').innerHTML = renderAsistencia(sesion);
    activarLogicaAsistencia();
  } else if (mod.key === 'profesores') {
    document.getElementById('contenido').innerHTML = renderProfesores(sesion);
    activarLogicaProfesores();
  } else if (mod.key === 'cursos') {
    document.getElementById('contenido').innerHTML = renderCursos();
    activarLogicaCursos();
  } else if (mod.key === 'evaluacion') {
    document.getElementById('contenido').innerHTML = renderEvaluacion(sesion);
    activarLogicaEvaluacion();
  } else if (mod.key === 'eventos') {
    document.getElementById('contenido').innerHTML = renderEventos(sesion);
    activarLogicaEventos();
  } else if (mod.key === 'contabilidad') {
    document.getElementById('contenido').innerHTML = renderContabilidad(sesion);
    activarLogicaContabilidad();
  } else if (mod.key === 'inventario') {
    document.getElementById('contenido').innerHTML = renderInventario();
    activarLogicaInventario();
  } else if (mod.key === 'comunicacion') {
    document.getElementById('contenido').innerHTML = renderComunicacion(sesion);
    activarLogicaComunicacion();
  } else if (mod.key === 'usuarios-permisos') {
    document.getElementById('contenido').innerHTML = renderUsuariosPermisos();
    activarLogicaUsuariosPermisos();
  } else {
    var nota = '';
    if (mod.key === 'estudiantes' && sesion.rol === 'PROFESOR') nota = '<p style="margin-top:8px;">Acotado a los alumnos de tu salón (el filtrado real depende de datos que todavía no existen).</p>';
    document.getElementById('contenido').innerHTML = '<div class="placeholder"><h1>' + mod.label + '</h1><p>Pantalla en construcción — sin datos todavía.</p>' + nota + '</div>';
  }
}

function navegar() {
  var clave = location.hash.replace('#', '') || 'dashboard';
  renderNavModulos(clave);
  // Primer render con lo que ya haya en caché, para que la pantalla no
  // quede en blanco mientras se espera al backend.
  renderContenido(clave);
  // Estudiantes y Matrícula ya viven en el backend real (Supabase) — se
  // traen frescos en cada navegación para que no dependa de qué
  // computador/navegador se use. Los demás módulos se van sumando acá a
  // medida que se conectan. Inscripciones depende de que Alumnos y Planes
  // ya estén frescos (arma su caché combinando ambos), por eso va al final.
  refrescarCacheAlumnos()
    .then(function () { return refrescarCachePlanes(); })
    .then(function () { return refrescarCacheInscripciones(); })
    .then(function () {
      // Si el usuario ya cambió de pantalla mientras se esperaba la
      // respuesta, no pisar lo que se está viendo ahora.
      if ((location.hash.replace('#', '') || 'dashboard') === clave) {
        renderContenido(clave);
      }
    });
}

function mostrarApp() {
  var sesion = sesionActual();
  document.getElementById('vista-login').style.display = 'none';
  document.getElementById('vista-app').style.display = 'block';
  document.getElementById('quien-soy').textContent = sesion.email + ' · ' + sesion.rol;
  if (!location.hash) location.hash = '#dashboard';
  navegar();
}

function mostrarLogin() {
  document.getElementById('vista-app').style.display = 'none';
  document.getElementById('vista-login').style.display = 'flex';
  document.getElementById('in-email').value = '';
  document.getElementById('in-pass').value = '';
}

// ---- Conexión a la API real (backend en Vercel + Supabase) ----
// Si el HTML se abre como archivo local (file://), apunta al sitio
// publicado. Si el HTML se sirve DESDE ese mismo sitio, usa rutas
// relativas — así funciona sin importar el dominio.
var API_BASE = (location.protocol === 'file:') ? 'https://jacquin-sistema.vercel.app' : '';

async function apiFetch(ruta, opciones) {
  var headers = Object.assign({ 'Content-Type': 'application/json' }, (opciones && opciones.headers) || {});
  var sesion = sesionActual();
  if (sesion && sesion.token) headers['Authorization'] = 'Bearer ' + sesion.token;
  var respuesta = await fetch(API_BASE + ruta, Object.assign({}, opciones, { headers: headers }));
  var cuerpo = await respuesta.json().catch(function () { return null; });
  if (!respuesta.ok) {
    var mensaje = (cuerpo && cuerpo.error && cuerpo.error.mensaje) || ('Error de conexión (' + respuesta.status + ')');
    throw new Error(mensaje);
  }
  return cuerpo ? cuerpo.data : null;
}

document.getElementById('form-login').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('in-email').value.trim();
  var pass = document.getElementById('in-pass').value;
  var msjError = document.getElementById('msj-error');
  msjError.style.display = 'none';

  // Identidad ya está conectada al backend real — el resto de los
  // módulos por ahora sigue funcionando con datos locales, se van
  // conectando uno por uno.
  apiFetch('/api/identidad/login', { method: 'POST', body: JSON.stringify({ email: email, password: pass }) })
    .then(function (data) {
      sessionStorage.setItem('jacquin_demo_sesion', JSON.stringify({
        email: data.usuario.email, rol: data.usuario.rol, token: data.token, usuarioId: data.usuario.id
      }));
      mostrarApp();
    })
    .catch(function (err) {
      msjError.textContent = err.message || 'Email o contraseña incorrectos.';
      msjError.style.display = 'block';
    });
});

document.getElementById('btn-salir').addEventListener('click', function () {
  sessionStorage.removeItem('jacquin_demo_sesion');
  location.hash = '';
  mostrarLogin();
});

window.addEventListener('hashchange', navegar);

if (sesionActual()) { mostrarApp(); } else { mostrarLogin(); }
</script>
