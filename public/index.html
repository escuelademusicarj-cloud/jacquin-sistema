function activarLogicaPagos() {
  var btnTabCartera = document.getElementById('btn-tab-cartera');
  var btnTabPagos = document.getElementById('btn-tab-pagos');
  if (btnTabCartera) btnTabCartera.addEventListener('click', function () { vistaPagos = 'cartera'; renderContenido('pagos'); });
  if (btnTabPagos) btnTabPagos.addEventListener('click', function () { vistaPagos = 'pagos'; renderContenido('pagos'); });

  var btnCargo = document.getElementById('btn-crear-cargo');
  if (btnCargo) {
    btnCargo.addEventListener('click', function () {
      var valor = Number(document.getElementById('cg-valor').value);
      var descuento = Number(document.getElementById('cg-descuento').value || 0);
      var vencimiento = document.getElementById('cg-vencimiento').value;
      if (!valor || !vencimiento) { alert('Valor y fecha de vencimiento son obligatorios.'); return; }
      if (descuento > valor) { alert('El descuento no puede ser mayor al valor.'); return; }
      var cargos = cargarCargos();
      cargos.push({
        alumnoIdx: Number(document.getElementById('cg-alumno').value),
        concepto: document.getElementById('cg-concepto').value,
        valor: valor,
        descuento: descuento,
        saldo: valor - descuento,
        vencimiento: vencimiento,
        estado: 'pendiente'
      });
      guardarCargos(cargos);
      renderContenido('pagos');
    });
  }

  var btnPago = document.getElementById('btn-registrar-pago');
  if (btnPago) {
    btnPago.addEventListener('click', function () {
      var idx = Number(document.getElementById('pg-cargo').value);
      var valor = Number(document.getElementById('pg-valor').value);
      var medioPago = document.getElementById('pg-medio').value;
      var cargos = cargarCargos();
      var cargo = cargos[idx];
      if (!valor || valor <= 0) { alert('El valor del pago debe ser mayor a cero.'); return; }
      if (valor > cargo.saldo) { alert('El pago no puede ser mayor al saldo pendiente ($' + cargo.saldo + ').'); return; }
      cargo.saldo -= valor;
      cargo.estado = cargo.saldo === 0 ? 'pagado' : 'parcial';
      guardarCargos(cargos);

      var pagos = cargarPagosRegistrados();
      var fechaPagoCargo = new Date().toISOString().slice(0, 10);
      pagos.push({ alumnoIdx: cargo.alumnoIdx, concepto: cargo.concepto, valor: valor, fecha: fechaPagoCargo, medioPago: medioPago });
      guardarPagosRegistrados(pagos);

      // Misma conexión que en Matrícula: todo pago que se registra acá
      // aparece automáticamente como Ingreso en Contabilidad.
      var alumnoDelCargo = cargarAlumnos()[cargo.alumnoIdx];
      var ingresosDesdePago = cargarIngresos();
      ingresosDesdePago.push({
        fecha: fechaPagoCargo,
        concepto: cargo.concepto + (alumnoDelCargo ? ' — ' + alumnoDelCargo.nombres + ' ' + alumnoDelCargo.apellidos : ''),
        programa: alumnoDelCargo ? alumnoDelCargo.programa : '',
        categoria: CATEGORIAS_INGRESO.indexOf(cargo.concepto) !== -1 ? cargo.concepto : 'Otro',
        cliente: alumnoDelCargo ? alumnoDelCargo.nombres + ' ' + alumnoDelCargo.apellidos : '',
        metodo: medioPago,
        estado: 'pagado',
        valor: valor
      });
      guardarIngresos(ingresosDesdePago);

      document.getElementById('msj-pago').style.display = 'block';
      setTimeout(function () { renderContenido('pagos'); }, 700);
    });
  }

  document.querySelectorAll('.btn-comprobante').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = Number(btn.getAttribute('data-idx'));
      var pagos = cargarPagosRegistrados();
      var pago = pagos[idx];
      var alumnos = cargarAlumnos();
      var alumno = alumnos[pago.alumnoIdx];
      var contenedor = document.getElementById('comprobante-imprimir');
      contenedor.innerHTML = generarHtmlComprobante(pago, alumno);
      window.print();

      var telefono = alumno ? (alumno.telefono || '').replace(/\D/g, '') : '';
      if (telefono && confirm('¿Abrir WhatsApp para enviarle el resumen del pago? (el PDF hay que adjuntarlo a mano, WhatsApp no permite adjuntar archivos desde un enlace)')) {
        var msj = encodeURIComponent('Hola, te confirmamos el pago de ' + pago.concepto + ' por $' + pago.valor + ' del ' + pago.fecha + '. ¡Gracias! — Academia Musical Jacquin');
        window.open('https://wa.me/' + telefono + '?text=' + msj, '_blank');
      }
    });
  });
}

// Franjas reales de la academia (según la planilla de Jacquin): entre
// semana funciona en tardes, sábado en mañanas hasta el mediodía —
// se muestran alineadas en la misma fila porque ocupan el mismo lugar
// en el flujo semanal, aunque el horario de reloj sea distinto.
var FRANJAS = [
  { horaLunVie: '15:00', horaSabado: '09:00', etiquetaLunVie: '3:00 - 4:00 PM', etiquetaSabado: '9:00 - 10:00 AM' },
  { horaLunVie: '16:00', horaSabado: '10:00', etiquetaLunVie: '4:00 - 5:00 PM', etiquetaSabado: '10:00 - 11:00 AM' },
  { horaLunVie: '17:00', horaSabado: '11:00', etiquetaLunVie: '5:00 - 6:00 PM', etiquetaSabado: '11:00 AM - 12:00 M' }
];
var COLUMNAS_DIAS = [1, 2, 3, 4, 5, 6]; // lunes(1) a sábado(6), sin domingo — pedido explícito.

// Festivos oficiales de Colombia 2026 (fuente: festivos.com.co, consultado 2026-08-13).
// Nota de mantenimiento: esta lista es solo de 2026 — si el proyecto sigue
// vivo en 2027, hay que actualizarla (los festivos religiosos móviles cambian de fecha cada año).
var FESTIVOS_2026 = {
  '2026-01-01': 'Año Nuevo', '2026-01-12': 'Reyes Magos', '2026-03-23': 'Día de San José',
  '2026-04-02': 'Jueves Santo', '2026-04-03': 'Viernes Santo', '2026-05-01': 'Día del Trabajo',
  '2026-05-18': 'Ascensión de Jesús', '2026-06-08': 'Corpus Christi', '2026-06-15': 'Sagrado Corazón',
  '2026-06-29': 'San Pedro y San Pablo', '2026-07-13': 'Virgen de Chiquinquirá', '2026-07-20': 'Independencia de Colombia',
  '2026-08-07': 'Batalla de Boyacá', '2026-08-17': 'Asunción de la Virgen', '2026-10-12': 'Día de la Raza',
  '2026-11-02': 'Todos los Santos', '2026-11-16': 'Independencia de Cartagena', '2026-12-08': 'Inmaculada Concepción',
  '2026-12-25': 'Navidad'
};

var vistaHorarios = 'semana'; // 'semana' (reservas) o 'mensual' (calendario tipo Outlook)
var filtroProgramaHorario = 'General'; // 'General' o el nombre exacto de un programa
var mesCalendario = (function () { var hoy = new Date(); return { anio: hoy.getFullYear(), mes: hoy.getMonth() }; })();

// ---- Semana de la vista "Calendario de reservas" ----
// La grilla sigue siendo una plantilla semanal recurrente (mismas franjas
// lunes a sábado), pero ahora se puede navegar semana a semana con fechas
// reales, y el listado de estudiantes de cada clase se filtra según esa
// fecha: solo aparece quien ya estaba matriculado o agregado a esa clase
// en o antes de esa semana.
function lunesDeFecha(fechaStr) {
  var d = new Date(fechaStr + 'T00:00:00');
  var diaSemana = d.getDay(); // 0=domingo..6=sábado
  var offsetALunes = diaSemana === 0 ? -6 : (1 - diaSemana);
  d.setDate(d.getDate() + offsetALunes);
  return d.toISOString().slice(0, 10);
}
function sumarDiasFecha(fechaStr, dias) {
  var d = new Date(fechaStr + 'T00:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0, 10);
}
function formatearFechaCorta(fechaStr) {
  var d = new Date(fechaStr + 'T00:00:00');
  return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
}
var semanaHorarioSeleccionada = lunesDeFecha(new Date().toISOString().slice(0, 10));

function clasesDeCelda(clases, dia, hora) {
  return clases.map(function (c, i) { return { c: c, i: i }; }).filter(function (o) { return o.c.dia === dia && o.c.hora === hora; });
}

function formatearFecha(anio, mes, dia) {
  return anio + '-' + String(mes + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
}

function renderCalendarioMensual(sesion) {
  var alumnos = cargarAlumnos();
  var usuariosDemo = cargarUsuarios();
  var profesores = usuariosDemo.filter(function (u) { return u.rol === 'PROFESOR'; });
  var clases = cargarClases();
  var esProfesor = sesion.rol === 'PROFESOR';
  var clasesBase = esProfesor ? clases.filter(function (c) { return c.profesor === sesion.email; }) : clases;

  var anio = mesCalendario.anio, mes = mesCalendario.mes;
  var nombreMes = new Date(anio, mes, 1).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
  var primerDiaSemana = new Date(anio, mes, 1).getDay(); // 0=domingo
  var totalDias = new Date(anio, mes + 1, 0).getDate();
  var offset = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1; // que la grilla arranque en lunes

  var celdas = [];
  for (var i = 0; i < offset; i++) celdas.push(null);
  for (var d = 1; d <= totalDias; d++) celdas.push(d);
  while (celdas.length % 7 !== 0) celdas.push(null);

  var filasHtml = '';
  for (var f = 0; f < celdas.length / 7; f++) {
    filasHtml += '<tr>';
    for (var c = 0; c < 7; c++) {
      var dia = celdas[f * 7 + c];
      if (dia === null) { filasHtml += '<td style="background:#fafafa; border:1px solid #eee;"></td>'; continue; }
      var fechaStr = formatearFecha(anio, mes, dia);
      var diaSemanaJs = new Date(anio, mes, dia).getDay(); // 0=domingo..6=sábado
      var esFestivo = FESTIVOS_2026[fechaStr];
      var clasesDelDia = esFestivo ? [] : clasesBase.filter(function (cl) {
        var franja = FRANJAS.find(function (fr) { return (diaSemanaJs === 6 ? fr.horaSabado : fr.horaLunVie) === cl.hora; });
        return franja && cl.dia === diaSemanaJs;
      });
      var esHoy = fechaStr === formatearFecha(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

      filasHtml += '<td style="border:1px solid #eee; vertical-align:top; padding:4px; min-width:110px; height:90px; background:' + (esFestivo ? '#fdf3f0' : '#fff') + (esHoy ? '; box-shadow: inset 0 0 0 2px var(--azul-claro);' : '') + '">' +
        '<div style="font-size:11px; font-weight:700; color:' + (esFestivo ? 'var(--rojo)' : 'var(--texto)') + ';">' + dia + '</div>' +
        (esFestivo ? '<div style="font-size:9px; color:var(--rojo);">' + esFestivo + '</div>' : '') +
        clasesDelDia.slice(0, 3).map(function (cl) {
          var colorCl = colorPrograma(cl.programa);
          return '<div style="font-size:9px; background:' + colorCl + '1a; color:' + colorCl + '; font-weight:700; border-radius:3px; padding:2px 3px; margin-top:2px;">' + cl.programa + '</div>';
        }).join('') +
        (clasesDelDia.length > 3 ? '<div style="font-size:9px; color:var(--muted);">+' + (clasesDelDia.length - 3) + ' más</div>' : '') +
        '</td>';
    }
    filasHtml += '</tr>';
  }

  var encabezadoDias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(function (d) { return '<th style="font-size:11px; color:var(--muted); padding:4px;">' + d + '</th>'; }).join('');

  var htmlEnvio = esProfesor ? '' :
    '<div class="panel"><h2>Enviar calendario por correo</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Abre tu programa de correo con el calendario del mes ya redactado — todavía tenés que darle "Enviar" ahí, esto no manda el correo solo.</p>' +
    '<div class="campo"><label>Profesor</label><select id="mc-profesor-envio">' +
    profesores.map(function (p) { return '<option value="' + p.email + '">' + p.nombre + '</option>'; }).join('') +
    '</select></div>' +
    '<button class="btn-primario" id="btn-enviar-calendario">Preparar correo</button>' +
    '</div>';

  return '' +
    '<div class="panel">' +
    '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">' +
    '<button id="btn-mes-anterior" style="background:transparent; border:1px solid #ddd; border-radius:6px; width:30px; height:30px; cursor:pointer;">‹</button>' +
    '<h2 style="margin:0; text-transform:capitalize;">' + nombreMes + '</h2>' +
    '<button id="btn-mes-siguiente" style="background:transparent; border:1px solid #ddd; border-radius:6px; width:30px; height:30px; cursor:pointer;">›</button>' +
    '</div>' +
    '<div class="tabla-scroll"><table style="border-collapse:collapse; width:100%;"><thead><tr>' + encabezadoDias + '</tr></thead><tbody>' + filasHtml + '</tbody></table></div>' +
    '<div style="display:flex; gap:16px; margin-top:10px; font-size:11px; color:var(--muted);">' +
    '<span><span style="display:inline-block; width:10px; height:10px; background:#fdf3f0; border:1px solid var(--rojo); border-radius:2px; margin-right:4px;"></span>Festivo — sin clases</span>' +
    '<span><span style="display:inline-block; width:10px; height:10px; box-shadow: inset 0 0 0 2px var(--azul-claro); border-radius:2px; margin-right:4px;"></span>Hoy</span>' +
    '</div>' +
    '</div>' +
    htmlEnvio;
}

function renderHorarios(sesion) {
  var toggleHtml = '<div class="panel" style="padding:12px 20px; display:flex; gap:8px;">' +
    '<button id="btn-vista-semana" class="btn-primario" style="' + (vistaHorarios === 'semana' ? '' : 'background:transparent; color:var(--azul-oscuro); border:1px solid var(--azul-oscuro);') + '">Semana (reservas)</button>' +
    '<button id="btn-vista-mensual" class="btn-primario" style="' + (vistaHorarios === 'mensual' ? '' : 'background:transparent; color:var(--azul-oscuro); border:1px solid var(--azul-oscuro);') + '">Calendario del año</button>' +
    '</div>';

  if (vistaHorarios === 'mensual') return toggleHtml + renderCalendarioMensual(sesion);
  return toggleHtml + renderHorariosSemana(sesion);
}

function renderHorariosSemana(sesion) {
  var alumnos = cargarAlumnos();
  var usuariosDemo = cargarUsuarios();
  var profesores = usuariosDemo.filter(function (u) { return u.rol === 'PROFESOR'; });
  var clases = cargarClases();
  var esProfesor = sesion.rol === 'PROFESOR';
  // Respaldo para estudiantes viejos sin fecha registrada — el lunes de
  // esta semana (no una fecha fija del pasado), para que sigan viéndose
  // en la semana actual y en adelante, pero no en semanas ya pasadas.
  var hoyStrHorario = lunesDeFecha(new Date().toISOString().slice(0, 10));

  var filasGrilla = FRANJAS.map(function (franja) {
    var celdas = COLUMNAS_DIAS.map(function (dia) {
      var esSabado = dia === 6;
      var hora = esSabado ? franja.horaSabado : franja.horaLunVie;
      var fechaColumna = sumarDiasFecha(semanaHorarioSeleccionada, dia - 1);
      var ocupantes = clasesDeCelda(clases, dia, hora);
      if (esProfesor) ocupantes = ocupantes.filter(function (o) { return o.c.profesor === sesion.email; });
      if (filtroProgramaHorario !== 'General') ocupantes = ocupantes.filter(function (o) { return o.c.programa === filtroProgramaHorario; });

      var ocupada = ocupantes.length > 0;
      var colorBorde = ocupada ? 'var(--rojo)' : 'var(--verde)';

      var contenidoOcupantes = ocupantes.map(function (o) {
        // Un estudiante solo aparece desde la semana de su matrícula (o desde
        // que se lo agregó a esta clase) en adelante — nunca en semanas anteriores.
        var alumnosVisibles = (o.c.alumnos || []).filter(function (idx) {
          var al = alumnos[idx];
          if (!al) return false;
          var fechaAlta = al.fechaMatricula || hoyStrHorario;
          var fechaAsignado = (o.c.alumnosFechas && o.c.alumnosFechas[idx]) || hoyStrHorario;
          var fechaEfectiva = fechaAlta > fechaAsignado ? fechaAlta : fechaAsignado;
          return fechaEfectiva <= fechaColumna;
        });
        var nombresAlumnos = alumnosVisibles.map(function (idx) { return alumnos[idx].nombres + ' ' + alumnos[idx].apellidos.split(' ')[0]; });
        return '<div class="celda-clase" data-clase-idx="' + o.i + '" style="font-size:13px; text-align:left; background:#fff; border-radius:7px; padding:8px 10px; margin-bottom:6px; cursor:pointer;">' +
          '<div style="font-weight:600;">' + chipPrograma(o.c.programa) + '</div>' +
          (nombresAlumnos.length ? '<div style="color:var(--azul-oscuro);">' + nombresAlumnos.join(', ') + '</div>' : '<div style="color:var(--muted); font-style:italic;">sin estudiante todavía</div>') +
          '</div>';
      }).join('');

      var celdaBtn = (!esProfesor) ? '<button class="btn-celda-agendar" data-dia="' + dia + '" data-hora="' + hora + '" style="font-size:13px; background:transparent; border:1.5px dashed var(--azul-claro); border-radius:7px; width:100%; padding:8px; color:var(--azul-oscuro); cursor:pointer; margin-top:4px; font-weight:600;">+ Agendar</button>' : '';
      var etiquetaHoraCelda = '<div style="font-size:12px; font-weight:700; color:' + (ocupada ? 'var(--rojo)' : 'var(--verde)') + '; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.02em;">' + (esSabado ? franja.etiquetaSabado : franja.etiquetaLunVie) + '</div>';

      return '<td style="border-left:4px solid ' + colorBorde + '; background:#fff; padding:12px; vertical-align:top; min-width:200px; min-height:120px;">' + etiquetaHoraCelda + contenidoOcupantes + celdaBtn + '</td>';
    }).join('');

    var filaFranja = '<tr><td style="font-size:13px; color:var(--muted); font-weight:600; padding:12px; white-space:nowrap; vertical-align:top;">' + franja.etiquetaLunVie + '</td>' + celdas + '</tr>';
    var esUltima = FRANJAS.indexOf(franja) === FRANJAS.length - 1;
    var filaDivisoria = esUltima ? '' : '<tr><td colspan="' + (COLUMNAS_DIAS.length + 1) + '" style="padding:0; border:none;"><div style="height:1px; background:#e6e6e6; margin:2px 8px;"></div></td></tr>';
    return filaFranja + filaDivisoria;
  }).join('');

  var encabezado = '<tr><td></td>' + COLUMNAS_DIAS.map(function (d) {
    var fechaCol = sumarDiasFecha(semanaHorarioSeleccionada, d - 1);
    return '<td style="font-size:15px; font-weight:700; text-align:center; padding:10px; color:var(--azul-oscuro);">' + DIAS_SEMANA[d] +
      '<div style="font-size:12px; font-weight:500; color:var(--muted);">' + formatearFechaCorta(fechaCol) + '</div></td>';
  }).join('') + '</tr>';

  var selectorSemana = '<div style="display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;">' +
    '<button id="btn-semana-anterior" style="font-size:12px; padding:6px 12px; border-radius:8px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer;">‹ Semana anterior</button>' +
    '<div style="font-size:13px; font-weight:700; color:var(--azul-oscuro);">Semana del ' + formatearFechaCorta(semanaHorarioSeleccionada) + ' al ' + formatearFechaCorta(sumarDiasFecha(semanaHorarioSeleccionada, 5)) + '</div>' +
    '<button id="btn-semana-siguiente" style="font-size:12px; padding:6px 12px; border-radius:8px; border:1px solid var(--azul-oscuro); background:#fff; color:var(--azul-oscuro); cursor:pointer;">Semana siguiente ›</button>' +
    '<button id="btn-semana-hoy" style="font-size:12px; padding:6px 10px; border-radius:8px; border:none; background:transparent; color:var(--muted); cursor:pointer; text-decoration:underline;">Ir a esta semana</button>' +
    '</div>';

  var botonesFiltro = '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;">' +
    ['General'].concat(PROGRAMAS).map(function (p) {
      var activo = p === filtroProgramaHorario;
      var color = p === 'General' ? 'var(--azul-oscuro)' : colorPrograma(p);
      return '<button class="btn-filtro-programa" data-programa="' + p + '" style="font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; border:1.5px solid ' + (activo ? color : '#ddd') + '; background:' + (activo ? color : '#fff') + '; color:' + (activo ? '#fff' : 'var(--texto)') + ';">' + p + '</button>';
    }).join('') +
    '</div>';

  var grillaHtml =
    selectorSemana +
    botonesFiltro +
    '<div class="tabla-scroll"><table style="border-collapse:separate; border-spacing:8px; width:100%; table-layout:fixed;">' + encabezado + filasGrilla + '</table></div>' +
    '<div style="display:flex; gap:16px; margin-top:10px; font-size:11px; color:var(--muted);">' +
    '<span><span style="display:inline-block; width:10px; height:10px; background:var(--verde); border-radius:2px; margin-right:4px;"></span>Disponible</span>' +
    '<span><span style="display:inline-block; width:10px; height:10px; background:var(--rojo); border-radius:2px; margin-right:4px;"></span>Ocupado</span>' +
    '</div>';

  var htmlModalAgendar =
    '<div id="modal-agendar" style="display:none; position:fixed; inset:0; background:rgba(21,42,68,0.5); z-index:50; align-items:center; justify-content:center; padding:20px;">' +
    '<div style="background:#fff; border-radius:12px; padding:22px; width:100%; max-width:340px; max-height:85vh; overflow-y:auto;">' +
    '<h2 style="margin-top:0;">Agendar en esta franja</h2>' +
    '<p id="modal-franja-info" style="font-size:12px; color:var(--muted); margin-top:-8px;"></p>' +
    '<div class="campo"><label>Programa</label><select id="mo-programa">' +
    PROGRAMAS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="campo"><label>Tipo</label><select id="mo-tipo"><option value="individual">Individual</option><option value="grupal">Grupal</option></select></div>' +
    '<div class="campo"><label>Sala (opcional)</label><input id="mo-sala" type="text" /></div>' +
    '<div class="campo"><label>Estudiante (opcional, se puede asignar después)</label><select id="mo-alumno"><option value="">Sin asignar todavía</option>' +
    alumnos.map(function (a, i) { return '<option value="' + i + '">' + a.nombres + ' ' + a.apellidos + '</option>'; }).join('') +
    '</select></div>' +
    '<button class="btn-primario" id="btn-confirmar-agendar">Confirmar</button>' +
    '<button id="btn-cancelar-agendar" style="width:100%; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer;">Cancelar</button>' +
    '</div></div>';

  var htmlModalAsignar =
    '<div id="modal-asignar" style="display:none; position:fixed; inset:0; background:rgba(21,42,68,0.5); z-index:50; align-items:center; justify-content:center; padding:20px;">' +
    '<div style="background:#fff; border-radius:12px; padding:22px; width:100%; max-width:340px;">' +
    '<h2 style="margin-top:0;">Agregar estudiante</h2>' +
    '<p id="modal-asignar-info" style="font-size:12px; color:var(--muted); margin-top:-8px;"></p>' +
    '<div class="campo"><label>Nombre de estudiante</label><input id="as-nombre" type="text" /></div>' +
    '<div class="campo"><label>Programa</label><select id="as-programa">' +
    PROGRAMAS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="campo"><label>Observaciones (opcional)</label><input id="as-observaciones" type="text" /></div>' +
    '<button class="btn-primario" id="btn-confirmar-asignar">Agregar</button>' +
    '<button id="btn-cancelar-asignar" style="width:100%; margin-top:8px; background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer;">Cancelar</button>' +
    '</div></div>';

  return '' +
    '<div class="panel"><h2>Calendario de reservas' + (esProfesor ? ' — tus clases' : '') + '</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">' + (esProfesor ? 'Se actualiza automáticamente cuando Secretaría o Administración agenda o matricula.' : 'Hacé clic en "+ Agendar" para reservar, o en una clase existente para asignarle un estudiante.') + '</p>' +
    grillaHtml +
    '</div>' +
    htmlModalAgendar + htmlModalAsignar;
}

function activarLogicaHorarios() {
  document.querySelectorAll('.btn-filtro-programa').forEach(function (btn) {
    btn.addEventListener('click', function () {
      filtroProgramaHorario = btn.getAttribute('data-programa');
      renderContenido('horarios');
    });
  });

  var btnSemanaAnterior = document.getElementById('btn-semana-anterior');
  var btnSemanaSiguiente = document.getElementById('btn-semana-siguiente');
  var btnSemanaHoy = document.getElementById('btn-semana-hoy');
  if (btnSemanaAnterior) btnSemanaAnterior.addEventListener('click', function () {
    semanaHorarioSeleccionada = sumarDiasFecha(semanaHorarioSeleccionada, -7);
    renderContenido('horarios');
  });
  if (btnSemanaSiguiente) btnSemanaSiguiente.addEventListener('click', function () {
    semanaHorarioSeleccionada = sumarDiasFecha(semanaHorarioSeleccionada, 7);
    renderContenido('horarios');
  });
  if (btnSemanaHoy) btnSemanaHoy.addEventListener('click', function () {
    semanaHorarioSeleccionada = lunesDeFecha(new Date().toISOString().slice(0, 10));
    renderContenido('horarios');
  });

  var btnVistaSemana = document.getElementById('btn-vista-semana');
  var btnVistaMensual = document.getElementById('btn-vista-mensual');
  if (btnVistaSemana) btnVistaSemana.addEventListener('click', function () { vistaHorarios = 'semana'; renderContenido('horarios'); });
  if (btnVistaMensual) btnVistaMensual.addEventListener('click', function () { vistaHorarios = 'mensual'; renderContenido('horarios'); });

  var btnMesAnterior = document.getElementById('btn-mes-anterior');
  var btnMesSiguiente = document.getElementById('btn-mes-siguiente');
  if (btnMesAnterior) btnMesAnterior.addEventListener('click', function () {
    mesCalendario.mes--; if (mesCalendario.mes < 0) { mesCalendario.mes = 11; mesCalendario.anio--; }
    renderContenido('horarios');
  });
  if (btnMesSiguiente) btnMesSiguiente.addEventListener('click', function () {
    mesCalendario.mes++; if (mesCalendario.mes > 11) { mesCalendario.mes = 0; mesCalendario.anio++; }
    renderContenido('horarios');
  });

  var btnEnviar = document.getElementById('btn-enviar-calendario');
  if (btnEnviar) {
    btnEnviar.addEventListener('click', function () {
      var emailProfesor = document.getElementById('mc-profesor-envio').value;
      var usuariosDemo = cargarUsuarios();
      var prof = usuariosDemo.find(function (u) { return u.email === emailProfesor; });
      var clases = cargarClases().filter(function (c) { return c.profesor === emailProfesor; });
      var nombreMes = new Date(mesCalendario.anio, mesCalendario.mes, 1).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });

      var cuerpo = 'Hola ' + (prof ? prof.nombre : '') + ',%0D%0A%0D%0ATu horario de clases (' + nombreMes + '):%0D%0A%0D%0A';
      if (clases.length === 0) {
        cuerpo += 'Todavía no tenés clases asignadas.%0D%0A';
      } else {
        clases.forEach(function (c) {
          var etiqueta = c.dia === 6 ? (FRANJAS.find(function (fr) { return fr.horaSabado === c.hora; }) || {}).etiquetaSabado : (FRANJAS.find(function (fr) { return fr.horaLunVie === c.hora; }) || {}).etiquetaLunVie;
          cuerpo += '- ' + DIAS_SEMANA[c.dia] + ' ' + (etiqueta || c.hora) + ': ' + c.programa + '%0D%0A';
        });
      }
      cuerpo += '%0D%0ASaludos,%0D%0AAcademia Musical Jacquin';

      window.location.href = 'mailto:' + emailProfesor + '?subject=' + encodeURIComponent('Tu horario — ' + nombreMes) + '&body=' + cuerpo;
    });
  }

  var modalAgendar = document.getElementById('modal-agendar');
  var modalAsignar = document.getElementById('modal-asignar');

  document.querySelectorAll('.btn-celda-agendar').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var dia = Number(btn.getAttribute('data-dia'));
      var hora = btn.getAttribute('data-hora');
      modalAgendar.setAttribute('data-dia', dia);
      modalAgendar.setAttribute('data-hora', hora);
      document.getElementById('modal-franja-info').textContent = DIAS_SEMANA[dia] + ' — ' + hora;
      if (modalAgendar) modalAgendar.style.display = 'flex';
    });
  });
  var btnCancelarAgendar = document.getElementById('btn-cancelar-agendar');
  if (btnCancelarAgendar) btnCancelarAgendar.addEventListener('click', function () { modalAgendar.style.display = 'none'; });

  var btnConfirmar = document.getElementById('btn-confirmar-agendar');
  if (btnConfirmar) {
    btnConfirmar.addEventListener('click', function () {
      var dia = Number(modalAgendar.getAttribute('data-dia'));
      var hora = modalAgendar.getAttribute('data-hora');
      var clases = cargarClases();

      var alumnoSel = document.getElementById('mo-alumno').value;
      var nuevaClase = {
        programa: document.getElementById('mo-programa').value,
        tipo: document.getElementById('mo-tipo').value,
        dia: dia, hora: hora,
        sala: document.getElementById('mo-sala').value.trim(),
        alumnos: alumnoSel !== '' ? [Number(alumnoSel)] : [],
        alumnosFechas: alumnoSel !== '' ? (function () { var o = {}; o[Number(alumnoSel)] = lunesDeFecha(new Date().toISOString().slice(0, 10)); return o; })() : {}
      };
      clases.push(nuevaClase);
      guardarClases(clases);

      modalAgendar.style.display = 'none';
      renderContenido('horarios');
    });
  }

  document.querySelectorAll('.celda-clase').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = Number(el.getAttribute('data-clase-idx'));
      modalAsignar.setAttribute('data-clase-idx', idx);
      var clases = cargarClases();
      var c = clases[idx];
      document.getElementById('modal-asignar-info').textContent = c.programa + ' — ' + DIAS_SEMANA[c.dia] + ' ' + c.hora;
      document.getElementById('as-nombre').value = '';
      document.getElementById('as-programa').value = c.programa;
      document.getElementById('as-observaciones').value = '';
      modalAsignar.style.display = 'flex';
    });
  });
  var btnCancelarAsignar = document.getElementById('btn-cancelar-asignar');
  if (btnCancelarAsignar) btnCancelarAsignar.addEventListener('click', function () { modalAsignar.style.display = 'none'; });

  var btnConfirmarAsignar = document.getElementById('btn-confirmar-asignar');
  if (btnConfirmarAsignar) {
    btnConfirmarAsignar.addEventListener('click', function () {
      var idxClase = Number(modalAsignar.getAttribute('data-clase-idx'));
      var nombreCompleto = document.getElementById('as-nombre').value.trim();
      var programaElegido = document.getElementById('as-programa').value;
      var observaciones = document.getElementById('as-observaciones').value.trim();
      if (!nombreCompleto) { alert('El nombre del estudiante es obligatorio.'); return; }

      // El horario es solo un espacio de tiempo — no se liga a un profesor
      // fijo (los profesores pueden ir variando) — por eso acá solo se pide
      // nombre, programa y observaciones, sin tocar clase.profesor.
      // La fecha se guarda como el lunes de esta semana (no el día exacto):
      // así, si hoy es domingo, el estudiante igual queda visible desde la
      // semana actual en la grilla (que solo tiene columnas lunes a sábado).
      var fechaAltaNueva = lunesDeFecha(new Date().toISOString().slice(0, 10));
      var partes = nombreCompleto.split(' ');
      var alumnos = cargarAlumnos();
      var nuevoIdx = alumnos.length;
      alumnos.push({
        nombres: partes[0] || nombreCompleto,
        apellidos: partes.slice(1).join(' '),
        documento: '', nacimiento: '', programa: programaElegido, programa2: '',
        profesor: '', telefono: '', correo: '', direccion: '', acudiente: '', celularAcudiente: '',
        observaciones: observaciones, estado: 'activo', fechaMatricula: fechaAltaNueva
      });
      guardarAlumnos(alumnos);

      var clases = cargarClases();
      var c = clases[idxClase];
      c.alumnos = c.alumnos || [];
      c.alumnosFechas = c.alumnosFechas || {};
      c.alumnos.push(nuevoIdx);
      c.alumnosFechas[nuevoIdx] = fechaAltaNueva;
      guardarClases(clases);

      modalAsignar.style.display = 'none';
      renderContenido('horarios');
    });
  }
}

var COLOR_ESTADO_ASISTENCIA = {
  asistio: '#2e7d32', falta: '#b3261e', excusa: '#E78C3B',
  cancelada: '#6b7686', reprogramada: '#93B6EE', recuperada: '#7c5cbf'
};

function renderAsistencia(sesion) {
  var alumnos = cargarAlumnos();
  var clases = cargarClases();
  var asistencias = cargarAsistencias();
  var esProfesor = sesion.rol === 'PROFESOR';

  var semana = semanaAsistenciaSeleccionada;
  var hoyStr = new Date().toISOString().slice(0, 10);
  // Respaldo para estudiantes viejos sin fecha registrada — el lunes de
  // esta semana, para que sigan viéndose en la semana actual en adelante.
  var respaldoFechaAsistencia = lunesDeFecha(hoyStr);

  var filasGrilla = FRANJAS.map(function (franja) {
    var celdas = COLUMNAS_DIAS.map(function (dia) {
      var esSabado = dia === 6;
      var hora = esSabado ? franja.horaSabado : franja.horaLunVie;
      var fechaCelda = fechaColumnaSemana(semana, dia);
      var ocupantes = clasesDeCelda(clases, dia, hora);
      if (esProfesor) ocupantes = ocupantes.filter(function (o) { return o.c.profesor === sesion.email; });
      if (filtroProgramaAsistencia !== 'General') ocupantes = ocupantes.filter(function (o) { return o.c.programa === filtroProgramaAsistencia; });

      var esHoy = fechaCelda === hoyStr;

      var contenidoOcupantes = ocupantes.map(function (o) {
        // Un estudiante solo debe salir para tomar asistencia desde el día
        // de su matrícula en adelante — nunca en fechas anteriores.
        var listaAlumnos = (o.c.alumnos || []).filter(function (idxAlumno) {
          var al = alumnos[idxAlumno];
          if (!al) return false;
          var fechaAlta = al.fechaMatricula || respaldoFechaAsistencia;
          return fechaAlta <= fechaCelda;
        });
        var filasEstudiantes = listaAlumnos.map(function (idxAlumno) {
          var alumno = alumnos[idxAlumno];
          if (!alumno) return '';
          var registro = asistencias.find(function (a) { return a.alumnoIdx === idxAlumno && a.claseIdx === o.i && a.fecha === fechaCelda; });
          var estadoActual = registro ? registro.estado : '';
          var colorEstado = estadoActual ? (COLOR_ESTADO_ASISTENCIA[estadoActual] || '#ccc') : '#ccc';
          var opciones = '<option value="">—</option>' +
            ESTADOS_ASISTENCIA_RAPIDA.map(function (e) { return '<option value="' + e + '"' + (e === estadoActual ? ' selected' : '') + '>' + ETIQUETA_ASISTENCIA[e] + '</option>'; }).join('');
          return '' +
            '<div style="display:flex; justify-content:space-between; align-items:center; gap:4px; margin-bottom:3px;">' +
            '<span style="font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:78px;" title="' + alumno.nombres + ' ' + alumno.apellidos + '">' + alumno.nombres + ' ' + alumno.apellidos.split(' ')[0] + '</span>' +
            '<select class="select-asistencia-rapida" data-alumno-idx="' + idxAlumno + '" data-clase-idx="' + o.i + '" data-fecha="' + fechaCelda + '" style="font-size:10px; padding:1px 2px; border-radius:4px; border:1px solid ' + colorEstado + '; color:' + (estadoActual ? colorEstado : 'var(--muted)') + '; background:#fff; max-width:78px;">' +
            opciones + '</select>' +
            '</div>';
        }).join('');

        return '<div class="celda-clase-asistencia" style="font-size:11px; text-align:left; background:#fff; border-radius:5px; padding:5px 6px; margin-bottom:4px;">' +
          '<div style="font-weight:600; margin-bottom:3px;">' + chipPrograma(o.c.programa) + '</div>' +
          (filasEstudiantes || '<div style="color:var(--muted); font-style:italic; font-size:10.5px;">sin estudiantes todavía</div>') +
          '</div>';
      }).join('');

      var etiquetaHoraCelda = '<div style="font-size:10px; font-weight:700; color:' + (esHoy ? 'var(--azul-oscuro)' : 'var(--muted)') + '; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.02em;">' + (esSabado ? franja.etiquetaSabado : franja.etiquetaLunVie) + '</div>';

      return '<td style="border-left:3px solid ' + (esHoy ? 'var(--naranja)' : '#ddd') + '; background:#fff; padding:6px; vertical-align:top; min-width:130px;">' + etiquetaHoraCelda + (contenidoOcupantes || '<p style="font-size:10.5px; color:var(--muted); margin:0;">Sin clases</p>') + '</td>';
    }).join('');

    var filaFranja = '<tr><td style="font-size:11px; color:var(--muted); font-weight:600; padding:6px; white-space:nowrap; vertical-align:top;">' + franja.etiquetaLunVie + '</td>' + celdas + '</tr>';
    var esUltima = FRANJAS.indexOf(franja) === FRANJAS.length - 1;
    var filaDivisoria = esUltima ? '' : '<tr><td colspan="' + (COLUMNAS_DIAS.length + 1) + '" style="padding:0; border:none;"><div style="height:1px; background:#e6e6e6; margin:2px 4px;"></div></td></tr>';
    return filaFranja + filaDivisoria;
  }).join('');

  var encabezado = '<tr><td></td>' + COLUMNAS_DIAS.map(function (d) {
    var fechaCol = fechaColumnaSemana(semana, d);
    var esHoy = fechaCol === hoyStr;
    var fechaCorta = fechaCol.slice(8, 10) + '/' + fechaCol.slice(5, 7);
    return '<td style="font-size:12px; font-weight:700; text-align:center; padding:6px; color:' + (esHoy ? 'var(--naranja)' : 'var(--azul-oscuro)') + ';">' + DIAS_SEMANA[d] + '<br><span style="font-size:10.5px; font-weight:600; color:var(--muted);">' + fechaCorta + '</span></td>';
  }).join('') + '</tr>';

  var botonesFiltro = '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;">' +
    ['General'].concat(PROGRAMAS).map(function (p) {
      var activo = p === filtroProgramaAsistencia;
      var color = p === 'General' ? 'var(--azul-oscuro)' : colorPrograma(p);
      return '<button class="btn-filtro-programa-asistencia" data-programa="' + p + '" style="font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; border:1.5px solid ' + (activo ? color : '#ddd') + '; background:' + (activo ? color : '#fff') + '; color:' + (activo ? '#fff' : 'var(--texto)') + ';">' + p + '</button>';
    }).join('') +
    '</div>';

  var leyenda = '<div style="display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--muted); flex-wrap:wrap;">' +
    ESTADOS_ASISTENCIA_RAPIDA.map(function (e) {
      return '<span><span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:' + COLOR_ESTADO_ASISTENCIA[e] + '; margin-right:4px;"></span>' + ETIQUETA_ASISTENCIA[e] + '</span>';
    }).join('') +
    '</div>';

  var grillaHtml =
    '<div class="campo" style="max-width:220px; margin-bottom:14px;"><label>Semana a registrar</label><input id="asis-semana-grilla" type="week" value="' + semana + '" /></div>' +
    botonesFiltro +
    '<div class="tabla-scroll"><table style="border-collapse:separate; border-spacing:4px; width:100%;">' + encabezado + filasGrilla + '</table></div>' +
    leyenda;

  // Historial completo (todas las fechas) — se conserva como consulta aparte de la grilla de la semana.
  var clasesVisiblesHistorial = esProfesor ? clases.filter(function (c) { return c.profesor === sesion.email; }) : clases;
  var asistenciasHistorial = esProfesor
    ? asistencias.filter(function (a) { return clasesVisiblesHistorial.indexOf(clases[a.claseIdx]) !== -1; })
    : asistencias;
  var filasHistorial = asistenciasHistorial.slice().reverse().map(function (a) {
    var alumno = alumnos[a.alumnoIdx];
    var clase = clases[a.claseIdx];
    var color = COLOR_ESTADO_ASISTENCIA[a.estado] || 'var(--muted)';
    return '<tr><td>' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '—') + '</td>' +
      '<td>' + (clase ? clase.programa : '—') + '</td><td>' + a.fecha + '</td>' +
      '<td><span style="display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; background:' + color + ';">' + ETIQUETA_ASISTENCIA[a.estado] + '</span></td></tr>';
  }).join('');

  // Buscador de historial individual — filtra el listado de estudiantes por
  // nombre y muestra su histórico de asistencias en orden, con opción de
  // imprimir/descargar en PDF.
  var alumnosParaSelector = esProfesor
    ? alumnos.map(function (a, i) { return { a: a, i: i }; }).filter(function (o) { return clasesVisiblesHistorial.some(function (c) { return (c.alumnos || []).indexOf(o.i) !== -1; }); })
    : alumnos.map(function (a, i) { return { a: a, i: i }; });

  var terminoBusqueda = (busquedaHistorialAsistencia || '').trim().toLowerCase();
  var alumnosFiltrados = terminoBusqueda
    ? alumnosParaSelector.filter(function (o) { return (o.a.nombres + ' ' + o.a.apellidos).toLowerCase().indexOf(terminoBusqueda) !== -1; })
    : alumnosParaSelector;

  var opcionesAlumnoHistorial = '<option value="">Seleccioná un estudiante…</option>' +
    alumnosFiltrados.map(function (o) { return '<option value="' + o.i + '"' + (o.i === alumnoHistorialAsistenciaIdx ? ' selected' : '') + '>' + o.a.nombres + ' ' + o.a.apellidos + '</option>'; }).join('');

  var contenidoHistorialIndividual = '<p style="font-size:13px; color:var(--muted);">Buscá y elegí un estudiante para ver su historial de asistencias en orden.</p>';
  var alumnoHistorial = alumnoHistorialAsistenciaIdx !== null ? alumnos[alumnoHistorialAsistenciaIdx] : null;

  if (alumnoHistorial) {
    var registrosAlumno = asistenciasHistorial.filter(function (a) { return a.alumnoIdx === alumnoHistorialAsistenciaIdx; }).slice().sort(function (a, b) { return a.fecha.localeCompare(b.fecha); });
    if (registrosAlumno.length === 0) {
      contenidoHistorialIndividual = '<p style="font-size:13px; color:var(--muted);">Este estudiante todavía no tiene asistencias registradas.</p>';
    } else {
      var conteos = {};
      ESTADOS_ASISTENCIA_RAPIDA.forEach(function (e) { conteos[e] = 0; });
      var filasAlumno = registrosAlumno.map(function (a) {
        var clase = clases[a.claseIdx];
        var color = COLOR_ESTADO_ASISTENCIA[a.estado] || 'var(--muted)';
        conteos[a.estado] = (conteos[a.estado] || 0) + 1;
        var diaTxt = DIAS_SEMANA[new Date(a.fecha + 'T00:00:00').getDay()];
        return '<tr><td>' + a.fecha + '</td><td>' + diaTxt + '</td><td>' + (clase ? clase.programa : '—') + '</td>' +
          '<td><span style="display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; background:' + color + ';">' + ETIQUETA_ASISTENCIA[a.estado] + '</span></td></tr>';
      }).join('');
      var resumenTxt = ESTADOS_ASISTENCIA_RAPIDA.map(function (e) { return ETIQUETA_ASISTENCIA[e] + ': ' + (conteos[e] || 0); }).join(' · ');
      contenidoHistorialIndividual = '' +
        '<p style="font-size:12px; color:var(--muted); margin-bottom:10px;">' + registrosAlumno.length + ' registro' + (registrosAlumno.length === 1 ? '' : 's') + ' — ' + resumenTxt + '</p>' +
        '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Fecha</th><th>Día</th><th>Programa</th><th>Estado</th></tr></thead><tbody>' + filasAlumno + '</tbody></table></div>';
    }
  }

  var panelHistorialIndividual =
    '<div class="panel"><h2>Historial por estudiante</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Buscá por nombre, elegí el estudiante y descargá o imprimí su histórico de asistencias.</p>' +
    '<div class="campo" style="max-width:320px;"><label>Buscar estudiante</label><input id="asis-buscar-alumno" type="text" placeholder="Nombre del estudiante…" value="' + (busquedaHistorialAsistencia || '').replace(/"/g, '&quot;') + '" /></div>' +
    '<div class="campo" style="max-width:320px;"><label>Estudiante</label><select id="asis-alumno-historial">' + opcionesAlumnoHistorial + '</select></div>' +
    '<div id="asis-historial-individual-contenido">' + contenidoHistorialIndividual + '</div>' +
    (alumnoHistorial ? '<button class="btn-primario" id="btn-asis-historial-pdf" style="max-width:260px; margin-top:12px;">Imprimir / descargar PDF</button>' : '') +
    '</div>';

  return '' +
    '<div class="panel"><h2>Asistencia' + (esProfesor ? ' — tus clases' : '') + '</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Elegí la semana a registrar — cada columna usa su fecha real (lunes a sábado). El día de hoy queda resaltado en naranja. Marcá el estado al lado de cada estudiante; se guarda al instante. Se actualiza solo cuando se agrega o quita gente en Horarios.</p>' +
    grillaHtml +
    '</div>' +

    panelHistorialIndividual +

      : '<p style="font-size:13px; color:var(--muted);">Sin registros todavía.</p>') +

function generarHtmlHistorialAsistencia(alumno, registros) {
  var filas = registros.map(function (a) {
    var color = COLOR_ESTADO_ASISTENCIA[a.estado] || '#666';
    return '<tr><td style="padding:4px 0;">' + a.fecha + '</td><td style="padding:4px 0;">' + DIAS_SEMANA[new Date(a.fecha + 'T00:00:00').getDay()] + '</td>' +
      '<td style="padding:4px 0; text-align:right; color:' + color + '; font-weight:600;">' + ETIQUETA_ASISTENCIA[a.estado] + '</td></tr>';
  }).join('');

  var conteos = {};
  ESTADOS_ASISTENCIA_RAPIDA.forEach(function (e) { conteos[e] = 0; });
  registros.forEach(function (a) { conteos[a.estado] = (conteos[a.estado] || 0) + 1; });
  var resumenTxt = ESTADOS_ASISTENCIA_RAPIDA.map(function (e) { return ETIQUETA_ASISTENCIA[e] + ': ' + (conteos[e] || 0); }).join(' · ');

  return '' +
    '<div style="font-family:Arial,sans-serif; max-width:420px; margin:0 auto; padding:24px; border:1px solid #ccc;">' +
    '<div style="text-align:center; border-bottom:2px solid #223F61; padding-bottom:12px; margin-bottom:16px;">' +
    '<div style="font-size:20px; font-weight:bold; color:#223F61;">Jacquin</div>' +
    '<div style="font-size:11px; letter-spacing:2px; color:#666;">ACADEMIA MUSICAL</div>' +
    '</div>' +
    '<h3 style="text-align:center; margin:0 0 6px;">Historial de asistencia</h3>' +
    '<p style="text-align:center; font-size:13px; color:#666; margin:0 0 10px;">' + (alumno ? alumno.nombres + ' ' + alumno.apellidos : '') + ' — ' + (alumno ? alumno.programa : '') + '</p>' +
    '<p style="text-align:center; font-size:11.5px; color:#666; margin:0 0 16px;">' + resumenTxt + '</p>' +
    '<table style="width:100%; font-size:12px; border-collapse:collapse;"><thead><tr><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666;">Fecha</td><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666;">Día</td><td style="border-bottom:1px solid #ccc; padding-bottom:4px; color:#666; text-align:right;">Estado</td></tr></thead><tbody>' + filas + '</tbody></table>' +
    '<p style="text-align:center; font-size:11px; color:#999; margin-top:20px;">Academia Musical Jacquin — historial de asistencia</p>' +
    '</div>';
}

function activarLogicaAsistencia() {
  var campoSemana = document.getElementById('asis-semana-grilla');
  if (campoSemana) {
    campoSemana.addEventListener('change', function () {
      if (this.value) semanaAsistenciaSeleccionada = this.value;
      renderContenido('asistencia');
    });
  }

  document.querySelectorAll('.btn-filtro-programa-asistencia').forEach(function (btn) {
    btn.addEventListener('click', function () {
      filtroProgramaAsistencia = btn.getAttribute('data-programa');
      renderContenido('asistencia');
    });
  });

  document.querySelectorAll('.select-asistencia-rapida').forEach(function (select) {
    select.addEventListener('change', function () {
      var alumnoIdx = Number(this.getAttribute('data-alumno-idx'));
      var claseIdx = Number(this.getAttribute('data-clase-idx'));
      var fechaCelda = this.getAttribute('data-fecha');
      var estado = this.value;

      var asistencias = cargarAsistencias();
      var existenteIdx = asistencias.findIndex(function (a) { return a.alumnoIdx === alumnoIdx && a.claseIdx === claseIdx && a.fecha === fechaCelda; });

      if (!estado) {
        // Volver a "—" borra el registro de ese día.
        if (existenteIdx !== -1) asistencias.splice(existenteIdx, 1);
      } else if (existenteIdx !== -1) {
        asistencias[existenteIdx].estado = estado;
      } else {
        asistencias.push({ alumnoIdx: alumnoIdx, claseIdx: claseIdx, fecha: fechaCelda, estado: estado });
      }
      guardarAsistencias(asistencias);

      if (estado === 'falta') {
        var faltasRecientes = asistencias.filter(function (a) { return a.alumnoIdx === alumnoIdx && a.estado === 'falta'; });
        if (faltasRecientes.length >= UMBRAL_ALERTA_FALTAS) {
          alert('⚠ Este estudiante acumula ' + faltasRecientes.length + ' faltas registradas — considerar contactar al acudiente.');
        }
      }

      renderContenido('asistencia');
    });
  });

  var campoBuscarAlumno = document.getElementById('asis-buscar-alumno');
  if (campoBuscarAlumno) {
    campoBuscarAlumno.addEventListener('input', function () {
      busquedaHistorialAsistencia = this.value;
      renderContenido('asistencia');
      // Devuelve el foco al buscador después de re-renderizar, para poder seguir escribiendo.
      var campo = document.getElementById('asis-buscar-alumno');
      if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    });
  }

  var selectAlumnoHistorial = document.getElementById('asis-alumno-historial');
  if (selectAlumnoHistorial) {
    selectAlumnoHistorial.addEventListener('change', function () {
      alumnoHistorialAsistenciaIdx = this.value === '' ? null : Number(this.value);
      renderContenido('asistencia');
    });
  }

  var btnHistorialPdf = document.getElementById('btn-asis-historial-pdf');
  if (btnHistorialPdf) {
    btnHistorialPdf.addEventListener('click', function () {
      var alumno = cargarAlumnos()[alumnoHistorialAsistenciaIdx];
      var asistenciasAlumno = cargarAsistencias().filter(function (a) { return a.alumnoIdx === alumnoHistorialAsistenciaIdx; }).slice().sort(function (a, b) { return a.fecha.localeCompare(b.fecha); });
      if (asistenciasAlumno.length === 0) { alert('Este estudiante todavía no tiene asistencias registradas.'); return; }

      document.getElementById('comprobante-imprimir').innerHTML = generarHtmlHistorialAsistencia(alumno, asistenciasAlumno);
      window.print();
    });
  }
}

function renderProfesores(sesion) {
  var usuariosDemo = cargarUsuarios();
  var profesores = usuariosDemo.filter(function (u) { return u.rol === 'PROFESOR'; });
  var perfiles = cargarPerfilesProfesor();
  var alumnos = cargarAlumnos();
  var clases = cargarClases();
  var esProfesor = sesion.rol === 'PROFESOR';

  if (esProfesor) {
    // Espacio de trabajo único del profesor: solo lo suyo, nada más.
    // Esto reemplaza cualquier vista general — un profesor nunca ve la
    // lista completa de estudiantes ni de horarios de la academia.
    var misAlumnos = alumnos.filter(function (a) { return a.profesor === sesion.email; });
    var misClases = clases.filter(function (c) { return c.profesor === sesion.email; });

    var filasMisAlumnos = misAlumnos.map(function (a) {
      return '<tr><td>' + a.nombres + ' ' + a.apellidos + '</td><td>' + a.programa + '</td><td><span class="chip-rol">' + ETIQUETA_ESTADO[a.estado] + '</span></td></tr>';
    }).join('');

    var filasMisClases = misClases.map(function (c) {
      var nombresAlumnos = (c.alumnos || []).map(function (idx) { return alumnos[idx] ? alumnos[idx].nombres + ' ' + alumnos[idx].apellidos : ''; }).filter(Boolean);
      return '<tr><td>' + DIAS_SEMANA[c.dia] + '</td><td>' + c.hora + '</td><td>' + c.programa + '</td><td>' + c.tipo + '</td><td>' + (nombresAlumnos.join(', ') || '—') + '</td></tr>';
    }).join('');

    return '' +
      '<div class="panel"><h2>Mi espacio de trabajo</h2>' +
      '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Solo tus estudiantes y tus horarios — no ves el resto de la academia.</p>' +
      '</div>' +
      '<div class="panel"><h2>Mis estudiantes (' + misAlumnos.length + ')</h2>' +
      (misAlumnos.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Todavía no tenés estudiantes asignados.</p>' :
       '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Programa</th><th>Estado</th></tr></thead><tbody>' + filasMisAlumnos + '</tbody></table></div>') +
      '</div>' +
      '<div class="panel"><h2>Mis horarios (' + misClases.length + ')</h2>' +
      (misClases.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Todavía no tenés clases asignadas.</p>' :
       '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Día</th><th>Hora</th><th>Programa</th><th>Tipo</th><th>Estudiantes</th></tr></thead><tbody>' + filasMisClases + '</tbody></table></div>') +
      '</div>';
  }

  // Vista de administración: coexistencia de datos — cada profesor con
  // sus estudiantes asignados y sus horarios, todo en una sola tabla.
  var filasConsolidado = profesores.map(function (p) {
    var suyos = alumnos.filter(function (a) { return a.profesor === p.email; });
    var suyasClases = clases.filter(function (c) { return c.profesor === p.email; });
    var listaAlumnos = suyos.length ? suyos.map(function (a) { return a.nombres + ' ' + a.apellidos; }).join(', ') : '—';
    var listaHorarios = suyasClases.length ? suyasClases.map(function (c) { return DIAS_SEMANA[c.dia].slice(0, 3) + ' ' + c.hora; }).join(', ') : '—';
    return '<tr><td>' + p.nombre + '</td><td>' + listaAlumnos + '</td><td>' + listaHorarios + '</td></tr>';
  }).join('');

  var filasPerfil = profesores.map(function (p) {
    var perfil = perfiles[p.email] || {};
    return '<tr><td>' + p.nombre + '</td><td>' + p.email + '</td><td>' + (perfil.instrumentos || '—') + '</td><td>' + (perfil.telefono || '—') + '</td></tr>';
  }).join('');

  return '' +
    '<div class="panel"><h2>Profesores, estudiantes y horarios (' + profesores.length + ')</h2>' +
    '<p style="font-size:12px; color:var(--muted); margin-top:-6px;">Vista consolidada — quién enseña, a quiénes y cuándo.</p>' +
    (profesores.length === 0 ? '<p style="font-size:13px; color:var(--muted);">Todavía no hay profesores.</p>' :
     '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Profesor</th><th>Estudiantes asignados</th><th>Horarios</th></tr></thead><tbody>' + filasConsolidado + '</tbody></table></div>') +
    '</div>' +

    '<div class="panel"><h2>Agregar profesor</h2>' +
    '<div class="grilla-2col">' +
    '<div class="campo"><label>Nombre</label><input id="np-nombre" type="text" /></div>' +
    '<div class="campo"><label>Email</label><input id="np-email" type="email" /></div>' +
    '<div class="campo"><label>Instrumento que enseña</label><select id="np-instrumentos">' +
    PROGRAMAS.map(function (pr) { return '<option value="' + pr + '">' + pr + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="campo"><label>Teléfono</label><input id="np-telefono" type="text" /></div>' +
    '<div class="campo"><label>Experiencia</label><input id="np-experiencia" type="text" placeholder="Ej: 8 años enseñando piano clásico" /></div>' +
    '<div class="campo"><label>Fecha de nacimiento (opcional)</label><input id="np-nacimiento" type="date" /></div>' +
    '</div>' +
    '<button class="btn-primario" id="btn-agregar-profesor" style="max-width:280px;">Agregar profesor</button>' +
    '<p id="msj-profesor-nuevo" style="font-size:12px; color:var(--verde); display:none; margin-top:8px;">Profesor agregado — ya puede iniciar sesión (cualquier contraseña sirve en esta demo).</p>' +
    '</div>' +

    '<div class="panel"><h2>Perfiles</h2>' +
    (profesores.length === 0 ? '<p style="font-size:13px; color:var(--muted);">—</p>' :
     '<div class="tabla-scroll"><table class="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>Instrumento</th><th>Teléfono</th></tr></thead><tbody>' + filasPerfil + '</tbody></table></div>') +
    '</div>';
}

function renderCursos() {
  var alumnos = cargarAlumnos();
  var usuariosDemo = cargarUsuarios();
  var profesores = usuariosDemo.filter(function (u) { return u.rol === 'PROFESOR'; });
  var clases = cargarClases();
  var COLORES_ACENTO = ['#223F61', '#93B6EE', '#E78C3B'];

  function horarioDeAlumnoEnPrograma(alumnoIdx, programa) {
    var clase = clases.find(function (c) { return c.programa === programa && (c.alumnos || []).indexOf(alumnoIdx) !== -1; });
    if (!clase) return null;
    var franja = FRANJAS.find(function (fr) { return (clase.dia === 6 ? fr.horaSabado : fr.horaLunVie) === clase.hora; });
    var etiquetaHora = franja ? (clase.dia === 6 ? franja.etiquetaSabado : franja.etiquetaLunVie) : clase.hora;
    return DIAS_SEMANA[clase.dia] + ' · ' + etiquetaHora;
  }

  var tarjetasHtml = PROGRAMAS.map(function (programa, idx) {
    var alumnosPrograma = alumnos.map(function (a, i) { return { a: a, i: i }; }).filter(function (o) { return o.a.programa === programa; });
    var colorAcento = COLORES_ACENTO[idx % 3];

    var filas = alumnosPrograma.map(function (o) {
      var prof = profesores.find(function (p) { return p.email === o.a.profesor; });

        '<td><span class="chip-rol">' + ETIQUETA_ESTADO[o.a.estado] + '</span></td>' +
        '</tr>';
    }).join('');

    return '' +
      '<div class="panel tarjeta-programa" style="border-top:4px solid ' + colorAcento + '; margin-bottom:16px;">' +
      '<div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;">' +
      '<h2 style="margin:0;">' + programa + '</h2>' +
      '<span style="font-size:12px; color:var(--muted); font-weight:600;">' + alumnosPrograma.length + ' estudiante' + (alumnosPrograma.length === 1 ? '' : 's') + '</span>' +

        : '<div class="tabla-scroll" style="margin-top:10px;"><table class="tabla-usuarios"><thead><tr><th>Estudiante</th><th>Profesor</th><th>Horario</th><th>Estado</th></tr></thead><tbody>' + filas + '</tbody></table></div>') +
      '</div>';
  }).join('');

  var profesoresDisponibles = profesores;
  var formularioAlta =
    '<div class="panel"><h2>Registrar nuevo estudiante</h2>' +
    '<div class="campo"><label>Nombres</label><input id="al-nombres" type="text" /></div>' +
    '<div class="campo"><label>Apellidos</label><input id="al-apellidos" type="text" /></div>' +
    '<div class="campo"><label>Documento</label><input id="al-documento" type="text" /></div>' +
    '<div class="campo"><label>Fecha de nacimiento</label><input id="al-nacimiento" type="date" /></div>' +
    '<div class="campo"><label>Edad</label><input id="al-edad" type="text" readonly style="background:var(--beige);" /></div>' +
    '<div class="campo"><label>Programa 1</label><select id="al-programa">' +
    PROGRAMAS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="campo"><label>Programa 2 (opcional)</label><select id="al-programa2">' +
    '<option value="">Ninguno</option>' +
    PROGRAMAS.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="campo"><label>Profesor asignado (opcional)</label><select id="al-profesor">' +
    '<option value="">Sin asignar todavía</option>' +
    profesoresDisponibles.map(function (p) { return '<option value="' + p.email + '">' + p.nombre + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="campo"><label>Teléfono de contacto</label><input id="al-telefono" type="text" /></div>' +
    '<div class="campo"><label>Correo electrónico</label><input id="al-correo" type="email" /></div>' +
    '<div class="campo"><label>Dirección</label><input id="al-direccion" type="text" /></div>' +

    '<p id="aviso-menor" style="font-size:12px; color:var(--naranja); display:none; margin:-4px 0 10px;">Alumno menor de edad: el acudiente es obligatorio.</p>' +

}

// ---- Panel "Evaluación mensual" — listado de estudiantes visibles (nombre,
// edad, curso) con su estado del mes en curso (evaluado / pendiente) y un
// modal con las 8 preguntas cualitativas para registrar o editar.
function renderEvaluacionMensualPanel(sesion) {
  var alumnos = cargarAlumnos();
  var esProfesor = sesion.rol === 'PROFESOR';
  var visibles = esProfesor
    ? alumnos.map(function (a, i) { return { a: a, i: i }; }).filter(function (o) { return o.a.profesor === sesion.email; })
    : alumnos.map(function (a, i) { return { a: a, i: i }; });

  if (visibles.length === 0) {
    return '<div class="panel"><p style="font-size:13px; color:var(--muted);">' + (esProfesor ? 'No tenés estudiantes asignados todavía.' : 'Todavía no hay estudiantes registrados.') + '</p></div>';
  }

  var mesActual = mesActualStr();
  var mesLegible = new Date(mesActual + '-01T00:00:00').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
  var evaluacionesMensuales = cargarEvaluacionesMensuales();
  var evaluacionesDelMes = evaluacionesMensuales.filter(function (e) { return e.mes === mesActual; });

  // Buscador por nombre — filtra el listado antes de ordenarlo.
  var terminoBusquedaAvance = (busquedaAvanceMensual || '').trim().toLowerCase();
  var visiblesFiltrados = terminoBusquedaAvance
    ? visibles.filter(function (o) { return (o.a.nombres + ' ' + o.a.apellidos).toLowerCase().indexOf(terminoBusquedaAvance) !== -1; })
    : visibles;

  // Orden: primero quienes ya tienen la evaluación de este mes registrada,
  // debajo los pendientes — dentro de cada grupo, alfabético por nombre.
  var visiblesConEstado = visiblesFiltrados.map(function (o) {
    var evaluado = evaluacionesDelMes.find(function (e) { return e.alumnoIdx === o.i; });
    return { o: o, evaluado: evaluado };
  }).sort(function (x, y) {
    if (!!x.evaluado !== !!y.evaluado) return x.evaluado ? -1 : 1;
    return (x.o.a.nombres + x.o.a.apellidos).localeCompare(y.o.a.nombres + y.o.a.apellidos);
  });

  var buscadorHtml = '<div class="campo" style="max-width:320px; margin-bottom:14px;"><label>Buscar estudiante</label><input id="av-buscar-alumno" type="text" placeholder="Nombre del estudiante…" value="' + (busquedaAvanceMensual || '').replace(/"/g, '&quot;') + '" /></div>';

    : visiblesConEstado.map(function (x) {
